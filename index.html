<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Математический блиц · 11 класс</title>
<style>
  :root{
    --bg:#f3f4fa; --card:#ffffff; --ink:#161a2e; --muted:#6b7190;
    --line:#e6e8f4; --accent:#4f46e5; --accent2:#7c3aed;
    --ok:#0f9d58; --okbg:#effaf3; --okline:#bde8cd;
    --bad:#e5484d; --badbg:#fef2f2; --badline:#f6c9cb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(900px 500px at 8% -10%, #e7e9ff 0%, transparent 60%),
      radial-gradient(800px 500px at 110% 0%, #ffe9f3 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%;
  }
  .app{max-width:560px;margin:0 auto;padding:18px 16px calc(44px + env(safe-area-inset-bottom))}

  /* ---------- кнопки ---------- */
  .btn{
    border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;
    font-family:inherit;cursor:pointer;line-height:1.2;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{
    background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;width:100%;
    box-shadow:0 10px 22px -10px rgba(79,70,229,.6);
  }
  .btn.soft{background:#eef0f7;color:#33385c;font-size:14.5px;padding:13px 10px;flex:1}
  .btn.hint{
    background:#fff7e6;color:#a16207;border:1px solid #fde68a;
    font-size:14px;padding:10px 14px;border-radius:12px;
    box-shadow:none;
  }
  .btn.hint:disabled{opacity:.45;pointer-events:none}
  .iconbtn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
    font-size:16px;cursor:pointer;color:#565b7e;line-height:1;flex:0 0 auto;
  }

  /* ---------- старт ---------- */
  .hero{
    background:linear-gradient(135deg,#4f46e5 0%, #7c3aed 55%, #db2777 130%);
    border-radius:24px;padding:22px 20px 24px;color:#fff;
    position:relative;overflow:hidden;
    box-shadow:0 18px 40px -18px rgba(79,70,229,.6);
  }
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(220px 120px at 88% -10%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(200px 140px at -10% 120%, rgba(255,255,255,.18), transparent 60%);
  }
  .hero-badge{
    display:inline-block;font-size:12px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    padding:6px 12px;border-radius:999px;margin-bottom:14px;
  }
  .hero h1{margin:0 0 8px;font-size:27px;line-height:1.15;letter-spacing:-.01em}
  .hero p{margin:0;font-size:15px;line-height:1.45;color:rgba(255,255,255,.88);max-width:46ch}

  .card{
    background:var(--card);border-radius:22px;padding:18px;
    border:1px solid rgba(230,232,244,.9);
    box-shadow:0 16px 40px -26px rgba(23,26,46,.35);
    margin-top:14px;
  }
  .namelabel{display:block;font-size:13px;font-weight:700;color:#41466a;margin-bottom:7px}
  .namelabel span{color:#9a9db8;font-weight:600}
  #nameInput{
    width:100%;font-size:16px;font-family:inherit;padding:13px 14px;border-radius:12px;
    border:1.5px solid #dfe1f0;background:#fbfbfe;outline:none;color:var(--ink);
  }
  #nameInput:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.14);background:#fff}

  .mixwrap{margin-top:16px}
  .mixbtn{font-size:16.5px;padding:15px}
  .mixnote{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.4}

  .orline{
    display:flex;align-items:center;gap:12px;margin:18px 0 12px;
    color:#9a9db8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  }
  .orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

  .topics{display:flex;flex-direction:column;gap:9px}
  .topic{
    display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 13px;
    cursor:pointer;font-family:inherit;color:var(--ink);
    transition:border-color .15s, box-shadow .15s, transform .08s;
  }
  .topic:hover{border-color:#c9c6f7;box-shadow:0 6px 18px -12px rgba(79,70,229,.45)}
  .topic:active{transform:scale(.985)}
  .topic .emoji{
    width:42px;height:42px;border-radius:12px;background:#f1f0ff;
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;
  }
  .topic .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .topic .tt{font-size:15.5px;font-weight:700}
  .topic .tn{font-size:12.5px;color:var(--muted)}
  .topic .count{
    margin-left:auto;font-size:12.5px;font-weight:700;color:#7c3aed;background:#f4f1ff;
    padding:5px 9px;border-radius:999px;white-space:nowrap;
  }
  .footnote{margin-top:16px;font-size:12px;line-height:1.55;color:#8b8fb0;text-align:center}

  /* ---------- игра ---------- */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .barwrap{flex:1;height:9px;background:#e6e8f4;border-radius:999px;overflow:hidden}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#a855f7);border-radius:999px;transition:width .35s ease}
  .pcount{font-size:13px;font-weight:800;color:#6b7190;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;color:#3a3f63;
    font-variant-numeric:tabular-nums;
  }

  .qcard{
    background:#fff;border-radius:22px;padding:19px 18px;
    border:1px solid rgba(230,232,244,.9);
    box-shadow:0 14px 34px -24px rgba(23,26,46,.4);
  }
  .qtopic{
    font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#8b8fb0;margin-bottom:10px;
  }
  .qtext{font-size:18.5px;line-height:1.45;font-weight:600}

  .fig{background:#f8f8fe;border:1px solid #e9e8fb;border-radius:16px;padding:8px 10px;margin-bottom:14px}
  .fig svg{display:block;width:100%;height:auto}
  .lbl{font:700 15px ui-sans-serif,system-ui,sans-serif;fill:#3a3f63}

  .ansrow{display:flex;gap:8px;margin-top:18px}
  .btn.sign{
    flex:0 0 auto;width:50px;padding:0;font-size:20px;font-weight:800;
    background:#eef0f7;color:#33385c;border-radius:14px;
  }
  .ansrow input{
    flex:1;min-width:0;font-size:18px;font-weight:700;font-family:inherit;
    padding:13px 16px;border-radius:14px;border:1.5px solid #dfe1f0;outline:none;
    background:#fbfbfe;color:var(--ink);font-variant-numeric:tabular-nums;
  }
  .ansrow input:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.15);background:#fff}
  .ansrow input:disabled{opacity:.6}
  .ansrow .btn.primary{width:auto;white-space:nowrap;padding:13px 20px;font-size:15.5px}
  .ansrow .btn.primary:disabled{opacity:.55}

  .inlineerr{color:#b42318;font-size:13px;font-weight:700;margin-top:8px;display:none}

  .hintrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .hintnote{font-size:12px;color:#9a9db8}
  .hintbox{
    margin-top:12px;background:#fffaf0;border:1px solid #fbe3b3;border-radius:14px;
    padding:13px 14px;font-size:14.5px;line-height:1.5;color:#7a4f05;display:flex;gap:9px;
  }

  .fb{margin-top:16px;border-radius:16px;padding:15px 15px 16px;border:1px solid}
  .fb.ok{background:var(--okbg);border-color:var(--okline)}
  .fb.bad{background:var(--badbg);border-color:var(--badline)}
  .fb h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fb.ok h4{color:#0b7a43}
  .fb.bad h4{color:#b42318}
  .earned{margin-left:auto;font-size:14px;font-weight:800;color:#0b7a43}
  .ansline{font-size:14.5px;color:#454b6b;margin:2px 0 4px;line-height:1.5}
  .fbans{font-weight:800;font-size:16px;color:var(--ink)}
  .expTitle{
    font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#8b8fb0;margin:14px 0 2px;
  }
  .steps{margin:4px 0 0;padding:0;list-style:none;counter-reset:st}
  .steps li{
    position:relative;padding-left:34px;margin:11px 0;font-size:14.5px;line-height:1.5;
    color:#33385c;counter-increment:st;
  }
  .steps li::before{
    content:counter(st);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:8px;
    background:#eceafe;color:#5b4fd6;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .fb.ok .steps li::before{background:#e2f5ea;color:#0b7a43}
  .nextbtn{margin-top:16px}

  /* ---------- финал ---------- */
  .endcard{text-align:center;padding-top:22px}
  .endtitle{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:16px}
  .ring{
    width:134px;height:134px;border-radius:50%;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .ring .inner{
    width:106px;height:106px;border-radius:50%;background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring .big{font-size:31px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring .small{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
  .verdict{margin-top:14px;font-size:14.5px;color:#4b5074;line-height:1.5}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .stat{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
  .stat .sl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9a9db8}
  .stat .sv{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
  .endTopics{display:flex;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .tchip{
    display:inline-block;background:#f3f4fa;border:1px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:12.5px;font-weight:700;color:#4b5074;margin:4px 4px 0 0;
  }
  .tchip.good{background:var(--okbg);border-color:var(--okline);color:#0b7a43}
  .tchip.bad{background:var(--badbg);border-color:var(--badline);color:#b42318}
  .mistakesTitle{
    margin:22px 0 2px;text-align:left;font-size:12.5px;font-weight:800;
    color:#33385c;text-transform:uppercase;letter-spacing:.06em;
  }
  .mistake{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px;text-align:left}
  .mtag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8b8fb0;margin-bottom:6px}
  .mtext{font-size:14px;line-height:1.45;color:#33385c}
  .mline{margin-top:8px;font-size:13.5px;color:#6b7190}
  .mline b{color:var(--ink)}
  .perfect{
    margin-top:16px;background:var(--okbg);border:1px solid var(--okline);color:#0b7a43;
    font-weight:700;border-radius:14px;padding:12px;font-size:14.5px;
  }
  .endbtns{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  .row2{display:flex;gap:10px}

  /* ---------- модалка отчёта ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(16,18,35,.55);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;padding:16px;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  .modal.hidden{display:none}
  @media(min-width:520px){.modal{align-items:center}}
  .modal-card{
    background:#fff;border-radius:20px;padding:18px;width:100%;max-width:520px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.4);
  }
  .modal-card h3{margin:0 0 10px;font-size:17px}
  #reportText{
    width:100%;height:230px;border:1px solid var(--line);border-radius:12px;padding:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.5;
    resize:vertical;background:#fafaff;color:#2a2f4a;
  }
  .modal-actions{display:flex;gap:10px;margin-top:12px}
  .modal-actions .btn.primary{width:auto;flex:1}
  .btn.ghost2{background:#eef0f7;color:#3a3f63;flex:0 0 auto;font-size:14.5px}
  .modal-note{font-size:12px;line-height:1.45;color:#8b8fb0;margin-top:10px;min-height:16px}

  .hidden{display:none !important}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shake{animation:shake .3s ease}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <h3>📋 Отчёт для репетитора</h3>
    <textarea id="reportText" readonly></textarea>
    <div class="modal-actions">
      <button class="btn primary" id="modalCopy">Копировать</button>
      <button class="btn ghost2" id="modalClose">Закрыть</button>
    </div>
    <div class="modal-note" id="modalNote"></div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================== ДАННЫЕ ================== */

var TOPICS = [
  {
    id:"plan", title:"Планиметрия", emoji:"📐", note:"окружность, треугольники, площади",
    questions:[
      {
        text:"Хорда AB стягивает дугу окружности, равную 100°. Найдите вписанный угол, опирающийся на эту хорду. Ответ дайте в градусах.",
        ans:"50",
        hint:"Вписанный угол равен половине дуги, на которую он опирается.",
        sol:[
          "Вписанный угол равен половине градусной меры дуги, на которую он опирается.",
          "∠ACB = ½ · ∪AB = ½ · 100° = 50°."
        ]
      },
      {
        text:"Сторона CA касается окружности с центром O в точке A, а луч CO пересекает окружность в точках B и D. Дуга AD, заключённая внутри угла ACO, равна 124°. Найдите угол ACO. Ответ дайте в градусах.",
        ans:"34",
        hint:"Радиус в точку касания перпендикулярен касательной. Угол AOD — внешний угол прямоугольного треугольника AOC.",
        fig:"tangent",
        sol:[
          "OA ⊥ CA, значит ∠OAC = 90°: треугольник AOC прямоугольный.",
          "∠AOD — центральный угол, опирающийся на дугу AD, поэтому ∠AOD = 124°.",
          "∠AOD — внешний угол треугольника AOC при вершине O, значит ∠AOD = ∠OAC + ∠ACO.",
          "∠ACO = 124° − 90° = 34°."
        ]
      },
      {
        text:"В прямоугольном треугольнике катеты равны 3 и 4. Найдите радиус вписанной окружности.",
        ans:"1",
        hint:"Сначала найдите гипотенузу, затем используйте формулу r = (a + b − c) / 2.",
        sol:[
          "Гипотенуза: c = √(3² + 4²) = √25 = 5.",
          "Для прямоугольного треугольника r = (a + b − c) / 2.",
          "r = (3 + 4 − 5) / 2 = 1."
        ]
      },
      {
        text:"Боковая сторона равнобедренного треугольника равна 10, а основание — 12. Найдите площадь треугольника.",
        ans:"48",
        hint:"Проведите высоту к основанию — она делит его пополам. Дальше теорема Пифагора.",
        fig:"iso",
        sol:[
          "Высота, проведённая к основанию, делит его пополам: 12 : 2 = 6.",
          "h = √(10² − 6²) = √64 = 8.",
          "S = ½ · 12 · 8 = 48."
        ]
      },
      {
        text:"Площадь треугольника равна 24, а одна из его сторон равна 8. Найдите высоту, проведённую к этой стороне.",
        ans:"6",
        hint:"Из формулы площади S = ½ · a · h выразите высоту: h = 2S / a.",
        sol:[
          "S = ½ · a · h, отсюда h = 2S / a.",
          "h = (2 · 24) / 8 = 6."
        ]
      }
    ]
  },
  {
    id:"deriv", title:"Производная", emoji:"📈", note:"производная, экстремумы, наибольшее значение",
    questions:[
      {
        text:"Найдите значение производной функции f(x) = x³ − 3x² + 5 в точке x₀ = 1.",
        ans:"-3",
        hint:"Сначала найдите f′(x) по правилам дифференцирования, затем подставьте x₀ = 1.",
        sol:[
          "f′(x) = 3x² − 6x.",
          "f′(1) = 3 · 1² − 6 · 1 = 3 − 6 = −3."
        ]
      },
      {
        text:"Найдите точку минимума функции f(x) = 2x³ − 6x + 1.",
        ans:"1",
        hint:"В точке экстремума производная равна нулю. В точке минимума f′ меняет знак с «−» на «+».",
        sol:[
          "f′(x) = 6x² − 6 = 6(x − 1)(x + 1).",
          "Критические точки: x = −1 и x = 1.",
          "При переходе через x = 1 производная меняет знак с «−» на «+», значит x = 1 — точка минимума. (При x = −1 знак меняется с «+» на «−» — там максимум.)"
        ]
      },
      {
        text:"Материальная точка движется прямолинейно по закону x(t) = t² − 4t + 3 (x — в метрах, t — в секундах). Найдите её скорость в момент времени t = 2 с.",
        ans:"0",
        hint:"Скорость — производная координаты по времени: v(t) = x′(t).",
        sol:[
          "v(t) = x′(t) = 2t − 4.",
          "v(2) = 2 · 2 − 4 = 0 — в этот момент точка меняет направление движения."
        ]
      },
      {
        text:"Найдите наибольшее значение функции f(x) = x³ + 3x² − 9x + 1 на отрезке [−4; 0].",
        ans:"28",
        hint:"Найдите критические точки внутри отрезка, сравните значения функции в них и на концах отрезка.",
        sol:[
          "f′(x) = 3x² + 6x − 9 = 3(x + 3)(x − 1).",
          "На отрезке [−4; 0] лежит только критическая точка x = −3.",
          "f(−4) = −64 + 48 + 36 + 1 = 21; f(−3) = −27 + 27 + 27 + 1 = 28; f(0) = 1.",
          "Наибольшее значение равно 28."
        ]
      },
      {
        text:"Найдите точку минимума функции f(x) = x + 4/x при x > 0.",
        ans:"2",
        hint:"Найдите производную f′(x) = 1 − 4/x² и приравняйте её к нулю.",
        sol:[
          "f′(x) = 1 − 4/x² = (x² − 4) / x².",
          "Нули производной: x = ±2. Условию x > 0 удовлетворяет x = 2.",
          "При x &lt; 2 производная отрицательна, при x > 2 — положительна, значит x = 2 — точка минимума."
        ]
      }
    ]
  },
  {
    id:"trig", title:"Тригонометрия", emoji:"🌀", note:"тождества, табличные значения, уравнения",
    questions:[
      {
        text:"Найдите cos x, если sin x = 0,8, а угол x лежит во второй четверти (π/2; π).",
        ans:"-0.6",
        hint:"Используйте основное тригонометрическое тождество sin²x + cos²x = 1. Во второй четверти косинус отрицателен.",
        sol:[
          "cos²x = 1 − sin²x = 1 − 0,64 = 0,36.",
          "cos x = ±0,6.",
          "Во второй четверти cos x &lt; 0, поэтому cos x = −0,6."
        ]

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

function fmtTime(sec){
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function fmtAns(s){
  return String(s).replace("-", "−").replace(".", ",");
}

function parseNum(raw){
  var s = String(raw).trim().replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(",", ".");
  if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  var m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m){
    var a = parseFloat(m[1]), b = parseFloat(m[2]);
    if (b !== 0) return a / b;
  }
  return NaN;
}

function shuffle(arr){
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

/* ================== ИГРА ================== */

function startGame(mode, name){
  var qs = [];
  if (mode === "mix"){
    var pool = [];
    TOPICS.forEach(function(t, ti){
      var idx = [];
      for (var k = 0; k < t.questions.length; k++) idx.push(k);
      for (var pick = 0; pick < Math.min(2, idx.length); pick++){
        var j = idx.splice(Math.floor(Math.random() * idx.length), 1)[0];
        pool.push({ti: ti, qi: j});
      }
    });
    qs = shuffle(pool);
  } else {
    var index = -1;
    for (var i = 0; i < TOPICS.length; i++) if (TOPICS[i].id === mode) index = i;
    if (index < 0) index = 0;
    TOPICS[index].questions.forEach(function(_, qi){
      qs.push({ti: index, qi: qi});
    });
  }

  st = {
    mode: mode, name: name, queue: qs, idx: 0,
    score: 0, streak: 0, best: 0, correct: 0, log: [],
    t0: performance.now(), qt0: 0, timerId: null,
    answered: false, hintUsed: false,
    dur: 0, acc: 0, agg: {}, mistakes: []
  };
  renderQuestion();
}

function renderQuestion(){
  var item = st.queue[st.idx];
  var topic = TOPICS[item.ti];
  var q = topic.questions[item.qi];
  var total = st.queue.length;

  st.answered = false;
  st.hintUsed = false;

  app.innerHTML =
    '<div class="topbar">' +
      '<button class="iconbtn" id="quitBtn" aria-label="Выйти в меню">✕</button>' +
      '<div class="barwrap"><div class="bar" id="progressBar" style="width:' + (st.idx / total * 100) + '%"></div></div>' +
      '<div class="pcount">' + (st.idx + 1) + '/' + total + '</div>' +
    '</div>' +
    '<div class="chips">' +
      '<span class="chip" id="timerChip">⏱ 0 с</span>' +
      '<span class="chip" id="scoreChip">⭐ ' + st.score + '</span>' +
      '<span class="chip" id="streakChip">🔥 ' + st.streak + '</span>' +
    '</div>' +
    '<section class="qcard">' +
      '<div class="qtopic">' + topic.emoji + ' ' + topic.title + '</div>' +
      (q.fig ? '<div class="fig">' + FIGS[q.fig] + '</div>' : '') +
      '<div class="qtext">' + q.text + '</div>' +
      '<div class="ansrow">' +
        '<button class="btn sign" id="signBtn" aria-label="Сменить знак">±</button>' +
        '<input id="ansInput" type="text" inputmode="decimal" autocomplete="off" placeholder="Ваш ответ" aria-label="Ответ">' +
        '<button class="btn primary" id="submitBtn">Ответить</button>' +
      '</div>' +
      '<div class="inlineerr" id="inlineErr"></div>' +
      '<div class="hintrow">' +
        '<button class="btn hint" id="hintBtn">💡 Подсказка (−4 очка)</button>' +
        '<span class="hintnote">одна на задачу</span>' +
      '</div>' +
      '<div id="hintSlot"></div>' +
      '<div id="fbSlot"></div>' +
    '</section>';

  document.getElementById("quitBtn").onclick = startScreen;

  var inp = document.getElementById("ansInput");
  inp.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); submitAnswer(); }
  });
  inp.addEventListener("input", function(){
    var n = document.getElementById("inlineErr");
    if (n) n.style.display = "none";
  });

  document.getElementById("submitBtn").onclick = submitAnswer;
  document.getElementById("hintBtn").onclick = revealHint;

  var signBtn = document.getElementById("signBtn");
  if (signBtn){
    signBtn.onclick = function(){
      var s = inp.value.trim();
      if (s.charAt(0) === "-" || s.charAt(0) === "−"){
        inp.value = s.slice(1);
      } else {
        inp.value = "-" + s;
      }
      inp.dispatchEvent(new Event("input"));
      inp.focus();
    };
  }

  st.qt0 = performance.now();
  clearInterval(st.timerId);
  st.timerId = setInterval(function(){
    var el = Math.floor((performance.now() - st.qt0) / 1000);
    var t = document.getElementById("timerChip");
    if (t) t.textContent = "⏱ " + el + " с";
  }, 250);
}

function updateChips(){
  var s = document.getElementById("scoreChip");
  var f = document.getElementById("streakChip");
  if (s) s.textContent = "⭐ " + st.score;
  if (f) f.textContent = "🔥 " + st.streak;
}

function revealHint(){
  if (st.answered || st.hintUsed) return;
  st.hintUsed = true;
  st.score = Math.max(0, st.score - 4);
  updateChips();

  var b = document.getElementById("hintBtn");
  if (b) b.disabled = true;

  var item = st.queue[st.idx];
  var q = TOPICS[item.ti].questions[item.qi];
  document.getElementById("hintSlot").innerHTML =
    '<div class="hintbox"><span>💡</span><span>' + q.hint + '</span></div>';
}

function showInlineError(msg){
  var n = document.getElementById("inlineErr");
  if (!n) return;
  n.textContent = msg;
  n.style.display = "block";
}

function submitAnswer(){
  if (!st || st.answered) return;

  var item = st.queue[st.idx];
  var q = TOPICS[item.ti].questions[item.qi];
  var inp = document.getElementById("ansInput");
  var raw = inp.value;

  if (String(raw).trim() === ""){
    inp.classList.add("shake");
    setTimeout(function(){ inp.classList.remove("shake"); }, 400);
    showInlineError("Введите ответ — число.");
    return;
  }
  var val = parseNum(raw);
  if (isNaN(val)){
    showInlineError("Не могу распознать ответ. Введите число, например 28 или 0,5");
    inp.focus();
    return;
  }

  var seconds = (performance.now() - st.qt0) / 1000;
  clearInterval(st.timerId);
  st.answered = true;

  var correct = Math.abs(val - parseFloat(q.ans)) < 1e-6;
  var earned = 0;
  var mult = 1;

  if (correct){
    var bonus = Math.max(0, 5 - Math.floor(seconds / 12));
    mult = st.streak >= 5 ? 2 : (st.streak >= 3 ? 1.5 : 1);
    earned = Math.round((10 + bonus) * mult);
    st.score += earned;
    st.correct++;
    st.streak++;
    if (st.streak > st.best) st.best = st.streak;
  } else {
    st.streak = 0;
  }

  st.log.push({ti: item.ti, qi: item.qi, ok: correct, raw: String(raw).trim(), seconds: seconds, earned: earned});
  updateChips();

  inp.disabled = true;
  var sb = document.getElementById("submitBtn");
  sb.disabled = true;
  sb.textContent = "Отвечено";
  var hb = document.getElementById("hintBtn");
  if (hb) hb.disabled = true;

  var pb = document.getElementById("progressBar");
  if (pb) pb.style.width = ((st.idx + 1) / st.queue.length * 100) + "%";

  renderFeedback(correct, q, earned, mult, raw, seconds);
}

function renderFeedback(ok, q, earned, mult, raw, seconds){
  var last = st.idx === st.queue.length - 1;
  var steps = q.sol.map(function(s){ return "<li>" + s + "</li>"; }).join("");

  var head;
  if (ok){
    head =
      '<h4><span>✅</span> Верно! <span class="earned">+' + earned + ' очков</span></h4>' +
      '<div class="ansline">Ответ: <span class="fbans">' + fmtAns(q.ans) + '</span> · время ' +
        Math.round(seconds) + ' с' + (mult > 1 ? ' · серия ×' + mult : '') + '</div>';
  } else {
    head =
      '<h4><span>❌</span> Неверно <span class="earned" style="color:#b42318">+0</span></h4>' +
      '<div class="ansline">Ваш ответ: <b>' + escapeHtml(String(raw).trim()) + '</b> · правильный ответ: ' +
        '<span class="fbans">' + fmtAns(q.ans) + '</span></div>';
  }

  document.getElementById("fbSlot").innerHTML =
    '<div class="fb ' + (ok ? "ok" : "bad") + '">' +
      head +
      '<div class="expTitle">Разбор</div>' +
      '<ol class="steps">' + steps + '</ol>' +
      '<button class="btn primary nextbtn" id="nextBtn">' +
        (last ? "🏁 Показать результат" : "Следующая задача →") +
      '</button>' +
    '</div>';

  var nb = document.getElementById("nextBtn");
  nb.onclick = nextQuestion;
  nb.scrollIntoView({behavior: "smooth", block: "nearest"});
}

function nextQuestion(){
  st.idx++;
  if (st.idx >= st.queue.length){
    endScreen();
  } else {
    renderQuestion();
    window.scrollTo({top: 0, behavior: "smooth"});
  }
}

function endScreen(){
  clearInterval(st.timerId);

  var total = st.queue.length;
  var acc = Math.round(st.correct / total * 100);
  var dur = (performance.now() - st.t0) / 1000;
  var pct = st.correct / total;

  var agg = {};
  st.log.forEach(function(l){
    var t = TOPICS[l.ti];
    if (!agg[t.id]) agg[t.id] = {title: t.title, emoji: t.emoji, ok: 0, total: 0};
    agg[t.id].total++;
    if (l.ok) agg[t.id].ok++;
  });

  var mistakes = st.log.filter(function(l){ return !l.ok; });

  var ringColor = pct >= 0.8 ? "#16a34a" : (pct >= 0.5 ? "#4f46e5" : "#e5484d");
  var verdict =
    acc === 100 ? "Идеально! Блиц пройден без ошибок 🏆" :
    acc >= 80   ? "Отличный результат — почти всё верно 💪" :
    acc >= 60   ? "Хорошо, но есть над чем поработать 👍" :
                  "Есть что повторить — разбор ошибок ниже поможет 📚";

  var topicsChips = Object.keys(agg).map(function(k){
    var a = agg[k];
    var cls = a.ok === a.total ? " good" : (a.ok === 0 ? " bad" : "");
    return '<span class="tchip' + cls + '">' + a.emoji + ' ' + a.title + ' · ' + a.ok + '/' + a.total + '</span>';
  }).join("");

  var mistakesHtml = "";
  if (mistakes.length){
    mistakesHtml = '<div class="mistakesTitle">Разбор ошибок</div>' + mistakes.map(function(l){
      var t = TOPICS[l.ti];
      var q = t.questions[l.qi];
      return '<div class="mistake">' +
        '<div class="mtag">' + t.emoji + ' ' + t.title + '</div>' +
        '<div class="mtext">' + q.text + '</div>' +
        '<div class="mline">Ваш ответ: <b>' + escapeHtml(l.raw) + '</b> → верно: <b>' + fmtAns(q.ans) + '</b></div>' +
      '</div>';
    }).join("");
  } else {
    mistakesHtml = '<div class="perfect">Ошибок нет — можно ставить «отлично» 🎉</div>';
  }

  app.innerHTML =
    '<section class="card endcard">' +
      '<div class="endtitle">Блиц завершён' + (st.name ? ', ' + escapeHtml(st.name) : '') + '!</div>' +
      '<div class="ring" style="background:conic-gradient(' + ringColor + ' ' + Math.round(pct * 360) + 'deg, #e8e9f4 0)">' +
        '<div class="inner"><div class="big">' + acc + '%</div><div class="small">верных</div></div>' +
      '</div>' +
      '<div class="verdict">' + verdict + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="sl">Верно</div><div class="sv">' + st.correct + ' / ' + total + '</div></div>' +
        '<div class="stat"><div class="sl">Очки</div><div class="sv">⭐ ' + st.score + '</div></div>' +
        '<div class="stat"><div class="sl">Время</div><div class="sv">' + fmtTime(dur) + '</div></div>' +
        '<div class="stat"><div class="sl">Лучшая серия</div><div class="sv">🔥 ' + st.best + '</div></div>' +
      '</div>' +
      '<div class="endTopics">' + topicsChips + '</div>' +
      mistakesHtml +
      '<div class="endbtns">' +
        '<button class="btn primary" id="copyBtn">📋 Скопировать отчёт</button>' +
        '<div class="row2">' +
          '<button class="btn soft" id="againBtn">🔁 Ещё раз</button>' +
          '<button class="btn soft" id="menuBtn">📚 Другая тема</button>' +
        '</div>' +
      '</div>' +
    '</section>';

  st.dur = dur;
  st.acc = acc;
  st.agg = agg;
  st.mistakes = mistakes;

  document.getElementById("copyBtn").onclick = openReport;
  document.getElementById("againBtn").onclick = function(){ startGame(st.mode, st.name); };
  document.getElementById("menuBtn").onclick = startScreen;
  window.scrollTo({top: 0, behavior: "smooth"});
}

/* ================== ОТЧЁТ ================== */

function buildReport(){
  var modeLabel = "Микс (все темы)";
  for (var i = 0; i < TOPICS.length; i++){
    if (TOPICS[i].id === st.mode) modeLabel = TOPICS[i].title;
  }

  var lines = [];
  lines.push("📊 Математический блиц · отчёт");
  lines.push("Дата: " + new Date().toLocaleDateString("ru-RU"));
  lines.push("Ученик: " + (st.name || "—"));
  lines.push("Режим: " + modeLabel);
  lines.push("Результат: " + st.correct + " из " + st.queue.length + " верно (" + st.acc + "%)");
  lines.push("Очки: " + st.score + " · лучшая серия: " + st.best);
  lines.push("Время: " + fmtTime(st.dur) + " · в среднем " + Math.round(st.dur / st.queue.length) + " с на задачу");

  var aggKeys = Object.keys(st.agg);
  if (aggKeys.length){
    lines.push("По темам: " + aggKeys.map(function(k){
      var a = st.agg[k];
      return a.title + " " + a.ok + "/" + a.total;
    }).join(", "));
  }

  if (st.mistakes.length){
    lines.push("Ошибки:");
    st.mistakes.forEach(function(l, i){
      var t = TOPICS[l.ti];
      var q = t.questions[l.qi];
      var text = q.text.replace(/\s+/g, " ");
      if (text.length > 150) text = text.slice(0, 147) + "…";
      lines.push((i + 1) + ") [" + t.title + "] " + text + " — ответ: " + l.raw + ", верно: " + fmtAns(q.ans));
    });
  } else {
    lines.push("Ошибок нет 🎉");
  }

  return lines.join("\n");
}

function fallbackCopy(){
  try {
    reportText.focus();
    reportText.select();
    reportText.setSelectionRange(0, reportText.value.length);
    return document.execCommand("copy");
  } catch (e){ return false; }
}

function tryCopy(){
  return new Promise(function(resolve){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(reportText.value).then(function(){
        resolve(true);
      }).catch(function(){
        resolve(fallbackCopy());
      });
    } else {
      resolve(fallbackCopy());
    }
  });
}

function openReport(){
  reportText.value = buildReport();
  modalNote.textContent = "";
  modal.classList.remove("hidden");
  reportText.focus();
  reportText.select();
  tryCopy().then(function(ok){
    modalNote.textContent = ok
      ? "Скопировано — можно вставить в чат 👍"
      : "Автокопирование недоступно: текст выделен, скопируйте вручную (долгое нажатие → «Копировать»).";
  });
}

document.getElementById("modalClose").onclick = function(){
  modal.classList.add("hidden");
};

document.getElementById("modalCopy").onclick = function(){
  reportText.focus();
  reportText.select();
  tryCopy().then(function(ok){
    modalNote.textContent = ok ? "Скопировано 👍" : "Не удалось автоматически — скопируйте вручную (долгое нажатие → «Копировать»).";
  });
};

modal.addEventListener("click", function(e){
  if (e.target === modal) modal.classList.add("hidden");
});

/* ================== СТАРТ ================== */

startScreen();

})();
</script>
