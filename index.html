<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Математический блиц · ЕГЭ-2027, профиль</title>
<style>
:root{
  --bg:#f3f4fa; --card:#fff; --ink:#161a2e; --muted:#6b7190; --line:#e6e8f4;
  --accent:#4f46e5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 8% -10%,#e7e9ff 0%,transparent 60%),
    radial-gradient(800px 500px at 110% 0%,#ffe9f3 0%,transparent 55%),
    var(--bg);
  color:var(--ink); min-height:100vh;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
.app{max-width:560px;margin:0 auto;padding:18px 16px calc(48px + env(safe-area-inset-bottom))}

/* кнопки */
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;font-family:inherit;
  cursor:pointer;line-height:1.2;transition:transform .08s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;width:100%;
  box-shadow:0 10px 22px -10px rgba(79,70,229,.6)}
.btn.primary:disabled{opacity:.55}
.btn.soft{background:#eef0f7;color:#33385c;font-size:14.5px;padding:13px 10px;flex:1}
.btn.dark{background:#1f2233;color:#fff}
.btn.warn{background:#fff3e8;color:#9a3412;border:1px solid #fed7aa}
.btn.wide{width:100%;margin-top:10px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:16px;cursor:pointer;color:#565b7e;flex:0 0 auto}
.lnk{display:block;width:100%;margin-top:14px;background:none;border:0;color:#6d5ee8;
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:6px}

/* старт */
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#db2777 130%);
  border-radius:24px;padding:22px 20px 24px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(79,70,229,.6)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(220px 120px at 88% -10%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(200px 140px at -10% 120%,rgba(255,255,255,.18),transparent 60%)}
.hero-badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 12px;border-radius:999px;margin-bottom:14px}
.hero h1{margin:0 0 8px;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.9)}

.card{background:var(--card);border-radius:22px;padding:18px;border:1px solid rgba(230,232,244,.9);
  box-shadow:0 16px 40px -26px rgba(23,26,46,.35);margin-top:14px}
.namelabel{display:block;font-size:13px;font-weight:700;color:#41466a;margin-bottom:7px}
.namelabel span{color:#9a9db8;font-weight:600}
#nameInput{width:100%;font-size:16px;font-family:inherit;padding:13px 14px;border-radius:12px;
  border:1.5px solid #dfe1f0;background:#fbfbfe;outline:none;color:var(--ink)}
#nameInput:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.14);background:#fff}
.histline{margin-top:10px;font-size:13px;color:#5b6081;background:#f7f7fd;border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;line-height:1.4}
.mixwrap{margin-top:16px}
.mixbtn{font-size:16.5px;padding:15px}

/* переключатель */
.switchrow{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 13px;border:1px solid var(--line);
  border-radius:14px;background:#fbfbfe;cursor:pointer}
.sw{position:relative;flex:0 0 auto;margin-top:2px}
.sw input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.track{display:block;width:44px;height:26px;border-radius:999px;background:#d9dcec;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked + .track{background:#4f46e5}
.sw input:checked + .track::after{transform:translateX(18px)}
.swtx{font-size:13.5px;color:#4b5074;line-height:1.35}
.swtx b{color:var(--ink)}
.swtx span{color:#8b8fb0;font-size:12.5px}

.orline{display:flex;align-items:center;gap:12px;margin:18px 0 12px;color:#9a9db8;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

.topics{display:flex;flex-direction:column;gap:9px}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:16px;padding:11px 12px;cursor:pointer;font-family:inherit;
  color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .08s}
.topic:hover{border-color:#c9c6f7;box-shadow:0 6px 18px -12px rgba(79,70,229,.45)}
.topic:active{transform:scale(.985)}
.topic .emoji{width:40px;height:40px;border-radius:12px;background:#f1f0ff;display:flex;
  align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.topic .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.topic .tt{font-size:15px;font-weight:700}
.topic .tn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:800;color:#5b4fd6;background:#f1f0ff;border-radius:8px;padding:4px 7px;white-space:nowrap}
.topic .count{font-size:12px;font-weight:700;color:#8b8fb0;background:#f5f6fb;padding:4px 8px;border-radius:999px}
.footnote{margin-top:16px;font-size:11.5px;line-height:1.6;color:#8b8fb0;text-align:center}

/* игра */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.htitle{font-size:16px;font-weight:800}
.barwrap{flex:1;height:9px;background:#e6e8f4;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#a855f7);border-radius:999px;transition:width .35s}
.pcount{font-size:13px;font-weight:800;color:#6b7190;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;color:#3a3f63;font-variant-numeric:tabular-nums}
.chip.ctrl{background:#fff8e8;border-color:#fbe3b3;color:#8a5a05}
.qcard{background:#fff;border-radius:22px;padding:18px;border:1px solid rgba(230,232,244,.9);
  box-shadow:0 14px 34px -24px rgba(23,26,46,.4)}
.qtopic{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8b8fb0;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fipibadge{font-size:10px;font-weight:800;letter-spacing:.02em;text-transform:none;color:#0a6ebd;
  background:#e8f3ff;border-radius:6px;padding:3px 6px}
.qtext{font-size:18px;line-height:1.45;font-weight:600}
.fig{background:#f8f8fe;border:1px solid #e9e8fb;border-radius:16px;padding:6px;margin-bottom:14px}
.fig.small{max-width:300px}
.fig svg{display:block;width:100%;height:auto}
.lbl{font:700 15px ui-sans-serif,system-ui,sans-serif;fill:#3a3f63}
.ansrow{display:flex;gap:8px;margin-top:18px}
.btn.sign{flex:0 0 auto;width:50px;padding:0;font-size:20px;font-weight:800;background:#eef0f7;color:#33385c;border-radius:14px}
.ansrow input{flex:1;min-width:0;font-size:18px;font-weight:700;font-family:inherit;padding:13px 16px;
  border-radius:14px;border:1.5px solid #dfe1f0;outline:none;background:#fbfbfe;color:var(--ink);font-variant-numeric:tabular-nums}
.ansrow input:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.15);background:#fff}
.ansrow input:disabled{opacity:.6}
.ansrow .btn.primary{width:auto;white-space:nowrap;padding:13px 18px;font-size:15.5px}
.inlineerr{color:#b42318;font-size:13px;font-weight:700;margin-top:8px;display:none}
.hintrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hintnote{font-size:12px;color:#9a9db8}
.btn.hint{background:#fff7e6;color:#a16207;border:1px solid #fde68a;font-size:14px;padding:10px 14px;border-radius:12px}
.btn.hint:disabled{opacity:.45;pointer-events:none}
.hintbox{margin-top:12px;background:#fffaf0;border:1px solid #fbe3b3;border-radius:14px;padding:13px 14px;
  font-size:14.5px;line-height:1.5;color:#7a4f05;display:flex;gap:9px}
.hintbox.small{font-size:13.5px;margin-top:10px}
.fb{margin-top:16px;border-radius:16px;padding:15px;border:1px solid}
.fb.ok{background:#effaf3;border-color:#bde8cd}
.fb.bad{background:#fef2f2;border-color:#f6c9cb}
.fb.neutral{background:#f7f7fd;border-color:#e2e4f2}
.fb h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb.ok h4{color:#0b7a43}
.fb.bad h4{color:#b42318}
.earned{margin-left:auto;font-size:14px;font-weight:800;color:#0b7a43}
.earned.bad{color:#b42318}
.ansline{font-size:14.5px;color:#454b6b;margin:2px 0 4px;line-height:1.5}
.ansline.muted{color:#8b8fb0;font-size:13px;margin-top:10px}
.fbans{font-weight:800;font-size:16px;color:var(--ink)}
.nextbtn{margin-top:16px}

/* финал */
.endcard{text-align:center;padding-top:22px}
.endtitle{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:16px}
.ring{width:134px;height:134px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center}
.ring .inner{width:106px;height:106px;border-radius:50%;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring .big{font-size:31px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .small{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.verdict{margin-top:14px;font-size:14.5px;color:#4b5074;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
.stat .sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9a9db8}
.stat .sv{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.sectitle{margin:22px 0 10px;text-align:left;font-size:12px;font-weight:800;color:#33385c;
  text-transform:uppercase;letter-spacing:.06em}

/* столбчатая диаграмма */
.bchart{display:flex;flex-direction:column;gap:9px;text-align:left}
.brow{display:flex;align-items:center;gap:10px}
.blabel{flex:0 0 132px;font-size:12.5px;font-weight:700;color:#3f4468;line-height:1.2}
.btrack{flex:1;height:14px;background:#eef0f7;border-radius:999px;overflow:hidden}
.bfill{height:100%;border-radius:999px;transition:width .5s}
.bval{flex:0 0 42px;text-align:right;font-size:12.5px;font-weight:800;color:#4b5074;font-variant-numeric:tabular-nums}

.mistake{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px;text-align:left}
.mtag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8b8fb0;margin-bottom:6px}
.mtext{font-size:13.5px;line-height:1.45;color:#33385c}
.mline{margin-top:8px;font-size:13px;color:#6b7190}
.mline b{color:var(--ink)}
.perfect{margin-top:14px;background:#effaf3;border:1px solid #bde8cd;color:#0b7a43;font-weight:700;
  border-radius:14px;padding:12px;font-size:14.5px;text-align:left}
.endbtns{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:10px}

/* разбор */
.revcard{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;text-align:left}
.revcard.ok{border-left:4px solid #34a853}
.revcard.bad{border-left:4px solid #e5484d}
.revhead{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#5b6081;margin-bottom:8px}
.revq{font-size:14.5px;line-height:1.45;color:#22263c;font-weight:600}
.revans{margin-top:6px;font-size:13px;color:#6b7190}
.expTitle{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#8b8fb0;margin:14px 0 2px}
.steps{margin:4px 0 0;padding:0;list-style:none;counter-reset:st}
.steps li{position:relative;padding-left:32px;margin:10px 0;font-size:14px;line-height:1.5;color:#33385c;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:7px;
  background:#eceafe;color:#5b4fd6;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* отчёт */
.imgslot{margin-top:4px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#f7f7fd}
.imgslot img{display:block;width:100%;height:auto}
.loadnote{padding:40px 16px;text-align:center;color:#8b8fb0;font-size:13.5px}
.modal-note{font-size:12px;line-height:1.45;color:#8b8fb0;margin-top:10px;min-height:16px;text-align:center}

.hidden{display:none!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s ease}

/* сетка разделов в два столбца */
.topics.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topics.grid2 .topic{flex-direction:column;align-items:flex-start;gap:6px;padding:11px 11px 10px;position:relative}
.topics.grid2 .topic .emoji{width:32px;height:32px;border-radius:10px;font-size:16px}
.topics.grid2 .topic .tx{gap:1px}
.topics.grid2 .topic .tt{font-size:13.5px;line-height:1.2}
.topics.grid2 .topic .tn{font-size:10.5px;white-space:normal;line-height:1.25}
.topics.grid2 .badge{position:absolute;top:10px;right:9px;font-size:9.5px;padding:3px 5px}
.topics.grid2 .count{font-size:10px;padding:3px 7px;margin-top:2px}

/* поле группы */
.groupin{width:100%;font-size:14px;font-family:inherit;padding:11px 14px;border-radius:12px;
  border:1.5px solid #dfe1f0;background:#fbfbfe;outline:none;color:var(--ink);margin-top:8px}
.groupin:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.14);background:#fff}

/* статус отправки */
.syncbar{margin-top:14px;display:flex;align-items:center;gap:9px;border-radius:12px;padding:10px 12px;
  font-size:12.5px;font-weight:700;line-height:1.35}
.syncbar.ok{background:#effaf3;border:1px solid #bde8cd;color:#0b7a43}
.syncbar.fail{background:#fff7e6;border:1px solid #fbe3b3;color:#8a5a05}
.syncbar.wait{background:#eef4ff;border:1px solid #b9d4ff;color:#0a6eb9}
.syncbar .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* отправка преподавателю */
.btn.send{background:linear-gradient(135deg,#0f766e,#059669);color:#fff;
  box-shadow:0 10px 22px -12px rgba(5,150,105,.7);width:100%}
.sendnote{font-size:13.5px;line-height:1.5;color:#4b5074;margin-bottom:12px}
.sendnote.small{font-size:11.5px;color:#9a9db8;margin:10px 0 14px;text-align:center}
.codebox{background:#0f172a;color:#a7f3d0;border-radius:14px;padding:14px 16px;margin-bottom:14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;
  word-break:break-all;user-select:all;-webkit-user-select:all}

/* экран отчёта: главная кнопка и подсказка */
.sendhint{font-size:13.5px;line-height:1.5;color:#4b5074;margin-bottom:12px}
.endbtns .btn.send{width:100%}

/* ===== контрольные работы на главной ===== */
.ktlist{display:flex;flex-direction:column;gap:9px}
.ktcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:linear-gradient(135deg,#f5f3ff,#eef2ff);border:1.5px solid #ddd8fb;
  border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;
  transition:transform .08s,box-shadow .15s,border-color .15s}
.ktcard:hover{border-color:#a78bfa;box-shadow:0 10px 24px -16px rgba(109,40,217,.6)}
.ktcard:active{transform:scale(.99)}
.ktemoji{font-size:22px;flex:0 0 auto}
.kttx{flex:1;min-width:0}
.kttt{display:block;font-weight:800;font-size:14px;color:#2a2450}
.kttn{display:block;font-size:11.5px;color:#7c7fa8;line-height:1.35;margin-top:2px}
.ktmeta{font-size:11px;font-weight:800;color:#6d28d9;background:#ede9fe;
  padding:5px 9px;border-radius:999px;white-space:nowrap}

/* ===== экран подтем ===== */
.sethead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.setemoji{font-size:34px}
.settt{font-weight:800;font-size:18px}
.settn{font-size:12.5px;color:var(--muted);margin-top:2px}
.taglist{display:flex;flex-direction:column;gap:8px}
.tagrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fbfbfe;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;
  cursor:pointer;font:inherit;transition:border-color .15s,background .15s}
.tagrow:hover{border-color:#a5b4fc;background:#f6f7ff}
.tagdot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);flex:0 0 auto}
.tagtx{flex:1;min-width:0}
.tagtx b{display:block;font-size:14px;color:var(--ink);text-transform:capitalize}
.tagtx span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.taggo{font-size:11.5px;font-weight:800;color:#4f46e5;white-space:nowrap}

/* ===== экран «Готовы?» ===== */
.confirmcard{text-align:center;padding:26px 20px}
.confirmicon{font-size:44px;margin-bottom:6px}
.confirmtitle{font-size:26px;font-weight:800;letter-spacing:-.01em}
.confirmsub{font-size:14.5px;color:#5b6183;margin-top:6px;line-height:1.4}
.confirmstats{display:flex;justify-content:center;gap:8px;margin:20px 0 16px;flex-wrap:wrap}
.cs{background:#f5f6fc;border:1px solid var(--line);border-radius:13px;padding:11px 13px;min-width:96px}
.cs b{display:block;font-size:14.5px;color:var(--ink)}
.cs span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.confirmnote{background:#f2f6ff;border:1px solid #d7e3fb;border-radius:12px;padding:12px 14px;
  font-size:13px;line-height:1.5;color:#2f4a7a;margin-bottom:10px;text-align:left}
.confirmnote.ctrl{background:#fff8ec;border-color:#f5dcb0;color:#7a4f05}

/* ===== разбор: правила, пояснения, теги ===== */
.tagbadge{display:inline-block;font-size:10.5px;font-weight:700;color:#5b4fd6;
  background:#eeecff;border:1px solid #ddd6ff;border-radius:999px;padding:2px 8px;margin-left:6px;
  text-transform:capitalize}
.revtabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.revintro{font-size:12.5px;line-height:1.55;color:#6b7190;background:#f7f8fd;
  border-radius:11px;padding:11px 13px;margin-bottom:16px}
.rulebox{background:#f4f7ff;border:1px solid #d9e2f8;border-radius:12px;margin:12px 0;
  overflow:hidden}
.rulebox summary{cursor:pointer;padding:11px 14px;font-size:13px;font-weight:800;color:#2f4a7a;
  list-style:none;user-select:none}
.rulebox summary::-webkit-details-marker{display:none}
.rulebox summary::before{content:"▸ ";font-size:11px}
.rulebox[open] summary::before{content:"▾ "}
.ruletext{padding:0 14px 13px;font-size:13px;line-height:1.6;color:#3a4a6b}
.revhint{background:#fffbeb;border:1px solid #f6e3ad;border-radius:11px;padding:10px 13px;
  font-size:12.5px;line-height:1.5;color:#7a5a05;margin:10px 0}
.revans.good{color:#0b7a43;background:#effaf3;border-color:#bde8cd}
.revans.bad2{color:#a12a20;background:#fef2f2;border-color:#f6c9cb}
.steps li{margin-bottom:12px}
.steps li .ss{font-size:13.5px;line-height:1.55;color:#22263c}
.steps li .why{font-size:12.5px;line-height:1.55;color:#5b5f86;margin-top:6px;
  border-left:3px solid #c7c0ff;background:#f8f7ff;
  border-radius:0 9px 9px 0;padding:8px 11px}
.steps li .why::before{content:"Почему: ";font-weight:800;color:#5b4fd6}

/* надёжный шрифтовой стек для эмодзи в разных ОС */
.emoji,.ktemoji,.revhead,.endbtns .btn,.btn,.topic .emoji,.confirmicon{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",
    ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
/* если эмодзи нет — квадрат не покажется: скрываем «битые» глифы через монохром */
.confirmicon{font-size:40px;line-height:1;color:#4f46e5;font-weight:800}


/* ---- выводы в отчёте ---- */
.verdictbox{margin-top:14px;background:#eefaf2;border:1px solid #c6ebd6;border-radius:14px;
  padding:14px 16px;color:#2f6b4a;font-size:14px;line-height:1.45}
.verdictbox b{display:block;color:#0b7a43;font-size:16px;margin-bottom:4px}
.concllist{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.concl{display:flex;gap:12px;background:#fff;border:1px solid #e6e8f4;border-radius:14px;padding:12px 14px}
.cnum{flex:0 0 26px;width:26px;height:26px;border-radius:8px;background:#4f46e5;color:#fff;
  font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}
.ctext{font-size:14px;line-height:1.45;color:#33385c}

<script>
/* ===== ЧЕРТЕЖИ (inline SVG) ===== */
var INK = "#4f46e5", MUT = "#8b8fb0", DARK = "#161a2e", PINK = "#db2777";

function svg(inner){ return '<svg viewBox="0 0 340 200" role="img">' + inner + '</svg>'; }
function svgW(w, inner){ return '<svg viewBox="0 0 ' + w + ' 200" role="img">' + inner + '</svg>'; }
function dot(x, y, c){ return '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + (c || INK) + '"/>'; }
function lb(x, y, t, a){ return '<text x="' + x + '" y="' + y + '" text-anchor="' + (a || 'middle') + '" class="lbl">' + t + '</text>'; }
function seg(x1, y1, x2, y2){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + INK + '" stroke-width="2.4" stroke-linecap="round"/>';
}
function dashSeg(x1, y1, x2, y2, col){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (col || MUT) + '" stroke-width="1.7" stroke-dasharray="5 4"/>';
}
function circ(cx, cy, r){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffffff" stroke="' + INK + '" stroke-width="2.4"/>';
}
function poly(pts, close){
  return '<polygon points="' + pts + '" fill="#ffffff" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>';
}
function arcAngle(cx, cy, r, a1, a2){
  var p1x = cx + r * Math.cos(a1 * Math.PI / 180), p1y = cy - r * Math.sin(a1 * Math.PI / 180);
  var p2x = cx + r * Math.cos(a2 * Math.PI / 180), p2y = cy - r * Math.sin(a2 * Math.PI / 180);
  var large = Math.abs(a2 - a1) > 180 ? 1 : 0;
  return '<path d="M' + p1x.toFixed(1) + ' ' + p1y.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' +
    p2x.toFixed(1) + ' ' + p2y.toFixed(1) + '" fill="none" stroke="' + PINK + '" stroke-width="2.6" stroke-linecap="round"/>';
}
function rightAngle(x, y, dx, dy){
  return '<path d="M' + (x + dx * 12) + ' ' + (y + dy * 12) + ' L' + (x + dx * 12 - dy * 12) + ' ' +
    (y + dy * 12 + dx * 12) + ' L' + (x - dy * 12) + ' ' + (y + dx * 12) + '" fill="none" stroke="' + MUT +
    '" stroke-width="1.6"/>';
}
function ell(cx, cy, rx, ry, fill){
  return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + (fill || '#ffffff') +

}
function arrow(x1, y1, x2, y2, col){
  var c = col || INK, ang = Math.atan2(y2 - y1, x2 - x1), L = 9, w = 0.42;
  var ax = x2 - L * Math.cos(ang - w), ay = y2 - L * Math.sin(ang - w);
  var bx = x2 - L * Math.cos(ang + w), by = y2 - L * Math.sin(ang + w);
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c +
    '" stroke-width="2.4" stroke-linecap="round"/>' +
    '<polygon points="' + x2 + ',' + y2 + ' ' + ax + ',' + ay + ' ' + bx + ',' + by + '" fill="' + c + '"/>';
}
/* график функции: pts = [[x,y],...] в координатах экрана */
function graph(pts, extra){

          '<text x="36" y="14" class="lbl" font-size="12">y</text>' +
          '<text x="34" y="184" class="lbl" font-size="12">0</text>';
  if (pts && pts.length){
    var d = pts.map(function(p, i){ return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
    g += '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  return svg(g + (extra || ""));

   {fipi:"№1", fig:"isoThick", tag:"треугольники", lvl:3, t:"В равнобедренном треугольнике угол при вершине, противолежащей основанию, равен 120°, а боковая сторона равна 6. Найдите площадь треугольника, делённую на √3.", a:"9", hint:"Площадь через две стороны и угол между ними: S = ½ · a · b · sin γ.", sol:["S = ½ · 6 · 6 · sin 120°.", "sin 120° = sin 60° = √3/2.", "S = 18 · √3/2 = 9√3.", "Значит, S/√3 = 9."], solRich:[{s:"S = ½ · 6 · 6 · sin 120°.",w:"Подставляем числа в формулу — здесь важна аккуратность со знаками."}, {s:"sin 120° = sin 60° = √3/2.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"S = 18 · √3/2 = 9√3.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Значит, S/√3 = 9.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Как работать с корнями",text:"Корень — обратная операция к возведению в квадрат: √a — это число, квадрат которого равен a. Произведение корней можно объединить под один корень, частное — тоже. Ищите под корнем полный квадрат: √36 = 6."}},
   {fipi:"№1", fig:"squareCircle", tag:"окружности", lvl:3, t:"Сторона квадрата равна 8. Найдите радиус окружности, вписанной в этот квадрат.", a:"4", hint:"Диаметр вписанной в квадрат окружности равен стороне квадрата.", sol:["2r = a = 8.", "r = 4."], solRich:[{s:"2r = a = 8.",w:"Подставляем числа в формулу — здесь важна аккуратность со знаками."}, {s:"r = 4.",w:"Считаем: следим, чтобы все величины были в одних единицах."}], rule:{title:"Углы и дуги окружности",text:"Запомните две связки: центральный угол равен своей дуге, вписанный угол — её половине. Поэтому вписанный угол всегда вдвое меньше центрального, опирающегося на ту же дугу. Отсюда же: угол, опирающийся на диаметр, равен 90°."}},
   {fipi:"№1", fig:"rhombusDiag", tag:"четырёхугольники", lvl:3, t:"Диагонали ромба равны 12 и 16. Найдите сторону ромба.", a:"10", hint:"Диагонали ромба перпендикулярны и делятся точкой пересечения пополам.", sol:["Половины диагоналей: 6 и 8.", "Сторона ромба — гипотенуза: √(6² + 8²) = √100.", "Сторона равна 10."], solRich:[{s:"Половины диагоналей: 6 и 8.",w:"Диагонали ромба перпендикулярны и делятся точкой пересечения пополам — это даёт прямоугольные треугольники внутри фигуры."}, {s:"Сторона ромба — гипотенуза: √(6² + 8²) = √100.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"Сторона равна 10.",w:""}], rule:{title:"Четырёхугольники: ключевые свойства",text:"Ромб: диагонали перпендикулярны и делятся пополам, площадь S = (d₁·d₂)/2. Трапеция: средняя линия равна полусумме оснований. Вписанный четырёхугольник: сумма противоположных углов 180°. Параллелограмм: противоположные стороны и углы равны, площадь S = ah."}},
   {fipi:"№1", fig:"rhombusDiag", tag:"четырёхугольники", lvl:3, t:"Диагонали ромба равны 12 и 16. Найдите площадь ромба.", a:"96", hint:"Площадь ромба равна половине произведения диагоналей.", sol:["S = (d₁ · d₂) / 2.", "S = (12 · 16) / 2 = 192 / 2 = 96."], solRich:[{s:"S = (d₁ · d₂) / 2.",w:"Подставляем числа в формулу — здесь важна аккуратность со знаками."}, {s:"S = (12 · 16) / 2 = 192 / 2 = 96.",w:"Считаем: следим, чтобы все величины были в одних единицах."}], rule:{title:"Четырёхугольники: ключевые свойства",text:"Ромб: диагонали перпендикулярны и делятся пополам, площадь S = (d₁·d₂)/2. Трапеция: средняя линия равна полусумме оснований. Вписанный четырёхугольник: сумма противоположных углов 180°. Параллелограмм: противоположные стороны и углы равны, площадь S = ah."}},
   {fipi:"№1", fig:"midline", tag:"треугольники", lvl:3, t:"Средняя линия треугольника, параллельная основанию, равна 7. Найдите основание.", a:"14", hint:"Средняя линия равна половине основания.", sol:["Средняя линия = ½ · основание.", "Основание = 2 · 7 = 14."], solRich:[{s:"Средняя линия = ½ · основание.",w:"Средняя линия параллельна основаниям и равна их полусумме — отдельная теорема, не путать со средним арифметическим."}, {s:"Основание = 2 · 7 = 14.",w:"Считаем: следим, чтобы все величины были в одних единицах."}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", fig:"triAngles", tag:"треугольники", lvl:3, t:"В треугольнике два угла равны 40° и 60°. Найдите третий угол. Ответ дайте в градусах.", a:"80", hint:"Сумма углов треугольника равна 180°.", sol:["Сумма углов треугольника всегда равна 180°.", "Третий угол = 180° − 40° − 60°.", "= 80°."], solRich:[{s:"Сумма углов треугольника всегда равна 180°.",w:"В любом треугольнике сумма углов равна 180°. Два угла известны — третий находится вычитанием."}, {s:"Третий угол = 180° − 40° − 60°.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"= 80°.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", fig:"rectCircle", tag:"окружности", lvl:3, t:"Окружность описана около прямоугольника со сторонами 6 и 8. Найдите её радиус.", a:"5", hint:"Диагональ прямоугольника — диаметр описанной окружности.", sol:["Диагональ: √(6² + 8²) = 10.", "R = 10 / 2 = 5."], solRich:[{s:"Диагональ: √(6² + 8²) = 10.",w:"Диагонали ромба перпендикулярны и делятся точкой пересечения пополам — это даёт прямоугольные треугольники внутри фигуры."}, {s:"R = 10 / 2 = 5.",w:"Считаем: следим, чтобы все величины были в одних единицах."}]},
   {fipi:"№1", fig:"central", tag:"окружности", lvl:3, t:"Центральный угол AOB равен 35°. Найдите вписанный угол ACB, опирающийся на ту же дугу. Ответ дайте в градусах.", a:"17.5", hint:"Вписанный угол, опирающийся на ту же дугу, равен половине центрального.", sol:["Вписанный угол равен половине центрального, опирающегося на ту же дугу.", "∠ACB = 35° / 2 = 17,5°."], solRich:[{s:"Вписанный угол равен половине центрального, опирающегося на ту же дугу.",w:"Вписанный угол всегда вдвое меньше дуги, на которую опирается. Это главный инструмент в задачах про окружность."}, {s:"∠ACB = 35° / 2 = 17,5°.",w:"Считаем: следим, чтобы все величины были в одних единицах."}]},
   {fipi:"№1", tag:"треугольники", lvl:3, t:"В прямоугольном треугольнике гипотенуза равна 20, а один из острых углов равен 30°. Найдите площадь треугольника.", a:"86.6", hint:"Катет против угла 30° равен половине гипотенузы; второй катет — по теореме Пифагора.", sol:["Катет против угла 30°: 20 / 2 = 10.", "Второй катет: √(400 − 100) = √300 = 10√3.", "S = ½ · 10 · 10√3 = 50√3 ≈ 86,6."], solRich:[{s:"Катет против угла 30°: 20 / 2 = 10.",w:"Подставляем числа в формулу — здесь важна аккуратность со знаками."}, {s:"Второй катет: √(400 − 100) = √300 = 10√3.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"S = ½ · 10 · 10√3 = 50√3 ≈ 86,6.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", tag:"окружности", lvl:3, t:"Боковая сторона равнобедренного треугольника равна 5, а основание равно 6. Найдите радиус вписанной окружности.", a:"1.5", hint:"Радиус вписанной окружности — площадь, делённая на полупериметр.", sol:["Высота к основанию: √(25 − 9) = 4.", "Площадь: ½ · 6 · 4 = 12.", "Полупериметр: (5 + 5 + 6) / 2 = 8.", "r = 12 / 8 = 1,5."], solRich:[{s:"Высота к основанию: √(25 − 9) = 4.",w:"Подставляем числа в формулу — здесь важна аккуратность со знаками."}, {s:"Площадь: ½ · 6 · 4 = 12.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"Полупериметр: (5 + 5 + 6) / 2 = 8.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"r = 12 / 8 = 1,5.",w:"Арифметика. Если ответ выглядит странно — пересчитайте этот шаг."}], rule:{title:"Углы и дуги окружности",text:"Запомните две связки: центральный угол равен своей дуге, вписанный угол — её половине. Поэтому вписанный угол всегда вдвое меньше центрального, опирающегося на ту же дугу. Отсюда же: угол, опирающийся на диаметр, равен 90°."}},
   {fipi:"№1", tag:"треугольники", lvl:2, t:"В треугольнике две стороны равны 8 и 6, угол между ними 30°. Найдите площадь треугольника.", a:"12", hint:"Площадь через две стороны и угол между ними: S = ½·a·b·sin C.", sol:["Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.", "Подставляем: S = ½ · 8 · 6 · sin 30°.", "Вспоминаем: sin 30° = ½.", "Считаем: S = ½ · 8 · 6 · ½ = 12."], solRich:[{s:"Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.",w:"Формула — это готовый инструмент. Сначала выписываем её, потом подставляем числа: так меньше шансов запутаться."}, {s:"Подставляем: S = ½ · 8 · 6 · sin 30°.",w:"Табличные значения углов (30°, 45°, 60°) нужно помнить наизусть — они встречаются постоянно."}, {s:"Вспоминаем: sin 30° = ½.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Считаем: S = ½ · 8 · 6 · ½ = 12.",w:""}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", tag:"треугольники", lvl:2, t:"В треугольнике две стороны равны 10 и 4, угол между ними 30°. Найдите площадь треугольника.", a:"10", hint:"Площадь через две стороны и угол между ними: S = ½·a·b·sin C.", sol:["Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.", "Подставляем: S = ½ · 10 · 4 · sin 30°.", "Вспоминаем: sin 30° = ½.", "Считаем: S = ½ · 10 · 4 · ½ = 10."], solRich:[{s:"Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.",w:"Формула — это готовый инструмент. Сначала выписываем её, потом подставляем числа: так меньше шансов запутаться."}, {s:"Подставляем: S = ½ · 10 · 4 · sin 30°.",w:"Табличные значения углов (30°, 45°, 60°) нужно помнить наизусть — они встречаются постоянно."}, {s:"Вспоминаем: sin 30° = ½.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Считаем: S = ½ · 10 · 4 · ½ = 10.",w:""}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", tag:"треугольники", lvl:2, t:"В треугольнике две стороны равны 12 и 5, угол между ними 30°. Найдите площадь треугольника.", a:"15", hint:"Площадь через две стороны и угол между ними: S = ½·a·b·sin C.", sol:["Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.", "Подставляем: S = ½ · 12 · 5 · sin 30°.", "Вспоминаем: sin 30° = ½.", "Считаем: S = ½ · 12 · 5 · ½ = 15."], solRich:[{s:"Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.",w:"Формула — это готовый инструмент. Сначала выписываем её, потом подставляем числа: так меньше шансов запутаться."}, {s:"Подставляем: S = ½ · 12 · 5 · sin 30°.",w:"Табличные значения углов (30°, 45°, 60°) нужно помнить наизусть — они встречаются постоянно."}, {s:"Вспоминаем: sin 30° = ½.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Считаем: S = ½ · 12 · 5 · ½ = 15.",w:""}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},

   {fipi:"№1", tag:"треугольники", lvl:2, t:"В треугольнике две стороны равны 14 и 3, угол между ними 30°. Найдите площадь треугольника.", a:"10,5", hint:"Площадь через две стороны и угол между ними: S = ½·a·b·sin C.", sol:["Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.", "Подставляем: S = ½ · 14 · 3 · sin 30°.", "Вспоминаем: sin 30° = ½.", "Считаем: S = ½ · 14 · 3 · ½ = 10."], solRich:[{s:"Записываем формулу площади через две стороны и угол: S = ½ · a · b · sin C.",w:"Формула — это готовый инструмент. Сначала выписываем её, потом подставляем числа: так меньше шансов запутаться."}, {s:"Подставляем: S = ½ · 14 · 3 · sin 30°.",w:"Табличные значения углов (30°, 45°, 60°) нужно помнить наизусть — они встречаются постоянно."}, {s:"Вспоминаем: sin 30° = ½.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Считаем: S = ½ · 14 · 3 · ½ = 10.",w:""}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", tag:"треугольники", lvl:3, t:"В треугольнике две стороны равны 3 и 8, а угол между ними 60°. Найдите третью сторону.", a:"7", hint:"Теорема косинусов: c² = a² + b² − 2ab·cos C.", sol:["Применяем теорему косинусов: c² = 3² + 8² − 2·3·8·cos 60°.", "Считаем степени: 9 + 64 = 73.", "cos 60° = 0,5, поэтому 2 · 3 · 8 · 0,5 = 24.", "Получаем c² = 73 − 24 = 49.", "Значит c = 7."], solRich:[{s:"Применяем теорему косинусов: c² = 3² + 8² − 2·3·8·cos 60°.",w:"Теорема косинусов — обобщение теоремы Пифагора для любого треугольника. При тупом угле косинус отрицателен, поэтому слагаемое прибавляется."}, {s:"Считаем степени: 9 + 64 = 73.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"cos 60° = 0,5, поэтому 2 · 3 · 8 · 0,5 = 24.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Получаем c² = 73 − 24 = 49.",w:"Арифметика. Если ответ выглядит странно — пересчитайте этот шаг."}, {s:"Значит c = 7.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", tag:"треугольники", lvl:4, t:"В треугольнике две стороны равны 5 и 7, а угол между ними 120°. Найдите третью сторону.", a:"10,44", hint:"Теорема косинусов. cos 120° = −0,5, поэтому произведение прибавляется.", sol:["По теореме косинусов: c² = 5² + 7² − 2·5·7·cos 120°.", "Считаем: 25 + 49 = 74.", "cos 120° = −0,5 — подставляем со знаком: −2·5·7·(−0,5) = +35.", "Получаем c² = 74 + 35 = 109.", "c = √109 ≈ 10,44."], solRich:[{s:"По теореме косинусов: c² = 5² + 7² − 2·5·7·cos 120°.",w:"Теорема косинусов — обобщение теоремы Пифагора для любого треугольника. При тупом угле косинус отрицателен, поэтому слагаемое прибавляется."}, {s:"Считаем: 25 + 49 = 74.",w:""}, {s:"cos 120° = −0,5 — подставляем со знаком: −2·5·7·(−0,5) = +35.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Получаем c² = 74 + 35 = 109.",w:"Арифметика. Если ответ выглядит странно — пересчитайте этот шаг."}, {s:"c = √109 ≈ 10,44.",w:"Получили число, с которым будем работать дальше."}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", tag:"окружности", lvl:2, t:"Найдите вписанный угол, опирающийся на дугу, равную 80°.", a:"40", hint:"Вписанный угол равен половине дуги, на которую он опирается.", sol:["Вписанный угол опирается на дугу 80°.", "Правило: вписанный угол вдвое меньше дуги, на которую он опирается.", "Делим: 80° : 2 = 40°."], solRich:[{s:"Вписанный угол опирается на дугу 80°.",w:"Вписанный угол всегда вдвое меньше дуги, на которую опирается. Это главный инструмент в задачах про окружность."}, {s:"Правило: вписанный угол вдвое меньше дуги, на которую он опирается.",w:""}, {s:"Делим: 80° : 2 = 40°.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}]},

   {fipi:"№1", fig:"rectCircle", tag:"окружности", lvl:3, t:"Хорда окружности равна 16, а расстояние от центра окружности до хорды равно 6. Найдите радиус окружности.", a:"10", hint:"Радиус, перпендикулярный хорде, делит её пополам. Получается прямоугольный треугольник.", sol:["Опускаем из центра перпендикуляр на хорду — он делит хорду пополам: половина равна 16 : 2 = 8.", "Получается прямоугольный треугольник: катеты 8 и 6, гипотенуза — радиус.", "По теореме Пифагора: R² = 8² + 6² = 64 + 36 = 100.", "R = 10."], solRich:[{s:"Опускаем из центра перпендикуляр на хорду — он делит хорду пополам: половина равна 16 : 2 = 8.",w:"Делим пополам, потому что перпендикуляр из центра на хорду (или диагональ ромба) делит отрезок ровно на две равные части."}, {s:"Получается прямоугольный треугольник: катеты 8 и 6, гипотенуза — радиус.",w:""}, {s:"По теореме Пифагора: R² = 8² + 6² = 64 + 36 = 100.",w:"Теорема Пифагора работает в любом прямоугольном треугольнике: квадрат гипотенузы равен сумме квадратов катетов."}, {s:"R = 10.",w:"Арифметика. Если ответ выглядит странно — пересчитайте этот шаг."}], rule:{title:"Хорда и расстояние до центра",text:"Перпендикуляр из центра на хорду делит её пополам. Получается прямоугольный треугольник: половина хорды, расстояние до центра и радиус. Дальше — теорема Пифагора."}},

   {fipi:"№1", tag:"четырёхугольники", lvl:2, t:"Один угол вписанного четырёхугольника равен 78°. Найдите противолежащий ему угол.", a:"102", hint:"В вписанном четырёхугольнике сумма противолежащих углов равна 180°.", sol:["Свойство вписанного четырёхугольника: сумма противоположных углов — 180°.", "Значит противолежащий угол равен 180° − 78°.", "Считаем: 180 − 78 = 102."], solRich:[{s:"Свойство вписанного четырёхугольника: сумма противоположных углов — 180°.",w:"Вписанный угол всегда вдвое меньше дуги, на которую опирается. Это главный инструмент в задачах про окружность."}, {s:"Значит противолежащий угол равен 180° − 78°.",w:"Финальный шаг — фиксируем результат."}, {s:"Считаем: 180 − 78 = 102.",w:""}], rule:{title:"Четырёхугольники: ключевые свойства",text:"Ромб: диагонали перпендикулярны и делятся пополам, площадь S = (d₁·d₂)/2. Трапеция: средняя линия равна полусумме оснований. Вписанный четырёхугольник: сумма противоположных углов 180°. Параллелограмм: противоположные стороны и углы равны, площадь S = ah."}},
   {fipi:"№1", tag:"окружности", lvl:4, t:"Из точки вне окружности проведены касательная и секущая. Касательная равна 6, внешняя часть секущей равна 4. Найдите длину секущей.", a:"9", hint:"Квадрат касательной равен произведению всей секущей на её внешнюю часть.", sol:["Записываем теорему о касательной и секущей: t² = (внешняя часть) · (вся секущая).", "Обозначим всю секущую через x: 6² = 4 · x.", "Тогда 36 = 4x.", "x = 9."], solRich:[{s:"Записываем теорему о касательной и секущей: t² = (внешняя часть) · (вся секущая).",w:"Радиус в точку касания перпендикулярен касательной — отсюда берётся прямой угол, а с ним и все дальнейшие вычисления."}, {s:"Обозначим всю секущую через x: 6² = 4 · x.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"Тогда 36 = 4x.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"x = 9.",w:"Арифметика. Если ответ выглядит странно — пересчитайте этот шаг."}], rule:{title:"Касательная к окружности",text:"Радиус, проведённый в точку касания, перпендикулярен касательной — это даёт прямоугольный треугольник, в котором работает теорема Пифагора и суммы углов. Из внешней точки: квадрат касательной равен произведению секущей на её внешнюю часть."}},
   {fipi:"№1", tag:"треугольники", lvl:4, t:"В прямоугольном треугольнике катеты равны 6 и 8. Найдите высоту, проведённую к гипотенузе.", a:"4,8", hint:"Площадь треугольника можно выразить двумя способами: через катеты и через гипотенузу с высотой.", sol:["Гипотенуза по теореме Пифагора: c = √(6² + 8²) = √100 = 10.", "Площадь через катеты: S = (6 · 8) : 2 = 24.", "Через гипотенузу и высоту: S = (c · h) : 2 = (10 · h) : 2.", "Приравниваем: 24 = 5h.", "Значит h = 4,8."], solRich:[{s:"Гипотенуза по теореме Пифагора: c = √(6² + 8²) = √100 = 10.",w:"Подставляем числа в формулу — здесь важна аккуратность со знаками."}, {s:"Площадь через катеты: S = (6 · 8) : 2 = 24.",w:"Площадь — величина поверхности фигуры. Формула выбирается по тому, какие элементы известны: стороны, высота, угол или диагонали."}, {s:"Через гипотенузу и высоту: S = (c · h) : 2 = (10 · h) : 2.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}, {s:"Приравниваем: 24 = 5h.",w:"Арифметика. Если ответ выглядит странно — пересчитайте этот шаг."}, {s:"Значит h = 4,8.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
   {fipi:"№1", tag:"треугольники", lvl:3, t:"Сторона равностороннего треугольника равна 6√3. Найдите высоту этого треугольника.", a:"9", hint:"Высота равностороннего треугольника: h = a·√3/2.", sol:["Подставляем в формулу: h = 6√3 · √3 / 2.", "Считаем числитель: 6 · √3 · √3 = 6 · 3 = 18.", "Делим на 2: 18 : 2 = 9."], solRich:[{s:"Подставляем в формулу: h = 6√3 · √3 / 2.",w:""}, {s:"Считаем числитель: 6 · √3 · √3 = 6 · 3 = 18.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"Делим на 2: 18 : 2 = 9.",w:"Промежуточный результат. Проверьте себя: он должен быть правдоподобным по смыслу задачи."}], rule:{title:"Как работать с корнями",text:"Корень — обратная операция к возведению в квадрат: √a — это число, квадрат которого равен a. Произведение корней можно объединить под один корень, частное — тоже. Ищите под корнем полный квадрат: √36 = 6."}},
   {fipi:"№1", tag:"окружности", lvl:3, t:"Радиус круга равен 6. Найдите площадь сектора, центральный угол которого равен 60°.", a:"18,85", hint:"Площадь сектора — это часть площади круга, пропорциональная углу: S = πr²·(α/360°).", sol:["Площадь всего круга: S = πr² = π · 36 = 36π.", "Угол 60° составляет 60/360 = 1/6 полного круга.", "Площадь сектора: 36π : 6 = 6π.", "6π ≈ 6 · 3,14 = 18,84."], solRich:[{s:"Площадь всего круга: S = πr² = π · 36 = 36π.",w:"Площадь — величина поверхности фигуры. Формула выбирается по тому, какие элементы известны: стороны, высота, угол или диагонали."}, {s:"Угол 60° составляет 60/360 = 1/6 полного круга.",w:"Считаем: следим, чтобы все величины были в одних единицах."}, {s:"Площадь сектора: 36π : 6 = 6π.",w:"Площадь — величина поверхности фигуры. Формула выбирается по тому, какие элементы известны: стороны, высота, угол или диагонали."}, {s:"6π ≈ 6 · 3,14 = 18,84.",w:"Арифметика. Если ответ выглядит странно — пересчитайте этот шаг."}], rule:{title:"Как искать площадь",text:"Выбор формулы зависит от того, что известно: основание и высота (S = ½ah), две стороны и угол (S = ½ab·sin C), три стороны (Герон), диагонали (S = ½d₁d₂sin φ). Если фигура — часть круга, используем доли: сектор 60° — это 1/6 круга."}},
   {fipi:"№1", tag:"треугольники", lvl:3, t:"Треугольники подобны, коэффициент подобия равен 3. Во сколько раз площадь второго треугольника больше площади первого?", a:"9", hint:"Отношение площадей подобных фигур равно квадрату коэффициента подобия.", sol:["Коэффициент подобия k = 3.", "Свойство: площади подобных фигур относятся как k².", "Значит отношение площадей: 3² = 9.", "Ответ: в 9 раз."], solRich:[{s:"Коэффициент подобия k = 3.",w:"У подобных фигур углы равны, а стороны пропорциональны. Площади относятся как квадрат коэффициента подобия, объёмы — как куб."}, {s:"Свойство: площади подобных фигур относятся как k².",w:"Площадь — величина поверхности фигуры. Формула выбирается по тому, какие элементы известны: стороны, высота, угол или диагонали."}, {s:"Значит отношение площадей: 3² = 9.",w:"Финальный шаг — фиксируем результат."}, {s:"Ответ: в 9 раз.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Треугольники: рабочий набор",text:"Сумма углов — 180°. Площадь: через основание и высоту S = ½ah, через две стороны и угол S = ½ab·sin C, через полупериметр (формула Герона). Для любого треугольника — теорема косинусов c² = a² + b² − 2ab·cos C. Для прямоугольного — Пифагор и отношения sin/cos/tg."}},
  ]},

{ id:"vec", title:"Векторы", emoji:"➡️", fipi:"№2", note:"координаты, скалярное произведение",
  qs:[
   {fipi:"№2", tag:"длина вектора", lvl:3, t:"Даны векторы a(2; 0) и b(1; 4). Найдите длину вектора a + 3b.", a:"13", hint:"Сначала сложите покоординатно, потом найдите длину по формуле √(x² + y²).", sol:["3b = (3; 12).", "a + 3b = (5; 12).", "|a + 3b| = √(25 + 144) = √169 = 13."], solRich:[{s:"3b = (3; 12).",w:""}, {s:"a + 3b = (5; 12).",w:""}, {s:"|a + 3b| = √(25 + 144) = √169 = 13.",w:""}], rule:{title:"Длина вектора",text:"|a| = √(x² + y²) на плоскости и √(x² + y² + z²) в пространстве. Это теорема Пифагора: вектор — гипотенуза прямоугольного треугольника, построенного на его координатах. Квадрат длины — это x² + y², иногда спрашивают именно его."}},
   {fipi:"№2", tag:"скалярное произведение", lvl:3, t:"Даны векторы a(5; 4) и b(8; −9). Найдите скалярное произведение a · b.", a:"4", hint:"Скалярное произведение в координатах: x₁x₂ + y₁y₂.", sol:["a · b = 5 · 8 + 4 · (−9).", "= 40 − 36 = 4."], solRich:[{s:"a · b = 5 · 8 + 4 · (−9).",w:""}, {s:"= 40 − 36 = 4.",w:""}], rule:{title:"Скалярное произведение векторов",text:"Через координаты: a·b = x₁x₂ + y₁y₂. Результат — число, не вектор. Если оно положительно, угол острый; равно нулю — векторы перпендикулярны; отрицательно — угол тупой."}},
   {fipi:"№2", tag:"длина вектора", lvl:3, t:"Даны векторы a(1; 2), b(−3; 6) и c(4; −2). Найдите длину вектора a − b + c.", a:"10", hint:"Сначала выполните все действия покоординатно, затем найдите длину.", sol:["a − b + c = (1 + 3 + 4; 2 − 6 − 2) = (8; −6).", "|(8; −6)| = √(64 + 36) = √100 = 10."], solRich:[{s:"a − b + c = (1 + 3 + 4; 2 − 6 − 2) = (8; −6).",w:""}, {s:"|(8; −6)| = √(64 + 36) = √100 = 10.",w:""}], rule:{title:"Длина вектора",text:"|a| = √(x² + y²) на плоскости и √(x² + y² + z²) в пространстве. Это теорема Пифагора: вектор — гипотенуза прямоугольного треугольника, построенного на его координатах. Квадрат длины — это x² + y², иногда спрашивают именно его."}},
   {fipi:"№2", tag:"длина вектора", lvl:3, t:"Найдите длину вектора a(−3; 4).", a:"5", hint:"|a| = √(x² + y²).", sol:["|a| = √(9 + 16) = √25.", "= 5."], solRich:[{s:"|a| = √(9 + 16) = √25.",w:""}, {s:"= 5.",w:""}], rule:{title:"Длина вектора",text:"|a| = √(x² + y²) на плоскости и √(x² + y² + z²) в пространстве. Это теорема Пифагора: вектор — гипотенуза прямоугольного треугольника, построенного на его координатах. Квадрат длины — это x² + y², иногда спрашивают именно его."}},
   {fipi:"№2", tag:"длина вектора", lvl:3, t:"Найдите длину вектора a(6; −8).", a:"10", hint:"Египетский треугольник 6–8–10.", sol:["|a| = √(36 + 64) = √100.", "= 10."], solRich:[{s:"|a| = √(36 + 64) = √100.",w:""}, {s:"= 10.",w:""}], rule:{title:"Длина вектора",text:"|a| = √(x² + y²) на плоскости и √(x² + y² + z²) в пространстве. Это теорема Пифагора: вектор — гипотенуза прямоугольного треугольника, построенного на его координатах. Квадрат длины — это x² + y², иногда спрашивают именно его."}},
   {fipi:"№2", tag:"скалярное произведение", lvl:3, t:"Даны векторы a(2; −5) и b(5; 7). Найдите скалярное произведение a · b.", a:"-25", hint:"Перемножьте одноимённые координаты и сложите, следя за знаками.", sol:["a · b = 2 · 5 + (−5) · 7.", "= 10 − 35 = −25."], solRich:[{s:"a · b = 2 · 5 + (−5) · 7.",w:""}, {s:"= 10 − 35 = −25.",w:""}], rule:{title:"Скалярное произведение векторов",text:"Через координаты: a·b = x₁x₂ + y₁y₂. Результат — число, не вектор. Если оно положительно, угол острый; равно нулю — векторы перпендикулярны; отрицательно — угол тупой."}},
   {fipi:"№2", tag:"действия с векторами", lvl:3, t:"Даны векторы a(−2; 4) и b(2; −1). Найдите косинус угла между векторами a и b.", a:"-0.8", hint:"cos φ = (a · b) / (|a| · |b|).", sol:["a · b = −4 − 4 = −8.", "|a| = √20, |b| = √5, |a| · |b| = √100 = 10.", "cos φ = −8 / 10 = −0,8."], solRich:[{s:"a · b = −4 − 4 = −8.",w:""}, {s:"|a| = √20, |b| = √5, |a| · |b| = √100 = 10.",w:""}, {s:"cos φ = −8 / 10 = −0,8.",w:""}], rule:{title:"Действия с векторами",text:"Сложение и вычитание — покоординатно. Умножение на число — каждая координата умножается. Вектор AB = (x_конца − x_начала; y_конца − y_начала) — «из конца вычитаем начало»."}},
   {fipi:"№2", tag:"длина вектора", lvl:3, t:"Даны векторы a(3; 7) и b(8; 9). Найдите длину вектора 1,2a − 0,7b.", a:"2.9", hint:"Умножьте каждый вектор на коэффициент, вычтите, найдите длину.", sol:["1,2a = (3,6; 8,4); 0,7b = (5,6; 6,3).", "Разность: (−2; 2,1).", "Длина: √(4 + 4,41) = √8,41 = 2,9."], solRich:[{s:"1,2a = (3,6; 8,4); 0,7b = (5,6; 6,3).",w:""}, {s:"Разность: (−2; 2,1).",w:""}, {s:"Длина: √(4 + 4,41) = √8,41 = 2,9.",w:""}], rule:{title:"Длина вектора",text:"|a| = √(x² + y²) на плоскости и √(x² + y² + z²) в пространстве. Это теорема Пифагора: вектор — гипотенуза прямоугольного треугольника, построенного на его координатах. Квадрат длины — это x² + y², иногда спрашивают именно его."}},
   {fipi:"№2", tag:"скалярное произведение", lvl:3, t:"Даны векторы a(4; −3) и b(2; 1). Найдите скалярное произведение a · b.", a:"5", hint:"x₁x₂ + y₁y₂, аккуратно со знаком минус.", sol:["Скалярное произведение: a · b = x₁x₂ + y₁y₂.", "4 · 2 + (−3) · 1 = 8 − 3 = 5.", "Результат положительный, угол между векторами острый."], solRich:[{s:"Скалярное произведение: a · b = x₁x₂ + y₁y₂.",w:""}, {s:"4 · 2 + (−3) · 1 = 8 − 3 = 5.",w:""}, {s:"Результат положительный, угол между векторами острый.",w:""}], rule:{title:"Скалярное произведение векторов",text:"Через координаты: a·b = x₁x₂ + y₁y₂. Результат — число, не вектор. Если оно положительно, угол острый; равно нулю — векторы перпендикулярны; отрицательно — угол тупой."}},
   {fipi:"№2", tag:"скалярное произведение", lvl:3, t:"Даны векторы a(−1; 2) и b(3; 4). Найдите скалярное произведение a · b.", a:"5", hint:"Первое произведение отрицательное — не потеряйте знак.", sol:["a · b = (−1) · 3 + 2 · 4.", "= −3 + 8 = 5."], solRich:[{s:"a · b = (−1) · 3 + 2 · 4.",w:""}, {s:"= −3 + 8 = 5.",w:""}], rule:{title:"Скалярное произведение векторов",text:"Через координаты: a·b = x₁x₂ + y₁y₂. Результат — число, не вектор. Если оно положительно, угол острый; равно нулю — векторы перпендикулярны; отрицательно — угол тупой."}},
   {fipi:"№2", tag:"коллинеарность", lvl:3, t:"Даны векторы a(6; −4) и b(3; y). Известно, что векторы коллинеарны. Найдите y.", a:"-2", hint:"У коллинеарных векторов координаты пропорциональны.", sol:["6/3 = −4/y.", "2 = −4/y ⇒ y = −2."], solRich:[{s:"6/3 = −4/y.",w:""}, {s:"2 = −4/y ⇒ y = −2.",w:""}], rule:{title:"Коллинеарность векторов",text:"Векторы коллинеарны, если пропорциональны их координаты: x₁/x₂ = y₁/y₂ (или x₁y₂ = x₂y₁ — так удобнее, без деления). Нулевой вектор коллинеарен любому."}},
   {fipi:"№2", tag:"действия с векторами", lvl:3, t:"Даны векторы a(2; −1) и b(−4; y). Известно, что векторы перпендикулярны. Найдите y.", a:"-8", hint:"У перпендикулярных векторов скалярное произведение равно нулю.", sol:["2 · (−4) + (−1) · y = 0.", "−8 − y = 0 ⇒ y = −8."], solRich:[{s:"2 · (−4) + (−1) · y = 0.",w:""}, {s:"−8 − y = 0 ⇒ y = −8.",w:""}], rule:{title:"Действия с векторами",text:"Сложение и вычитание — покоординатно. Умножение на число — каждая координата умножается. Вектор AB = (x_конца − x_начала; y_конца − y_начала) — «из конца вычитаем начало»."}},
   {fipi:"№2", tag:"скалярное произведение", lvl:3, t:"Даны векторы a(−5; 0) и b(0; 3). Найдите скалярное произведение a · b.", a:"0", hint:"Обе пары одноимённых координат дают ноль.", sol:["a · b = (−5) · 0 + 0 · 3 = 0.", "Нулевое скалярное произведение — векторы перпендикулярны."], solRich:[{s:"a · b = (−5) · 0 + 0 · 3 = 0.",w:""}, {s:"Нулевое скалярное произведение — векторы перпендикулярны.",w:"Скалярное произведение через координаты: x₁x₂ + y₁y₂. Результат — число, а не вектор."}], rule:{title:"Скалярное произведение векторов",text:"Через координаты: a·b = x₁x₂ + y₁y₂. Результат — число, не вектор. Если оно положительно, угол острый; равно нулю — векторы перпендикулярны; отрицательно — угол тупой."}},
   {fipi:"№2", tag:"длина вектора", lvl:3, t:"Найдите длину вектора a(5; 12).", a:"13", hint:"Пифагорова тройка 5–12–13.", sol:["|a| = √(25 + 144) = √169.", "= 13."], solRich:[{s:"|a| = √(25 + 144) = √169.",w:""}, {s:"= 13.",w:""}], rule:{title:"Длина вектора",text:"|a| = √(x² + y²) на плоскости и √(x² + y² + z²) в пространстве. Это теорема Пифагора: вектор — гипотенуза прямоугольного треугольника, построенного на его координатах. Квадрат длины — это x² + y², иногда спрашивают именно его."}},

  qs:[
   {fipi:"№3", fig:"cube", tag:"куб и призма", lvl:3, t:"Объём куба равен 27. Найдите его ребро.", a:"3", hint:"V = a³.", sol:["a³ = 27.", "a = 3."], solRich:[{s:"a³ = 27.",w:""}, {s:"a = 3.",w:""}], rule:{title:"Куб и прямоугольный параллелепипед",text:"Куб: V = a³, полная поверхность S = 6a², диагональ d = a√3. Параллелепипед: V = abc, поверхность S = 2(ab + bc + ac). Призма: V = S_осн · h."}},
   {fipi:"№3", fig:"cube", tag:"куб и призма", lvl:3, t:"Диагональ куба равна 3√3. Найдите объём куба.", a:"27", hint:"Диагональ куба d = a√3.", sol:["a√3 = 3√3 ⇒ a = 3.", "V = a³ = 27."], solRich:[{s:"a√3 = 3√3 ⇒ a = 3.",w:""}, {s:"V = a³ = 27.",w:""}], rule:{title:"Как работать с корнями",text:"Корень — обратная операция к возведению в квадрат: √a — это число, квадрат которого равен a. Произведение корней можно объединить под один корень, частное — тоже. Ищите под корнем полный квадрат: √36 = 6."}},
   {fipi:"№3", fig:"cube", tag:"тела вращения", lvl:3, t:"Куб описан около сферы радиуса 2. Найдите объём куба.", a:"64", hint:"Ребро куба равно диаметру вписанной сферы.", sol:["a = 2R = 4.", "V = a³ = 64."], solRich:[{s:"a = 2R = 4.",w:""}, {s:"V = a³ = 64.",w:""}], rule:{title:"Шар и сфера",text:"Объём шара V = (4/3)πR³, площадь поверхности S = 4πR². Обе формулы зависят от радиуса: объём — от куба, площадь — от квадрата. Поэтому при увеличении радиуса в k раз объём растёт в k³, а площадь — в k²."}},
   {fipi:"№3", fig:"box", tag:"куб и призма", lvl:3, t:"Измерения прямоугольного параллелепипеда равны 2, 3 и 4. Найдите площадь его поверхности.", a:"52", hint:"S = 2(ab + ac + bc).", sol:["S = 2(6 + 8 + 12).", "S = 52."], solRich:[{s:"S = 2(6 + 8 + 12).",w:""}, {s:"S = 52.",w:""}], rule:{title:"Как искать площадь",text:"Выбор формулы зависит от того, что известно: основание и высота (S = ½ah), две стороны и угол (S = ½ab·sin C), три стороны (Герон), диагонали (S = ½d₁d₂sin φ). Если фигура — часть круга, используем доли: сектор 60° — это 1/6 круга."}},
   {fipi:"№3", fig:"box", tag:"куб и призма", lvl:3, t:"Объём прямоугольного параллелепипеда равен 24, два измерения равны 3 и 4. Найдите третье измерение.", a:"2", hint:"V = abc.", sol:["12c = 24.", "c = 2."], solRich:[{s:"12c = 24.",w:""}, {s:"c = 2.",w:""}], rule:{title:"Куб и прямоугольный параллелепипед",text:"Куб: V = a³, полная поверхность S = 6a², диагональ d = a√3. Параллелепипед: V = abc, поверхность S = 2(ab + bc + ac). Призма: V = S_осн · h."}},
   {fipi:"№3", fig:"cyl", tag:"тела вращения", lvl:3, t:"Объём цилиндра равен 12π, а высота равна 3. Найдите радиус основания.", a:"2", hint:"V = πR²H.", sol:["3πR² = 12π.", "R² = 4 ⇒ R = 2."], solRich:[{s:"3πR² = 12π.",w:""}, {s:"R² = 4 ⇒ R = 2.",w:""}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", fig:"cyl", tag:"тела вращения", lvl:3, t:"Цилиндр и конус имеют общее основание и общую высоту. Объём цилиндра равен 81. Найдите объём конуса.", a:"27", hint:"Объём конуса — треть объёма цилиндра при равных основании и высоте.", sol:["V = 81 / 3.", "= 27."], solRich:[{s:"V = 81 / 3.",w:""}, {s:"= 27.",w:""}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", fig:"cyl", tag:"тела вращения", lvl:3, t:"В цилиндрическом сосуде уровень жидкости достигает 2 см. Её перелили во второй сосуд, диаметр которого в 3 раза меньше диаметра первого. На какой высоте окажется уровень жидкости? Ответ дайте в сантиметрах.", a:"18", hint:"Объём не меняется: во сколько раз меньше площадь основания, во столько раз больше высота.", sol:["Радиус меньше в 3 раза ⇒ площадь основания меньше в 9 раз.", "Высота во столько же раз больше: 2 · 9 = 18 см."], solRich:[{s:"Радиус меньше в 3 раза ⇒ площадь основания меньше в 9 раз.",w:""}, {s:"Высота во столько же раз больше: 2 · 9 = 18 см.",w:""}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", fig:"cone", tag:"тела вращения", lvl:3, t:"Объём конуса равен 100π, а высота равна 12. Найдите радиус основания.", a:"5", hint:"V = ⅓πR²H.", sol:["4πR² = 100π.", "R² = 25 ⇒ R = 5."], solRich:[{s:"4πR² = 100π.",w:""}, {s:"R² = 25 ⇒ R = 5.",w:""}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", fig:"cone", tag:"тела вращения", lvl:3, t:"Во сколько раз уменьшится объём конуса, если его высоту уменьшить в 3 раза?", a:"3", hint:"Объём пропорционален высоте при неизменном радиусе.", sol:["V = ⅓πR²H — объём прямо пропорционален H.", "Уменьшение H в 3 раза даёт уменьшение объёма в 3 раза."], solRich:[{s:"V = ⅓πR²H — объём прямо пропорционален H.",w:"Объём — это «сколько места занимает тело». Для каждой фигуры своя формула, но у всех есть множитель-площадь основания и высота."}, {s:"Уменьшение H в 3 раза даёт уменьшение объёма в 3 раза.",w:"Объём — это «сколько места занимает тело». Для каждой фигуры своя формула, но у всех есть множитель-площадь основания и высота."}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", fig:"sphere", tag:"тела вращения", lvl:3, t:"Площадь поверхности шара равна 12. Найдите площадь большого круга шара.", a:"3", hint:"S(сферы) = 4πR², площадь большого круга πR².", sol:["4πR² = 12 ⇒ πR² = 3.", "Площадь большого круга равна πR² = 3."], solRich:[{s:"4πR² = 12 ⇒ πR² = 3.",w:""}, {s:"Площадь большого круга равна πR² = 3.",w:""}], rule:{title:"Как искать площадь",text:"Выбор формулы зависит от того, что известно: основание и высота (S = ½ah), две стороны и угол (S = ½ab·sin C), три стороны (Герон), диагонали (S = ½d₁d₂sin φ). Если фигура — часть круга, используем доли: сектор 60° — это 1/6 круга."}},
   {fipi:"№3", fig:"sphere", tag:"тела вращения", lvl:3, t:"Даны два шара. Диаметр первого в 8 раз больше диаметра второго. Во сколько раз площадь поверхности первого больше?", a:"64", hint:"Площади подобных тел относятся как квадрат коэффициента подобия.", sol:["k = 8.", "Отношение площадей: k² = 64."], solRich:[{s:"k = 8.",w:""}, {s:"Отношение площадей: k² = 64.",w:""}], rule:{title:"Как искать площадь",text:"Выбор формулы зависит от того, что известно: основание и высота (S = ½ah), две стороны и угол (S = ½ab·sin C), три стороны (Герон), диагонали (S = ½d₁d₂sin φ). Если фигура — часть круга, используем доли: сектор 60° — это 1/6 круга."}},
   {fipi:"№3", tag:"тела вращения", lvl:3, t:"Одна цилиндрическая кружка вдвое выше второй, зато вторая в полтора раза шире. Найдите отношение объёма второй кружки к объёму первой.", a:"1.125", hint:"V = πR²H. Сравните радиус и высоту.", sol:["V₁ = πR²·2H (первая: высота 2H, радиус R).", "V₂ = π(1,5R)²·H = 2,25πR²H.", "V₂ / V₁ = 2,25 / 2 = 1,125."], solRich:[{s:"V₁ = πR²·2H (первая: высота 2H, радиус R).",w:""}, {s:"V₂ = π(1,5R)²·H = 2,25πR²H.",w:""}, {s:"V₂ / V₁ = 2,25 / 2 = 1,125.",w:""}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", fig:"coneLevel", tag:"тела вращения", lvl:3, t:"В сосуде, имеющем форму конуса, уровень жидкости достигает ½ высоты. Объём жидкости равен 20 мл. Сколько миллилитров нужно долить, чтобы наполнить сосуд?", a:"140", hint:"Объёмы подобных конусов относятся как куб коэффициента подобия.", sol:["Маленький конус подобен большому с k = ½.", "V(малого) = ⅛ V(большого) ⇒ V(большого) = 20 · 8 = 160 мл.", "Долить: 160 − 20 = 140 мл."], solRich:[{s:"Маленький конус подобен большому с k = ½.",w:""}, {s:"V(малого) = ⅛ V(большого) ⇒ V(большого) = 20 · 8 = 160 мл.",w:""}, {s:"Долить: 160 − 20 = 140 мл.",w:""}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", tag:"тела вращения", lvl:3, t:"Цилиндр описан около шара. Объём шара равен 50. Найдите объём цилиндра.", a:"75", hint:"У описанного цилиндра H = 2R. Тогда V(цил) = 2πR³ = 1,5 · V(шара)? Проверьте через формулы.", sol:["V(шара) = (4/3)πR³ = 50 ⇒ πR³ = 37,5.", "V(цил) = πR²H = πR²·2R = 2πR³.", "V(цил) = 2 · 37,5 = 75."], solRich:[{s:"V(шара) = (4/3)πR³ = 50 ⇒ πR³ = 37,5.",w:""}, {s:"V(цил) = πR²H = πR²·2R = 2πR³.",w:""}, {s:"V(цил) = 2 · 37,5 = 75.",w:""}], rule:{title:"Шар и сфера",text:"Объём шара V = (4/3)πR³, площадь поверхности S = 4πR². Обе формулы зависят от радиуса: объём — от куба, площадь — от квадрата. Поэтому при увеличении радиуса в k раз объём растёт в k³, а площадь — в k²."}},
   {fipi:"№3", tag:"тела вращения", lvl:3, t:"Площадь боковой поверхности конуса равна 15π, а радиус основания равен 3. Найдите образующую конуса.", a:"5", hint:"S(бок) = πRl.", sol:["π · 3 · l = 15π.", "l = 5."], solRich:[{s:"π · 3 · l = 15π.",w:""}, {s:"l = 5.",w:""}], rule:{title:"Как искать площадь",text:"Выбор формулы зависит от того, что известно: основание и высота (S = ½ah), две стороны и угол (S = ½ab·sin C), три стороны (Герон), диагонали (S = ½d₁d₂sin φ). Если фигура — часть круга, используем доли: сектор 60° — это 1/6 круга."}},
   {fipi:"№3", tag:"тела вращения", lvl:3, t:"Радиус основания цилиндра увеличили в 2 раза, а высоту уменьшили в 4 раза. Как изменился объём?", a:"1", hint:"Подставьте изменения в формулу V = πR²H.", sol:["V = πR²H; новый: π(2R)²·(H/4) = π·4R²·H/4 = πR²H.", "Объём не изменился — отношение равно 1."], solRich:[{s:"V = πR²H; новый: π(2R)²·(H/4) = π·4R²·H/4 = πR²H.",w:""}, {s:"Объём не изменился — отношение равно 1.",w:"Объём — это «сколько места занимает тело». Для каждой фигуры своя формула, но у всех есть множитель-площадь основания и высота."}], rule:{title:"Цилиндр и конус",text:"Цилиндр: V = πR²h, S_бок = 2πRh. Конус: V = (1/3)πR²h, образующая l = √(R² + h²). Конус — это ровно треть цилиндра с тем же основанием и высотой, поэтому объёмы относятся как 1:3."}},
   {fipi:"№3", fig:"box", tag:"куб и призма", lvl:3, t:"Кирпич имеет размеры 25 × 12 × 6,5 см. Найдите его объём. Ответ дайте в кубических сантиметрах.", a:"1950", hint:"V = abc.", sol:["V = 25 · 12 · 6,5.", "V = 1950 см³."], solRich:[{s:"V = 25 · 12 · 6,5.",w:""}, {s:"V = 1950 см³.",w:""}], rule:{title:"Куб и прямоугольный параллелепипед",text:"Куб: V = a³, полная поверхность S = 6a², диагональ d = a√3. Параллелепипед: V = abc, поверхность S = 2(ab + bc + ac). Призма: V = S_осн · h."}},
   {fipi:"№3", tag:"куб и призма", lvl:3, t:"Сторона основания правильной треугольной призмы равна 2, а высота равна 5. Найдите объём призмы.", a:"8.66", hint:"V = S(основания) · H; площадь правильного треугольника S = a²√3/4.", sol:["S = 2²√3/4 = √3.", "V = √3 · 5 = 5√3 ≈ 8,66."], solRich:[{s:"S = 2²√3/4 = √3.",w:""}, {s:"V = √3 · 5 = 5√3 ≈ 8,66.",w:""}], rule:{title:"Механика",text:"Путь при равномерном движении S = v·t. Кинетическая энергия E = mv²/2, потенциальная E = mgh. Свободное падение h = gt²/2, скорость v = gt. Давление p = F/S. Работа A = F·S."}},

   {fipi:"№3", tag:"тела вращения", lvl:3, t:"В бак, имеющий форму цилиндра, налили 5000 литров воды. Найдите высоту уровня воды в сантиметрах, если площадь основания бака равна 2 м².", a:"250", hint:"Объём цилиндра V = S · H. Переведите литры в м³: 1 л = 0,001 м³.", sol:["V = 5000 л = 5 м³.", "H = V / S = 5 / 2 = 2,5 м.", "2,5 м = 250 см."], solRich:[{s:"V = 5000 л = 5 м³.",w:""}, {s:"H = V / S = 5 / 2 = 2,5 м.",w:""}, {s:"2,5 м = 250 см.",w:""}], rule:{title:"Как искать площадь",text:"Выбор формулы зависит от того, что известно: основание и высота (S = ½ah), две стороны и угол (S = ½ab·sin C), три стороны (Герон), диагонали (S = ½d₁d₂sin φ). Если фигура — часть круга, используем доли: сектор 60° — это 1/6 круга."}},

   {fipi:"№3", tag:"тела вращения", lvl:3, t:"Шар объёмом 12 вписан в цилиндр. Найдите объём цилиндра.", a:"18", hint:"У цилиндра, описанного около шара, H = 2R.", sol:["V(шара) = (4/3)πR³ = 12 ⇒ πR³ = 9.", "V(цил) = 2πR³ = 18."], solRich:[{s:"V(шара) = (4/3)πR³ = 12 ⇒ πR³ = 9.",w:""}, {s:"V(цил) = 2πR³ = 18.",w:""}], rule:{title:"Шар и сфера",text:"Объём шара V = (4/3)πR³, площадь поверхности S = 4πR². Обе формулы зависят от радиуса: объём — от куба, площадь — от квадрата. Поэтому при увеличении радиуса в k раз объём растёт в k³, а площадь — в k²."}},

   {fipi:"№7", tag:"тригонометрические", lvl:3, t:"Найдите корень уравнения sin x = 1 на отрезке [0; 2π]. Ответ дайте в градусах.", a:"90", hint:"Синус равен единице только в верхней точке окружности.", sol:["По тригонометрической окружности: значение sin x равно 1 только в точке с координатой y = 1 — верхняя точка круга.", "Это соответствует углу 90° (или π/2 радиан).", "Он принадлежит отрезку [0; 2π], поэтому подходит.", "Ответ: 90."], solRich:[{s:"По тригонометрической окружности: значение sin x равно 1 только в точке с координатой y = 1 — верхняя точка круга.",w:""}, {s:"Это соответствует углу 90° (или π/2 радиан).",w:""}, {s:"Он принадлежит отрезку [0; 2π], поэтому подходит.",w:""}, {s:"Ответ: 90.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Тригонометрия: что держать в голове",text:"Основное тождество sin²α + cos²α = 1 связывает синус и косинус: знаете одно — найдёте другое. Табличные значения (30°, 45°, 60°) нужно знать наизусть. Угол острый — обе функции положительны. Формулы двойного угла: sin2α = 2sinαcosα, cos2α = cos²α − sin²α."}},
   {fipi:"№7", tag:"тригонометрические", lvl:2, t:"Решите уравнение cos x = 0,5 на отрезке [0°; 180°]. Ответ дайте в градусах.", a:"60", hint:"Косинус равен 0,5 при угле 60°.", sol:["Вспоминаем табличное значение: cos 60° = 0,5.", "У косинуса на отрезке [0°; 180°] всего один корень с таким значением — 60° (второй корень был бы 300°, он вне отрезка).", "Ответ: 60."], solRich:[{s:"Вспоминаем табличное значение: cos 60° = 0,5.",w:""}, {s:"У косинуса на отрезке [0°; 180°] всего один корень с таким значением — 60° (второй корень был бы 300°, он вне отрезка).",w:""}, {s:"Ответ: 60.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Тригонометрия: что держать в голове",text:"Основное тождество sin²α + cos²α = 1 связывает синус и косинус: знаете одно — найдёте другое. Табличные значения (30°, 45°, 60°) нужно знать наизусть. Угол острый — обе функции положительны. Формулы двойного угла: sin2α = 2sinαcosα, cos2α = cos²α − sin²α."}},

   {fipi:"№7", tag:"квадратные", lvl:2, t:"Решите уравнение x<sup>2</sup> + (-8)x + 15 = 0. Если корней несколько, в ответ запишите больший.", a:"5", hint:"Теорема Виета: сумма корней равна −b, а произведение — c.", sol:["Выписываем коэффициенты: b = (-8), c = 15.", "По теореме Виета: x₁ · x₂ = 15 и x₁ + x₂ = 8.", "Подбираем пару чисел: произведение 15, сумма 8 — это 5 и 3.", "Из двух корней больший — 5."], solRich:[{s:"Выписываем коэффициенты: b = (-8), c = 15.",w:""}, {s:"По теореме Виета: x₁ · x₂ = 15 и x₁ + x₂ = 8.",w:""}, {s:"Подбираем пару чисел: произведение 15, сумма 8 — это 5 и 3.",w:"Квадратное уравнение решается через дискриминант или по теореме Виета — подбор быстрее, если корни целые."}, {s:"Из двух корней больший — 5.",w:"Квадратное уравнение решается через дискриминант или по теореме Виета — подбор быстрее, если корни целые."}], rule:{title:"Как решать квадратные уравнения",text:"Через дискриминант: D = b² − 4ac; корни x = (−b ± √D)/(2a). Или по теореме Виета: сумма корней равна −b, произведение равно c. Подбор по Виету быстрее, когда корни целые."}},

   {fipi:"№7", tag:"квадратные", lvl:2, t:"Решите уравнение x<sup>2</sup> + (-12)x + 35 = 0. Если корней несколько, в ответ запишите больший.", a:"7", hint:"Теорема Виета: сумма корней равна −b, а произведение — c.", sol:["Выписываем коэффициенты: b = (-12), c = 35.", "По теореме Виета: x₁ · x₂ = 35 и x₁ + x₂ = 12.", "Подбираем пару чисел: произведение 35, сумма 12 — это 7 и 5.", "Из двух корней больший — 7."], solRich:[{s:"Выписываем коэффициенты: b = (-12), c = 35.",w:""}, {s:"По теореме Виета: x₁ · x₂ = 35 и x₁ + x₂ = 12.",w:""}, {s:"Подбираем пару чисел: произведение 35, сумма 12 — это 7 и 5.",w:"Квадратное уравнение решается через дискриминант или по теореме Виета — подбор быстрее, если корни целые."}, {s:"Из двух корней больший — 7.",w:"Квадратное уравнение решается через дискриминант или по теореме Виета — подбор быстрее, если корни целые."}], rule:{title:"Как решать квадратные уравнения",text:"Через дискриминант: D = b² − 4ac; корни x = (−b ± √D)/(2a). Или по теореме Виета: сумма корней равна −b, произведение равно c. Подбор по Виету быстрее, когда корни целые."}},
   {fipi:"№7", tag:"показательные", lvl:2, t:"Решите уравнение 5<sup>x+2</sup> = 125.", a:"1", hint:"Приведите 125 к степени пятёрки.", sol:["Замечаем, что 125 = 5<sup>3</sup>.", "Уравнение принимает вид 5<sup>x+2</sup> = 5<sup>3</sup>.", "Основания равны — равны и показатели: x + 2 = 3.", "Отсюда x = 1."], solRich:[{s:"Замечаем, что 125 = 5<sup>3</sup>.",w:""}, {s:"Уравнение принимает вид 5<sup>x+2</sup> = 5<sup>3</sup>.",w:""}, {s:"Основания равны — равны и показатели: x + 2 = 3.",w:"Приводим обе части к одному основанию: если aᶜ = aᵈ, то c = d. Это ключ ко всем показательным уравнениям."}, {s:"Отсюда x = 1.",w:""}], rule:{title:"Как решать показательные уравнения",text:"Главный приём — привести обе части к одному основанию. Если aᶜ = aᵈ, то c = d. Ищите, какой степенью основания является число справа: 125 = 5³, 64 = 2⁶, 81 = 3⁴."}},
   {fipi:"№7", tag:"показательные", lvl:3, t:"Решите уравнение 2<sup>x</sup> · 4<sup>x</sup> = 64.", a:"1,5", hint:"Замена основания: 4 = 2².", sol:["Приводим к одному основанию: 4<sup>x</sup> = (2<sup>2</sup>)<sup>x</sup> = 2<sup>2x</sup>.", "Тогда 2<sup>x</sup> · 2<sup>2x</sup> = 2<sup>3x</sup> — показатели сложились.", "Справа 64 = 2<sup>6</sup>.", "Значит 3x = 6, откуда x = 2."], solRich:[{s:"Приводим к одному основанию: 4<sup>x</sup> = (2<sup>2</sup>)<sup>x</sup> = 2<sup>2x</sup>.",w:""}, {s:"Тогда 2<sup>x</sup> · 2<sup>2x</sup> = 2<sup>3x</sup> — показатели сложились.",w:"Приравниваем показатели степеней — после того, как основания сравнялись."}, {s:"Справа 64 = 2<sup>6</sup>.",w:""}, {s:"Значит 3x = 6, откуда x = 2.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Как решать показательные уравнения",text:"Главный приём — привести обе части к одному основанию. Если aᶜ = aᵈ, то c = d. Ищите, какой степенью основания является число справа: 125 = 5³, 64 = 2⁶, 81 = 3⁴."}},

   {fipi:"№8", tag:"степени", lvl:3, t:"Найдите значение выражения 16<sup>3/4</sup>.", a:"8", hint:"Степень с дробным показателем: a^(m/n) = ⁿ√(aᵐ). Сначала извлекаем корень, потом возводим в степень.", sol:["Записываем степень через корень: 16<sup>3/4</sup> = <sup>4</sup>√(16<sup>3</sup>).", "Ищем, каким числом является 16 в степени 1/4: 16 = 2<sup>4</sup>.", "Извлекаем корень: <sup>4</sup>√16 = 2.", "Возводим в степень 3: 2<sup>3</sup> = 8."], solRich:[{s:"Записываем степень через корень: 16<sup>3/4</sup> = <sup>4</sup>√(16<sup>3</sup>).",w:"При умножении степеней показатели складываются, при делении — вычитаются, при возведении в степень — перемножаются."}, {s:"Ищем, каким числом является 16 в степени 1/4: 16 = 2<sup>4</sup>.",w:"При умножении степеней показатели складываются, при делении — вычитаются, при возведении в степень — перемножаются."}, {s:"Извлекаем корень: <sup>4</sup>√16 = 2.",w:"Корень — обратная операция к возведению в квадрат. Если под корнем полный квадрат, он извлекается устно."}, {s:"Возводим в степень 3: 2<sup>3</sup> = 8.",w:"При умножении степеней показатели складываются, при делении — вычитаются, при возведении в степень — перемножаются."}], rule:{title:"Как работать со степенями",text:"Три правила решают почти всё: при умножении степеней показатели складываются, при делении — вычитаются, при возведении степени в степень — перемножаются. Дробный показатель a^(m/n) — это ⁿ√(aᵐ). Отрицательный показатель a^(−n) = 1/aⁿ."}},
