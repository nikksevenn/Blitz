  qs:[
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите значение производной функции f(x) = x³ − 3x² + 5 в точке x₀ = 1.", a:"-3", hint:"Найдите f′(x), затем подставьте x₀.", sol:["f′(x) = 3x² − 6x.", "f′(1) = 3 − 6 = −3."], solRich:[{s:"f′(x) = 3x² − 6x.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"f′(1) = 3 − 6 = −3.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}], rule:{title:"Производная: правила",text:"(xⁿ)′ = n·xⁿ⁻¹. Производная суммы — сумма производных. Константа даёт 0. Постоянный множитель выносится. f′(x) показывает скорость изменения: если она положительна, функция растёт, если отрицательна — убывает."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите точку минимума функции f(x) = 2x³ − 6x + 1.", a:"1", hint:"В точке минимума производная меняет знак с «−» на «+».", sol:["f′(x) = 6x² − 6 = 6(x−1)(x+1).", "x = −1 и x = 1.", "При x = 1 знак меняется с «−» на «+» — минимум."], solRich:[{s:"f′(x) = 6x² − 6 = 6(x−1)(x+1).",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"x = −1 и x = 1.",w:""}, {s:"При x = 1 знак меняется с «−» на «+» — минимум.",w:"Смена знака производной различает максимум и минимум: «+» → «−» это максимум, «−» → «+» это минимум."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите точку максимума функции f(x) = x³ + 6x² + 9x + 8.", a:"-3", hint:"f′(x) = 3x² + 12x + 9.", sol:["f′(x) = 3(x+1)(x+3).", "Корни −3 и −1.", "При x = −3 знак меняется с «+» на «−» — максимум."], solRich:[{s:"f′(x) = 3(x+1)(x+3).",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Корни −3 и −1.",w:""}, {s:"При x = −3 знак меняется с «+» на «−» — максимум.",w:"Смена знака производной различает максимум и минимум: «+» → «−» это максимум, «−» → «+» это минимум."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите точку минимума функции f(x) = x² − 6x + 5.", a:"3", hint:"Вершина параболы x = −b/(2a).", sol:["f′(x) = 2x − 6 = 0.", "x = 3 — минимум."], solRich:[{s:"f′(x) = 2x − 6 = 0.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"x = 3 — минимум.",w:""}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"наибольшее значение", lvl:3, t:"Найдите наибольшее значение функции f(x) = x³ + 3x² − 9x + 1 на отрезке [−4; 0].", a:"28", hint:"Сравните значения в критических точках и на концах отрезка.", sol:["f′(x) = 3(x+3)(x−1); на [−4;0] попадает x = −3.", "f(−4) = 21; f(−3) = 28; f(0) = 1.", "Наибольшее: 28."], solRich:[{s:"f′(x) = 3(x+3)(x−1); на [−4;0] попадает x = −3.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"f(−4) = 21; f(−3) = 28; f(0) = 1.",w:""}, {s:"Наибольшее: 28.",w:""}], rule:{title:"Наибольшее и наименьшее значение функции",text:"На отрезке проверяем три вида точек: концы отрезка, точки экстремума внутри отрезка и точки, где производная не существует. Сравниваем значения функции во всех них — наибольшее и есть ответ."}},
   {fipi:"№9", tag:"наибольшее значение", lvl:3, t:"Найдите наименьшее значение функции f(x) = x² − 4x + 7 на отрезке [0; 3].", a:"3", hint:"Критическая точка x = 2 внутри отрезка.", sol:["f′(x) = 2x − 4 ⇒ x = 2.", "f(0) = 7; f(2) = 3; f(3) = 4.", "Наименьшее: 3."], solRich:[{s:"f′(x) = 2x − 4 ⇒ x = 2.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"f(0) = 7; f(2) = 3; f(3) = 4.",w:""}, {s:"Наименьшее: 3.",w:""}], rule:{title:"Наибольшее и наименьшее значение функции",text:"На отрезке проверяем три вида точек: концы отрезка, точки экстремума внутри отрезка и точки, где производная не существует. Сравниваем значения функции во всех них — наибольшее и есть ответ."}},
   {fipi:"№9", tag:"наибольшее значение", lvl:3, t:"Найдите наибольшее значение функции f(x) = x³ − 12x на отрезке [−3; 1].", a:"16", hint:"Критические точки x = ±2.", sol:["f(−3) = 9; f(−2) = 16; f(1) = −11.", "Наибольшее: 16."], solRich:[{s:"f(−3) = 9; f(−2) = 16; f(1) = −11.",w:""}, {s:"Наибольшее: 16.",w:""}], rule:{title:"Наибольшее и наименьшее значение функции",text:"На отрезке проверяем три вида точек: концы отрезка, точки экстремума внутри отрезка и точки, где производная не существует. Сравниваем значения функции во всех них — наибольшее и есть ответ."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Материальная точка движется по закону x(t) = t² − 4t + 3. Найдите скорость в момент t = 2 с.", a:"0", hint:"Скорость — производная координаты.", sol:["v(t) = 2t − 4.", "v(2) = 0."], solRich:[{s:"v(t) = 2t − 4.",w:""}, {s:"v(2) = 0.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите значение производной f(x) = 3x³ − 4x + 1 в точке x₀ = −1.", a:"5", hint:"f′(x) = 9x² − 4.", sol:["f′(−1) = 9 − 4.", "= 5."], solRich:[{s:"f′(−1) = 9 − 4.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"= 5.",w:""}], rule:{title:"Производная: правила",text:"(xⁿ)′ = n·xⁿ⁻¹. Производная суммы — сумма производных. Константа даёт 0. Постоянный множитель выносится. f′(x) показывает скорость изменения: если она положительна, функция растёт, если отрицательна — убывает."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите значение производной f(x) = x³ − 2x² + 3 в точке x₀ = 2.", a:"4", hint:"f′(x) = 3x² − 4x.", sol:["f′(2) = 12 − 8.", "= 4."], solRich:[{s:"f′(2) = 12 − 8.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"= 4.",w:""}], rule:{title:"Производная: правила",text:"(xⁿ)′ = n·xⁿ⁻¹. Производная суммы — сумма производных. Константа даёт 0. Постоянный множитель выносится. f′(x) показывает скорость изменения: если она положительна, функция растёт, если отрицательна — убывает."}},
   {fipi:"№9", tag:"чтение графика", lvl:3, t:"Прямая y = 5x + 8 параллельна касательной к графику y = x² + 4x + 5. Найдите абсциссу точки касания.", a:"0.5", hint:"Угловой коэффициент касательной — производная.", sol:["f′(x) = 2x + 4.", "2x + 4 = 5 ⇒ x = 0,5."], solRich:[{s:"f′(x) = 2x + 4.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"2x + 4 = 5 ⇒ x = 0,5.",w:""}], rule:{title:"Касательная к окружности",text:"Радиус, проведённый в точку касания, перпендикулярен касательной — это даёт прямоугольный треугольник, в котором работает теорема Пифагора и суммы углов. Из внешней точки: квадрат касательной равен произведению секущей на её внешнюю часть."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите значение производной f(x) = x³ + 2x − 5 в точке x₀ = 0.", a:"2", hint:"Сначала найдите f′(x), затем подставьте x₀ = 0.", sol:["f′(x) = (x³)′ + (2x)′ − (5)′ = 3x² + 2.", "Подставляем x = 0: f′(0) = 3·0 + 2.", "f′(0) = 2 — это угловой коэффициент касательной в точке x = 0."], solRich:[{s:"f′(x) = (x³)′ + (2x)′ − (5)′ = 3x² + 2.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Подставляем x = 0: f′(0) = 3·0 + 2.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"f′(0) = 2 — это угловой коэффициент касательной в точке x = 0.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}], rule:{title:"Производная: правила",text:"(xⁿ)′ = n·xⁿ⁻¹. Производная суммы — сумма производных. Константа даёт 0. Постоянный множитель выносится. f′(x) показывает скорость изменения: если она положительна, функция растёт, если отрицательна — убывает."}},
   {fipi:"№9", fig:"graphTangent45", tag:"чтение графика", lvl:3, t:"Прямая y = kx + 3 касается графика функции в точке с абсциссой x₀ (см. рисунок). Найдите значение производной в этой точке.", a:"1", hint:"f′(x₀) = k = tg α.", sol:["Производная равна тангенсу угла наклона касательной.", "По рисунку угол 45°.", "f′(x₀) = tg 45° = 1."], solRich:[{s:"Производная равна тангенсу угла наклона касательной.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"По рисунку угол 45°.",w:""}, {s:"f′(x₀) = tg 45° = 1.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}], rule:{title:"Производная: правила",text:"(xⁿ)′ = n·xⁿ⁻¹. Производная суммы — сумма производных. Константа даёт 0. Постоянный множитель выносится. f′(x) показывает скорость изменения: если она положительна, функция растёт, если отрицательна — убывает."}},
   {fipi:"№9", fig:"graph3ext", tag:"чтение графика", lvl:3, t:"На рисунке изображён график функции y = f(x) на интервале (−4; 6). Найдите количество точек, в которых производная равна нулю.", a:"3", hint:"Производная равна нулю в точках экстремума.", sol:["f′(x) = 0 в вершинах «горок» и «ямок».", "Таких точек на рисунке три."], solRich:[{s:"f′(x) = 0 в вершинах «горок» и «ямок».",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Таких точек на рисунке три.",w:""}], rule:{title:"Производная: правила",text:"(xⁿ)′ = n·xⁿ⁻¹. Производная суммы — сумма производных. Константа даёт 0. Постоянный множитель выносится. f′(x) показывает скорость изменения: если она положительна, функция растёт, если отрицательна — убывает."}},
   {fipi:"№9", fig:"graph2up", tag:"чтение графика", lvl:3, t:"На рисунке изображён график функции y = f(x) на интервале (−3; 8). Функция имеет два экстремума. Найдите количество промежутков, на которых производная функции положительна.", a:"2", hint:"Производная положительна там, где функция возрастает.", sol:["f′(x) > 0 на промежутках возрастания функции.", "Между двумя экстремумами график сначала растёт, потом падает, затем снова растёт — участков возрастания два.", "Ответ: 2."], solRich:[{s:"f′(x) > 0 на промежутках возрастания функции.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Между двумя экстремумами график сначала растёт, потом падает, затем снова растёт — участков возрастания два.",w:""}, {s:"Ответ: 2.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},

   {fipi:"№9", tag:"наибольшее значение", lvl:3, t:"Найдите наименьшее значение функции f(x) = x³ − 3x + 4 на отрезке [0; 2].", a:"2", hint:"Критическая точка x = 1.", sol:["f′(x) = 3x² − 3 ⇒ x = 1 (на отрезке).", "f(0) = 4; f(1) = 2; f(2) = 6.", "Наименьшее: 2."], solRich:[{s:"f′(x) = 3x² − 3 ⇒ x = 1 (на отрезке).",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"f(0) = 4; f(1) = 2; f(2) = 6.",w:""}, {s:"Наименьшее: 2.",w:""}], rule:{title:"Наибольшее и наименьшее значение функции",text:"На отрезке проверяем три вида точек: концы отрезка, точки экстремума внутри отрезка и точки, где производная не существует. Сравниваем значения функции во всех них — наибольшее и есть ответ."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите точку минимума функции f(x) = x + 4/x (x > 0).", a:"2", hint:"f′(x) = 1 − 4/x².", sol:["x² = 4 ⇒ x = 2 (x > 0).", "Производная меняет знак с «−» на «+»."], solRich:[{s:"x² = 4 ⇒ x = 2 (x > 0).",w:""}, {s:"Производная меняет знак с «−» на «+».",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:3, t:"Найдите точку максимума функции f(x) = −x² + 6x − 4.", a:"3", hint:"В точке максимума производная меняет знак с «+» на «−».", sol:["Находим производную: f′(x) = −2x + 6.", "Приравниваем к нулю: −2x + 6 = 0, откуда x = 3.", "Проверяем знак: при x < 3 производная положительна, при x > 3 — отрицательна.", "Знак меняется с «+» на «−» — это точка максимума. Ответ: 3."], solRich:[{s:"Находим производную: f′(x) = −2x + 6.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Приравниваем к нулю: −2x + 6 = 0, откуда x = 3.",w:"В точках экстремума касательная горизонтальна, поэтому производная там равна нулю."}, {s:"Проверяем знак: при x < 3 производная положительна, при x > 3 — отрицательна.",w:"Проверка отсекает лишние корни — особенно важно в логарифмических и иррациональных уравнениях."}, {s:"Знак меняется с «+» на «−» — это точка максимума. Ответ: 3.",w:"Смена знака производной различает максимум и минимум: «+» → «−» это максимум, «−» → «+» это минимум."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:2, t:"Найдите точку минимума функции f(x) = x² − 8x + 20.", a:"4", hint:"В точке минимума производная меняет знак с «−» на «+».", sol:["Производная: f′(x) = 2x − 8.", "Находим нуль производной: 2x − 8 = 0, x = 4.", "Слева от 4 производная отрицательна, справа положительна.", "Значит x = 4 — точка минимума."], solRich:[{s:"Производная: f′(x) = 2x − 8.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Находим нуль производной: 2x − 8 = 0, x = 4.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Слева от 4 производная отрицательна, справа положительна.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Значит x = 4 — точка минимума.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"вычисление производной", lvl:2, t:"Найдите значение производной функции f(x) = x³ − 3x в точке x = 2.", a:"9", hint:"Сначала найдите производную, потом подставьте точку.", sol:["Берём производную по правилу степени: f′(x) = 3x² − 3.", "Подставляем x = 2: f′(2) = 3 · 4 − 3.", "Считаем: 12 − 3 = 9."], solRich:[{s:"Берём производную по правилу степени: f′(x) = 3x² − 3.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Подставляем x = 2: f′(2) = 3 · 4 − 3.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Считаем: 12 − 3 = 9.",w:""}], rule:{title:"Производная: правила",text:"(xⁿ)′ = n·xⁿ⁻¹. Производная суммы — сумма производных. Константа даёт 0. Постоянный множитель выносится. f′(x) показывает скорость изменения: если она положительна, функция растёт, если отрицательна — убывает."}},
   {fipi:"№9", tag:"касательная", lvl:4, t:"Прямая y = 5x + 1 параллельна касательной к графику функции y = x² + 3x. Найдите абсциссу точки касания.", a:"1", hint:"У параллельных прямых одинаковый угловой коэффициент, а он равен производной в точке касания.", sol:["Угловой коэффициент прямой y = 5x + 1 равен 5.", "Касательная параллельна — значит её угловой коэффициент тоже 5.", "Производная функции: y′ = 2x + 3.", "Приравниваем: 2x + 3 = 5.", "Отсюда 2x = 2, x = 1."], solRich:[{s:"Угловой коэффициент прямой y = 5x + 1 равен 5.",w:"Геометрический смысл производной: f′(x₀) — угловой коэффициент касательной в этой точке."}, {s:"Касательная параллельна — значит её угловой коэффициент тоже 5.",w:"Геометрический смысл производной: f′(x₀) — угловой коэффициент касательной в этой точке."}, {s:"Производная функции: y′ = 2x + 3.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Приравниваем: 2x + 3 = 5.",w:"В точках экстремума касательная горизонтальна, поэтому производная там равна нулю."}, {s:"Отсюда 2x = 2, x = 1.",w:""}], rule:{title:"Касательная к окружности",text:"Радиус, проведённый в точку касания, перпендикулярен касательной — это даёт прямоугольный треугольник, в котором работает теорема Пифагора и суммы углов. Из внешней точки: квадрат касательной равен произведению секущей на её внешнюю часть."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:4, t:"Производная функции f(x) равна нулю в точках x = −2, x = 1 и x = 4. Известно, что при переходе через x = 1 производная меняет знак с «−» на «+». Найдите точку минимума функции.", a:"1", hint:"Минимум — там, где производная меняет знак с минуса на плюс.", sol:["Кандидаты на экстремум — все нули производной: −2, 1 и 4.", "Минимум соответствует переходу производной с «−» на «+»: функция убывала, потом начала расти.", "По условию такой переход — в точке x = 1.", "Ответ: 1."], solRich:[{s:"Кандидаты на экстремум — все нули производной: −2, 1 и 4.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Минимум соответствует переходу производной с «−» на «+»: функция убывала, потом начала расти.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"По условию такой переход — в точке x = 1.",w:""}, {s:"Ответ: 1.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"максимум и минимум", lvl:5, t:"Функция f(x) = 2x³ − 9x² + 12x. Найдите точки экстремума и укажите наибольшую.", a:"2", hint:"Найдите корни производной и проверьте смену знака.", sol:["Производная: f′(x) = 6x² − 18x + 12.", "Приравниваем к нулю и делим на 6: x² − 3x + 2 = 0.", "Корни: x = 1 и x = 2.", "При x < 1 производная положительна, между 1 и 2 — отрицательна, после 2 — снова положительна.", "Значит x = 1 — максимум, x = 2 — минимум. Наибольшая точка экстремума: 2."], solRich:[{s:"Производная: f′(x) = 6x² − 18x + 12.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Приравниваем к нулю и делим на 6: x² − 3x + 2 = 0.",w:"В точках экстремума касательная горизонтальна, поэтому производная там равна нулю."}, {s:"Корни: x = 1 и x = 2.",w:""}, {s:"При x < 1 производная положительна, между 1 и 2 — отрицательна, после 2 — снова положительна.",w:"Дифференцируем по правилам: (xⁿ)′ = n·xⁿ⁻¹, постоянная даёт 0, сумма дифференцируется почленно."}, {s:"Значит x = 1 — максимум, x = 2 — минимум. Наибольшая точка экстремума: 2.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Точки максимума и минимума",text:"Находим производную, приравниваем к нулю — это кандидаты. Затем проверяем смену знака: с «+» на «−» — максимум, с «−» на «+» — минимум. Просто нуль производной без смены знака экстремумом не является."}},
   {fipi:"№9", tag:"наибольшее значение", lvl:4, t:"Найдите наибольшее значение функции y = 2x² − 8x + 5 на отрезке [0; 3].", a:"5", hint:"Найдите вершину параболы и сравните со значениями на концах.", sol:["Вершина параболы: x = −b/(2a) = 8 : 4 = 2 — она попадает в отрезок.", "Значение в вершине: y(2) = 8 − 16 + 5 = −3.", "Значение на левом конце: y(0) = 5.", "Значение на правом конце: y(3) = 18 − 24 + 5 = −1.", "Наибольшее из {−3; 5; −1} равно 5."], solRich:[{s:"Вершина параболы: x = −b/(2a) = 8 : 4 = 2 — она попадает в отрезок.",w:""}, {s:"Значение в вершине: y(2) = 8 − 16 + 5 = −3.",w:""}, {s:"Значение на левом конце: y(0) = 5.",w:"Наибольшее и наименьшее значение на отрезке может достигаться и на концах — их проверяют обязательно."}, {s:"Значение на правом конце: y(3) = 18 − 24 + 5 = −1.",w:"Наибольшее и наименьшее значение на отрезке может достигаться и на концах — их проверяют обязательно."}, {s:"Наибольшее из {−3; 5; −1} равно 5.",w:""}], rule:{title:"Наибольшее и наименьшее значение функции",text:"На отрезке проверяем три вида точек: концы отрезка, точки экстремума внутри отрезка и точки, где производная не существует. Сравниваем значения функции во всех них — наибольшее и есть ответ."}},

{ id:"applied", title:"Прикладные задачи", emoji:"🔧", fipi:"№10", note:"формулы из физики и техники",
  qs:[
   {fipi:"№10", tag:"механика", lvl:3, t:"Скорость движения автомобиля v = 20 м/с. Какой путь он пройдёт за 15 секунд? Ответ дайте в метрах.", a:"300", hint:"Путь = скорость · время.", sol:["s = v · t = 20 · 15.", "= 300 м."], solRich:[{s:"s = v · t = 20 · 15.",w:""}, {s:"= 300 м.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№10", tag:"электричество", lvl:3, t:"Закон Ома: I = U / R. Найдите силу тока (в амперах) при U = 24 В и R = 8 Ом.", a:"3", hint:"Подставьте значения в формулу.", sol:["I = 24 / 8.", "= 3 А."], solRich:[{s:"I = 24 / 8.",w:""}, {s:"= 3 А.",w:""}], rule:{title:"Электричество",text:"Закон Ома: U = I·R. Мощность: P = U·I = I²R = U²/R. Работа: A = P·t. Следите за единицами: Вт · час = Вт·ч, а 1000 Вт = 1 кВт, поэтому Вт·ч : 1000 = кВт·ч."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Высота h (в метрах), на которой через t секунд окажется мяч, брошенный вертикально вверх со скоростью 20 м/с, вычисляется по формуле h = 20t − 5t². На какой высоте мяч окажется через 2 секунды?", a:"20", hint:"Подставьте t = 2.", sol:["h = 20·2 − 5·4.", "= 40 − 20 = 20 м."], solRich:[{s:"h = 20·2 − 5·4.",w:""}, {s:"= 40 − 20 = 20 м.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№10", tag:"электричество", lvl:3, t:"Мощность тока P = I²R. Найдите мощность (в ваттах) при I = 4 А и R = 5 Ом.", a:"80", hint:"P = I² · R.", sol:["P = 16 · 5.", "= 80 Вт."], solRich:[{s:"P = 16 · 5.",w:""}, {s:"= 80 Вт.",w:""}], rule:{title:"Электричество",text:"Закон Ома: U = I·R. Мощность: P = U·I = I²R = U²/R. Работа: A = P·t. Следите за единицами: Вт · час = Вт·ч, а 1000 Вт = 1 кВт, поэтому Вт·ч : 1000 = кВт·ч."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Площадь круга вычисляется по формуле S = πR². Найдите радиус (в метрах), если площадь равна 16π м².", a:"4", hint:"R² = S / π.", sol:["R² = 16.", "R = 4 м."], solRich:[{s:"R² = 16.",w:""}, {s:"R = 4 м.",w:""}], rule:{title:"Как искать площадь",text:"Выбор формулы зависит от того, что известно: основание и высота (S = ½ah), две стороны и угол (S = ½ab·sin C), три стороны (Герон), диагонали (S = ½d₁d₂sin φ). Если фигура — часть круга, используем доли: сектор 60° — это 1/6 круга."}},
   {fipi:"№10", tag:"теплота", lvl:3, t:"Температуру (в градусах Цельсия) можно перевести в Кельвины по формуле K = C + 273. Какова температура в Кельвинах, если C = 27 °C?", a:"300", hint:"Прибавьте 273.", sol:["27 + 273.", "= 300 К."], solRich:[{s:"27 + 273.",w:""}, {s:"= 300 К.",w:""}], rule:{title:"Температура и теплота",text:"Перевод шкал: T(К) = t(°C) + 273. Количество теплоты: Q = cmΔt (нагрев), Q = λm (плавление), Q = Lm (парообразование). Мощность нагревателя: P = Q/t."}},
   {fipi:"№10", tag:"электричество", lvl:3, t:"Работа постоянного тока A = UIt. Найдите работу (в джоулях) при U = 12 В, I = 2 А, t = 5 с.", a:"120", hint:"Перемножьте три величины.", sol:["A = 12 · 2 · 5.", "= 120 Дж."], solRich:[{s:"A = 12 · 2 · 5.",w:""}, {s:"= 120 Дж.",w:""}], rule:{title:"Электричество",text:"Закон Ома: U = I·R. Мощность: P = U·I = I²R = U²/R. Работа: A = P·t. Следите за единицами: Вт · час = Вт·ч, а 1000 Вт = 1 кВт, поэтому Вт·ч : 1000 = кВт·ч."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Стоимость поездки в такси S (в рублях) вычисляется по формуле S = 200 + 15t, где t — время в пути в минутах. Найдите стоимость поездки длиной 20 минут.", a:"500", hint:"Подставьте t = 20.", sol:["S = 200 + 15 · 20.", "= 200 + 300 = 500 руб."], solRich:[{s:"S = 200 + 15 · 20.",w:""}, {s:"= 200 + 300 = 500 руб.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Формула сложного процента: вклад S = S₀(1 + p/100). Вклад 10000 рублей под 8% годовых. Какой станет сумма через год? Ответ дайте в рублях.", a:"10800", hint:"Умножьте на 1,08.", sol:["S = 10000 · 1,08.", "= 10800 руб."], solRich:[{s:"S = 10000 · 1,08.",w:""}, {s:"= 10800 руб.",w:""}], rule:{title:"Проценты",text:"Процент — это доля: 1% = 0,01. «Повысили на 20%» = умножить на 1,2. «Снизили на 30%» = умножить на 0,7. Важно: последовательные проценты считаются от новой величины, поэтому +20% и потом −20% не возвращают к исходному числу."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Давление идеального газа p = nkT. Найдите давление (в единицах СИ), если n = 2, k = 1 (в условных единицах), T = 150.", a:"300", hint:"Перемножьте все множители.", sol:["p = 2 · 1 · 150.", "= 300."], solRich:[{s:"p = 2 · 1 · 150.",w:""}, {s:"= 300.",w:""}]},
   {fipi:"№10", tag:"механика", lvl:3, t:"Высота h = gt²/2 (g = 10 м/с²). Найдите высоту (в метрах), с которой тело падало 3 секунды.", a:"45", hint:"h = 10 · t² / 2.", sol:["h = 10 · 9 / 2.", "= 45 м."], solRich:[{s:"h = 10 · 9 / 2.",w:""}, {s:"= 45 м.",w:""}], rule:{title:"Механика",text:"Путь при равномерном движении S = v·t. Кинетическая энергия E = mv²/2, потенциальная E = mgh. Свободное падение h = gt²/2, скорость v = gt. Давление p = F/S. Работа A = F·S."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Кинетическая энергия E = mv²/2. Найдите энергию (в джоулях) при m = 6 кг и v = 10 м/с.", a:"300", hint:"E = 6 · 100 / 2.", sol:["E = 6 · 100 / 2.", "= 300 Дж."], solRich:[{s:"E = 6 · 100 / 2.",w:""}, {s:"= 300 Дж.",w:""}], rule:{title:"Механика",text:"Путь при равномерном движении S = v·t. Кинетическая энергия E = mv²/2, потенциальная E = mgh. Свободное падение h = gt²/2, скорость v = gt. Давление p = F/S. Работа A = F·S."}},
   {fipi:"№10", tag:"электричество", lvl:3, t:"Расход электроэнергии W = Pt. Найдите расход (в кВт·ч) при мощности 2 кВт за 3 часа.", a:"6", hint:"Перемножьте мощность и время.", sol:["W = 2 · 3.", "= 6 кВт·ч."], solRich:[{s:"W = 2 · 3.",w:""}, {s:"= 6 кВт·ч.",w:"Мощность — работа в единицу времени. 1000 Вт = 1 кВт, поэтому Вт·ч : 1000 даёт кВт·ч."}], rule:{title:"Электричество",text:"Закон Ома: U = I·R. Мощность: P = U·I = I²R = U²/R. Работа: A = P·t. Следите за единицами: Вт · час = Вт·ч, а 1000 Вт = 1 кВт, поэтому Вт·ч : 1000 = кВт·ч."}},
   {fipi:"№10", tag:"колебания", lvl:3, t:"Период колебаний маятника вычисляется по формуле T = 2π√(l/g), где l — длина в метрах, g = 10 м/с². Найдите длину маятника (в метрах), если T = 4π.", a:"40", hint:"Из формулы выразите √(l/g), затем возведите обе части в квадрат.", sol:["4π = 2π√(l/g) ⇒ √(l/g) = 2.", "l/g = 4 ⇒ l = 4 · 10 = 40 м."], solRich:[{s:"4π = 2π√(l/g) ⇒ √(l/g) = 2.",w:""}, {s:"l/g = 4 ⇒ l = 4 · 10 = 40 м.",w:""}], rule:{title:"Как работать с корнями",text:"Корень — обратная операция к возведению в квадрат: √a — это число, квадрат которого равен a. Произведение корней можно объединить под один корень, частное — тоже. Ищите под корнем полный квадрат: √36 = 6."}},
   {fipi:"№10", tag:"теплота", lvl:3, t:"Температура звёзд определяется законом М = 4,83 + 2,5 lg(L/L₀). Найдите L/L₀, если lg(L/L₀) = 2?", a:"100", hint:"2,5 · 2 = 5, но нам нужно только lg(L/L₀) = 2, значит L/L₀ = 10².", sol:["lg(L/L₀) = 2.", "L/L₀ = 10² = 100."], solRich:[{s:"lg(L/L₀) = 2.",w:""}, {s:"L/L₀ = 10² = 100.",w:""}], rule:{title:"Температура и теплота",text:"Перевод шкал: T(К) = t(°C) + 273. Количество теплоты: Q = cmΔt (нагрев), Q = λm (плавление), Q = Lm (парообразование). Мощность нагревателя: P = Q/t."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Время разгона автомобиля v = at. Найдите скорость (в м/с) через 8 секунд, если ускорение a = 2,5 м/с².", a:"20", hint:"v = a · t.", sol:["v = 2,5 · 8.", "= 20 м/с."], solRich:[{s:"v = 2,5 · 8.",w:""}, {s:"= 20 м/с.",w:"Свободное падение: h = gt²/2, скорость v = gt. Ускорение g ≈ 10 м/с²."}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№10", tag:"теплота", lvl:3, t:"Закон изменения температуры T = T₀ · 2^(−kt). Найдите T при T₀ = 80, k = 1/2, t = 4.", a:"20", hint:"2^(−2) = 1/4.", sol:["T = 80 · 2^(−2) = 80 · 1/4.", "= 20."], solRich:[{s:"T = 80 · 2^(−2) = 80 · 1/4.",w:""}, {s:"= 20.",w:""}], rule:{title:"Температура и теплота",text:"Перевод шкал: T(К) = t(°C) + 273. Количество теплоты: Q = cmΔt (нагрев), Q = λm (плавление), Q = Lm (парообразование). Мощность нагревателя: P = Q/t."}},
   {fipi:"№10", tag:"механика", lvl:3, t:"Объём шара V = (4/3)πR³. Найдите объём (в единицах π) при R = 3.", a:"36", hint:"4/3 · 27.", sol:["V = (4/3)π · 27 = 36π.", "Ответ: 36."], solRich:[{s:"V = (4/3)π · 27 = 36π.",w:""}, {s:"Ответ: 36.",w:"Финальный шаг — фиксируем результат."}], rule:{title:"Шар и сфера",text:"Объём шара V = (4/3)πR³, площадь поверхности S = 4πR². Обе формулы зависят от радиуса: объём — от куба, площадь — от квадрата. Поэтому при увеличении радиуса в k раз объём растёт в k³, а площадь — в k²."}},

   {fipi:"№10", tag:"механика", lvl:2, t:"Тело свободно падает без начальной скорости. Какой путь оно пройдёт за 3 секунды? g = 10 м/с², ответ в метрах.", a:"45", hint:"Для свободного падения: h = gt²/2.", sol:["Формула пути при свободном падении: h = g·t²/2.", "Квадрат времени: 3² = 9.", "Подставляем: h = 10 · 9 : 2.", "Считаем: 90 : 2 = 45 метров."], solRich:[{s:"Формула пути при свободном падении: h = g·t²/2.",w:"Закон Ома: U = I·R. Мощность: P = U·I. Работа: A = P·t."}, {s:"Квадрат времени: 3² = 9.",w:""}, {s:"Подставляем: h = 10 · 9 : 2.",w:""}, {s:"Считаем: 90 : 2 = 45 метров.",w:"Подставляем данные в формулу, следим за единицами измерения."}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},

   {fipi:"№10", tag:"механика", lvl:4, t:"Высота наклонной плоскости 1,5 м, длина 3 м. Найдите её КПД при подъёме груза, если сила трения отсутствует. Ответ в процентах.", a:"50", hint:"КПД = полезная работа / затраченная.", sol:["Полезная работа — поднять груз на высоту 1,5 м: A₁ = mgh.", "Затраченная — тянуть вдоль плоскости длиной 3 м: A₂ = F·3.", "Без трения F = mg·(h/l), так что отношение работ = h/l = 1,5 : 3 = 0,5.", "В процентах: 50%."], solRich:[{s:"Полезная работа — поднять груз на высоту 1,5 м: A₁ = mgh.",w:"Свободное падение: h = gt²/2, скорость v = gt. Ускорение g ≈ 10 м/с²."}, {s:"Затраченная — тянуть вдоль плоскости длиной 3 м: A₂ = F·3.",w:""}, {s:"Без трения F = mg·(h/l), так что отношение работ = h/l = 1,5 : 3 = 0,5.",w:""}, {s:"В процентах: 50%.",w:""}], rule:{title:"Проценты",text:"Процент — это доля: 1% = 0,01. «Повысили на 20%» = умножить на 1,2. «Снизили на 30%» = умножить на 0,7. Важно: последовательные проценты считаются от новой величины, поэтому +20% и потом −20% не возвращают к исходному числу."}},
   {fipi:"№10", tag:"теплота", lvl:1, t:"Температура по шкале Цельсия 27 °C. Чему равна температура по шкале Кельвина?", a:"300", hint:"T = t + 273.", sol:["Перевод в кельвины: T = t + 273.", "Подставляем: T = 27 + 273.", "Считаем: T = 300 К."], solRich:[{s:"Перевод в кельвины: T = t + 273.",w:"Перевод шкал: T(К) = t(°C) + 273."}, {s:"Подставляем: T = 27 + 273.",w:""}, {s:"Считаем: T = 300 К.",w:"Подставляем данные в формулу, следим за единицами измерения."}], rule:{title:"Температура и теплота",text:"Перевод шкал: T(К) = t(°C) + 273. Количество теплоты: Q = cmΔt (нагрев), Q = λm (плавление), Q = Lm (парообразование). Мощность нагревателя: P = Q/t."}},

   {fipi:"№11", tag:"движение", lvl:3, t:"Велосипедист проехал 60 км со скоростью 15 км/ч. Сколько часов он был в пути?", a:"4", hint:"t = s / v.", sol:["60 / 15.", "= 4 ч."], solRich:[{s:"60 / 15.",w:""}, {s:"= 4 ч.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№11", tag:"движение", lvl:3, t:"Два поезда вышли одновременно навстречу друг другу из городов, расстояние между которыми 400 км. Скорости 60 и 40 км/ч. Через сколько часов они встретятся?", a:"4", hint:"Скорость сближения.", sol:["Скорость сближения: 100 км/ч.", "400 / 100 = 4 ч."], solRich:[{s:"Скорость сближения: 100 км/ч.",w:"Основное соотношение: путь = скорость × время. При встречном движении скорости складываются."}, {s:"400 / 100 = 4 ч.",w:""}], rule:{title:"Независимые события",text:"Если события не влияют друг на друга, вероятности перемножаются: P(A и B) = P(A)·P(B). Вероятность «не произошло» = 1 − P. Для «ровно один из двух»: P(первый)·P(не второй) + P(не первый)·P(второй)."}},
   {fipi:"№11", tag:"движение", lvl:3, t:"Автомобиль проехал первые 120 км со скоростью 60 км/ч, а следующие 120 км — со скоростью 120 км/ч. Найдите среднюю скорость на всём пути.", a:"80", hint:"Средняя скорость — весь путь / всё время.", sol:["Время: 2 ч + 1 ч = 3 ч.", "Путь: 240 км.", "240 / 3 = 80 км/ч."], solRich:[{s:"Время: 2 ч + 1 ч = 3 ч.",w:""}, {s:"Путь: 240 км.",w:""}, {s:"240 / 3 = 80 км/ч.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№11", tag:"движение", lvl:3, t:"Лодка проплыла 30 км по течению за 2 часа. Найдите скорость течения, если собственная скорость лодки 12 км/ч.", a:"3", hint:"Скорость по течению = собственная + течение.", sol:["Скорость по течению: 30 / 2 = 15 км/ч.", "15 − 12 = 3 км/ч."], solRich:[{s:"Скорость по течению: 30 / 2 = 15 км/ч.",w:"Основное соотношение: путь = скорость × время. При встречном движении скорости складываются."}, {s:"15 − 12 = 3 км/ч.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},
   {fipi:"№11", tag:"работа", lvl:3, t:"Один рабочий может выполнить работу за 6 часов, другой — за 12 часов. За сколько часов они выполнят её вместе?", a:"4", hint:"Сложите производительности.", sol:["Производительность: 1/6 + 1/12 = 3/12 = 1/4 работы в час.", "Время: 4 ч."], solRich:[{s:"Производительность: 1/6 + 1/12 = 3/12 = 1/4 работы в час.",w:""}, {s:"Время: 4 ч.",w:""}], rule:{title:"Задачи на совместную работу",text:"Главный приём: считайте производительность как «долю работы за единицу времени». Если всё делается за 6 часов, то за час — 1/6. Производительности складываются. Время = 1 : (сумма производительностей)."}},
   {fipi:"№11", tag:"проценты", lvl:3, t:"Сплав содержит 20% меди. Сколько килограммов меди в 15 кг сплава?", a:"3", hint:"20% от 15.", sol:["15 · 0,2.", "= 3 кг."], solRich:[{s:"15 · 0,2.",w:""}, {s:"= 3 кг.",w:""}], rule:{title:"Проценты",text:"Процент — это доля: 1% = 0,01. «Повысили на 20%» = умножить на 1,2. «Снизили на 30%» = умножить на 0,7. Важно: последовательные проценты считаются от новой величины, поэтому +20% и потом −20% не возвращают к исходному числу."}},

   {fipi:"№11", tag:"проценты", lvl:3, t:"Бригада из 6 человек выполнила работу за 8 дней. За сколько дней ту же работу выполнят 12 человек той же производительности?", a:"4", hint:"Обратная пропорциональность.", sol:["Работа: 6 · 8 = 48 человеко-дней.", "48 / 12 = 4 дня."], solRich:[{s:"Работа: 6 · 8 = 48 человеко-дней.",w:""}, {s:"48 / 12 = 4 дня.",w:""}]},
   {fipi:"№11", tag:"проценты", lvl:3, t:"Из 40 кг свежих слив получают 8 кг чернослива. Сколько килограммов свежих слив нужно для 20 кг чернослива?", a:"100", hint:"Составьте пропорцию.", sol:["40 кг слив → 8 кг чернослива.", "Коэффициент 5. 20 · 5 = 100 кг."], solRich:[{s:"40 кг слив → 8 кг чернослива.",w:""}, {s:"Коэффициент 5. 20 · 5 = 100 кг.",w:""}]},

   {fipi:"№11", tag:"движение", lvl:3, t:"Катер прошёл 48 км против течения за 4 часа. Найдите собственную скорость катера, если скорость течения 2 км/ч.", a:"14", hint:"Скорость против течения = собственная − течение.", sol:["Скорость против течения: 48 / 4 = 12 км/ч.", "12 + 2 = 14 км/ч."], solRich:[{s:"Скорость против течения: 48 / 4 = 12 км/ч.",w:"Основное соотношение: путь = скорость × время. При встречном движении скорости складываются."}, {s:"12 + 2 = 14 км/ч.",w:""}], rule:{title:"Задачи на движение",text:"Основное: S = v·t. При движении навстречу скорости складываются, вдогонку — вычитаются. Если объекты в противоположных направлениях — расстояние растёт со скоростью суммы. Время в пути не путать с остановками."}},

   {fipi:"№11", tag:"работа", lvl:4, t:"Один рабочий делает деталь за 6 минут, второй — за 3 минуты. За сколько минут они сделают 30 деталей, работая вместе?", a:"60", hint:"Найдите совместную производительность.", sol:["Производительность первого: 1/6 детали в минуту.", "Второго: 1/3 детали в минуту.", "Вместе: 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2 детали в минуту.", "Значит одну деталь делают за 2 минуты.", "30 деталей: 30 · 2 = 60 минут."], solRich:[{s:"Производительность первого: 1/6 детали в минуту.",w:"Производительность — это доля работы за единицу времени. Если всё делается за 6 часов, то за час — 1/6."}, {s:"Второго: 1/3 детали в минуту.",w:""}, {s:"Вместе: 1/6 + 1/3 = 1/6 + 2/6 = 3/6 = 1/2 детали в минуту.",w:""}, {s:"Значит одну деталь делают за 2 минуты.",w:"Финальный шаг — фиксируем результат."}, {s:"30 деталей: 30 · 2 = 60 минут.",w:""}], rule:{title:"Задачи на совместную работу",text:"Главный приём: считайте производительность как «долю работы за единицу времени». Если всё делается за 6 часов, то за час — 1/6. Производительности складываются. Время = 1 : (сумма производительностей)."}},

var actx = null;
function tone(freq, dur, type, vol){
  try {
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  } catch(e){}
}

  var pools = setIds.map(function(si){
    var idx = [];
    for (var i = 0; i < SETS[si].qs.length; i++) idx.push(i);
    return {si: si, idx: shuffle(idx)};
  });
  pools = shuffle(pools);
  var out = [], guard = 0;
  while (out.length < n && guard++ < 400){
    var added = false;
    for (var i = 0; i < pools.length && out.length < n; i++){
      var p = pools[i];
      var take = 0;
      while (take < perSet && p.idx.length && out.length < n){
        out.push({si: p.si, qi: p.idx.pop()});
        take++; added = true;
      }
    }
    if (!added) break;
  }
  return shuffle(out);
}

/* ================= КОНТРОЛЬНЫЕ РАБОТЫ ================= */
function startControl(ki){
  var c = CONTROLS[ki];
  var pool = [];   // {si, qi}
  c.pick.forEach(function(pair){
    var secId = pair[0], tag = pair[1];
    var si = -1;
    for (var i = 0; i < SETS.length; i++){ if (SETS[i].id === secId){ si = i; break; } }
    if (si < 0) return;
    SETS[si].qs.forEach(function(q, qi){
      if (q.tag === tag) pool.push({si: si, qi: qi, lvl: q.lvl || 3});
    });
  });
  if (!pool.length){ alert("Не нашёл задач для этой работы"); return; }

  // берём сбалансированно по типу: сначала по одному из каждого pick, потом добираем
  var chosen = [], used = {};
  var byTag = {};
  pool.forEach(function(p){
    var q = SETS[p.si].qs[p.qi];
    var k = p.si + "|" + q.tag;
    (byTag[k] = byTag[k] || []).push(p);
  });
  Object.keys(byTag).forEach(function(k){ shuffle(byTag[k]); });
  var tagKeys = Object.keys(byTag);
  var round = 0;
  while (chosen.length < c.n && round < 20){
    var added = false;
    for (var i = 0; i < tagKeys.length && chosen.length < c.n; i++){
      var arr = byTag[tagKeys[i]];
      if (round < arr.length){
        chosen.push(arr[round]);
        added = true;
      }
    }
    if (!added) break;
    round++;
  }
  shuffle(chosen);

  beginControl(chosen, c);
}

/* ================= ИГРА ================= */
function begin(setIds, label, mode, keepName, opts){
  opts = opts || {};
  var name = keepName || currentName();
  var group = currentGroup();
  var ctrl = opts.ctrl !== undefined ? opts.ctrl : controlOn();

  var items;
  if (opts.items){
    items = opts.items;                    // готовый набор (контрольная работа)
  } else if (mode === "errors"){
    items = setIds;
  } else if (opts.tag){
    // узкая тема: только задачи с этим тегом
    var pool = [];
    setIds.forEach(function(si){
      SETS[si].qs.forEach(function(q, qi){
        if (q.tag === opts.tag) pool.push({si: si, qi: qi});
      });
    });
    items = shuffle(pool).slice(0, Math.min(10, pool.length));
  } else {
    var n = Math.min(10, SETS.reduce(function(a, s, i){
      return a + (setIds.indexOf(i) >= 0 ? s.qs.length : 0);
    }, 0));
    items = pickBalanced(setIds, n);
  }

  S = {
    items: items, idx: 0, label: label, mode: mode, ctrl: ctrl, name: name, group: group,
    score: 0, streak: 0, best: 0, correct: 0, log: [],
    t0: performance.now(), qt0: 0, timerId: null, answered: false, hintUsed: false, hints: 0,
    tag: opts.tag || "", kt: opts.kt || ""
  };
  confirmScreen();
}

      '</div>' +

        '<div class="hintrow">' +
          '<button class="btn hint" id="hintBtn">💡 Подсказка (−4 очка)</button>' +
          '<span class="hintnote">одна на задачу</span>' +
        '</div>' +
        '<div id="hintSlot"></div>') +
      '<div id="fbSlot"></div>' +
    '</section>';

  document.getElementById("quitBtn").onclick = function(){
    if (confirm("Выйти в меню? Прогресс этой попытки не сохранится.")) startScreen();
  };

  var inp = document.getElementById("ansInput");
  inp.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); submit(); }
  });
  inp.addEventListener("input", function(){

    if (n) n.style.display = "none";
  });

  document.getElementById("submitBtn").onclick = submit;
  var sb = document.getElementById("signBtn");
  sb.onclick = function(){
    var v = inp.value.trim();
    inp.value = (v.charAt(0) === "-" || v.charAt(0) === "−") ? v.slice(1) : "-" + v;
    inp.dispatchEvent(new Event("input"));
    inp.focus();
  };

function chips(){
  var a = document.getElementById("scoreChip"), b = document.getElementById("streakChip");
  if (a) a.textContent = "⭐ " + S.score;
  if (b) b.textContent = "🔥 " + S.streak;
}

function revealHint(){
  if (!S || S.answered || S.hintUsed) return;
  S.hintUsed = true; S.hints++;
  S.score = Math.max(0, S.score - 4);
  chips();
  var hb = document.getElementById("hintBtn");
  if (hb) hb.disabled = true;
  var q = taskOf(S.items[S.idx]);
  document.getElementById("hintSlot").innerHTML =
    '<div class="hintbox"><span>💡</span><span>' + q.hint + '</span></div>';
}

function submit(){
  if (!S || S.answered) return;
  var it = S.items[S.idx], q = taskOf(it);
  var inp = document.getElementById("ansInput");
  var raw = inp.value;

  if (String(raw).trim() === ""){
    inp.classList.add("shake");
    setTimeout(function(){ inp.classList.remove("shake"); }, 400);
    err("Введите ответ — число.");
    return;
  }
  var val = parseNum(raw);
  if (isNaN(val)){
    err("Не могу распознать ответ. Введите число, например 28 или 0,5");
    inp.focus();
    return;
  }

  var secs = (performance.now() - S.qt0) / 1000;
  clearInterval(S.timerId);
  S.answered = true;

  var ok = Math.abs(val - parseFloat(q.a)) < 1e-6;
  var earned = 0, mult = 1;
  if (ok){
    var bonus = Math.max(0, 5 - Math.floor(secs / 12));
    mult = S.streak >= 5 ? 2 : (S.streak >= 3 ? 1.5 : 1);
    earned = Math.round((10 + bonus) * mult);
    S.score += earned; S.correct++; S.streak++;
    if (S.streak > S.best) S.best = S.streak;
  } else {
    S.streak = 0;
  }
  S.log.push({si: it.si, qi: it.qi, ok: ok, raw: String(raw).trim(), secs: secs, earned: earned});
  chips();

  inp.disabled = true;
  var sb = document.getElementById("submitBtn");
  sb.disabled = true; sb.textContent = S.ctrl ? "Принято" : "Отвечено";
  var hb = document.getElementById("hintBtn");
  if (hb) hb.disabled = true;
  var pb = document.getElementById("progressBar");
  if (pb) pb.style.width = ((S.idx + 1) / S.items.length * 100) + "%";

  if (!S.ctrl){
    if (ok){ soundOK(); vib(35); } else { soundBad(); vib([25, 60, 25]); }
  } else {
    vib(15);
  }
  feedback(ok, earned, mult, raw, secs);
}

function err(msg){
  var n = document.getElementById("inlineErr");
  if (!n) return;
  n.textContent = msg; n.style.display = "block";
}

function feedback(ok, earned, mult, raw, secs){
  var last = S.idx === S.items.length - 1;
  var nextLabel = last ? (S.ctrl ? "🏁 Завершить и увидеть результат" : "🏁 Показать результат") : "Следующая задача →";
  var q = taskOf(S.items[S.idx]);
  var hintBlock = (S.hintUsed && q) ? '<div class="hintbox small"><span>💡</span><span>' + q.hint + '</span></div>' : "";
  var head;

  if (S.ctrl){
    head = '<h4><span>📥</span> Ответ принят</h4>' +
      '<div class="ansline">Результат и разбор — в конце. В контрольной ответы не показываются, чтобы не подсказывать.</div>';
  } else if (ok){
    head = '<h4><span>✅</span> Верно! <span class="earned">+' + earned + ' очков</span></h4>' +
      '<div class="ansline">Ответ: <span class="fbans">' + fmtAns(q.a) + '</span>' +
      ' · ' + Math.round(secs) + ' с' + (mult > 1 ? ' · серия ×' + mult : '') + '</div>';
  } else {
    head = '<h4><span>❌</span> Неверно <span class="earned bad">+0</span></h4>' +
      '<div class="ansline">Ваш ответ: <b>' + esc(String(raw).trim()) + '</b> · правильный ответ: <span class="fbans">' + fmtAns(q.a) + '</span></div>';
  }

  document.getElementById("fbSlot").innerHTML =
    '<div class="fb ' + (S.ctrl ? "neutral" : (ok ? "ok" : "bad")) + '">' + head + hintBlock +
      (!S.ctrl ? '<div class="ansline muted">Подробный разбор будет в конце — не подглядывайте в следующую задачу 😉</div>' : '') +
      '<button class="btn primary nextbtn" id="nextBtn">' + nextLabel + '</button>' +
    '</div>';

  var nb = document.getElementById("nextBtn");
  nb.onclick = next;
  nb.scrollIntoView({behavior: "smooth", block: "nearest"});
}

function next(){
  S.idx++;
  if (S.idx >= S.items.length){
    finish();
  } else {
    renderQ();
    window.scrollTo({top: 0, behavior: "smooth"});
  }
}

/* ================= ФИНАЛ ================= */
function finish(){
  clearInterval(S.timerId);
  var total = S.items.length;
  var acc = Math.round(S.correct / total * 100);
  var dur = (performance.now() - S.t0) / 1000;

  var agg = {};
  S.log.forEach(function(l){
    var s = setOf(l.si);
    if (!agg[l.si]) agg[l.si] = {title: s.title, emoji: s.emoji, ok: 0, n: 0};
    agg[l.si].n++;
    if (l.ok) agg[l.si].ok++;
  });

  S.acc = acc; S.dur = dur; S.agg = agg;
  S.mistakes = S.log.filter(function(l){ return !l.ok; });

  pushHistory({
    d: new Date().toLocaleDateString("ru-RU"),
    mode: S.label, name: S.name, c: S.correct, n: total,
    sc: S.score, sec: Math.round(dur), ctrl: S.ctrl,
    sets: Object.keys(agg).reduce(function(o, k){
      o[SETS[k].title] = [agg[k].ok, agg[k].n]; return o;
    }, {})
  });

  var color = acc >= 80 ? "#16a34a" : (acc >= 50 ? "#4f46e5" : "#e5484d");
  var verdict =
    acc === 100 ? "Идеально! Ни одной ошибки" :
    acc >= 80 ? "Отличный результат — почти всё верно" :
    acc >= 60 ? "Хорошо, но есть над чем поработать" :

/* ================= СТАТУС ОТПРАВКИ ================= */
/* ================= ДИАГРАММЫ ================= */
function barChart(items){
  var rows = items.map(function(it){
    var pct = it.n ? Math.round(it.ok / it.n * 100) : 0;
    var col = pct >= 80 ? "#16a34a" : (pct >= 50 ? "#4f46e5" : "#e5484d");
    return '<div class="brow">' +
      '<div class="blabel">' + it.label + '</div>' +
      '<div class="btrack"><div class="bfill" style="width:' + pct + '%;background:' + col + '"></div></div>' +
      '<div class="bval">' + it.ok + '/' + it.n + '</div>' +
    '</div>';
  }).join("");
  return '<div class="bchart">' + rows + '</div>';
}

function historyScreen(){
  var h = history();
  if (!h.length){ startScreen(); return; }

  var last = h.slice(-10);
  var W = 320, H = 150, pad = 26, bw = Math.min(64, (W - pad * 2) / last.length);
  var chartW = bw * last.length, x0 = (W - chartW) / 2;
  var bars = last.map(function(e, i){
    var pc = Math.round(e.c / e.n * 100);
    var hh = Math.max(3, (H - 46) * pc / 100);
    var x = x0 + i * bw + bw * 0.15, w = bw * 0.7;
    var col = pc >= 80 ? "#16a34a" : (pc >= 50 ? "#4f46e5" : "#e5484d");
    return '<rect x="' + x.toFixed(1) + '" y="' + (H - 24 - hh).toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="' + hh.toFixed(1) + '" rx="4" fill="' + col + '"/>' +
           '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 28 - hh).toFixed(1) +
           '" text-anchor="middle" class="lbl" font-size="10">' + pc + '</text>' +
           '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) +
           '" text-anchor="middle" class="lbl" font-size="9">' + esc(e.d.slice(0, 5)) + '</text>';
  }).join("");
  var chart = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
    '<line x1="' + pad + '" y1="' + (H - 24) + '" x2="' + (W - pad) + '" y2="' + (H - 24) +
    '" stroke="#d8dbec" stroke-width="1.4"/>' + bars + '</svg>';

  var agg = {};
  h.forEach(function(e){
    Object.keys(e.sets || {}).forEach(function(k){
      if (!agg[k]) agg[k] = {ok: 0, n: 0};
      agg[k].ok += e.sets[k][0]; agg[k].n += e.sets[k][1];
    });
  });
  var aggItems = Object.keys(agg).map(function(k){
    return {label: k, ok: agg[k].ok, n: agg[k].n};
  }).sort(function(a, b){ return (b.ok / b.n) - (a.ok / a.n); });

  var avg = Math.round(h.reduce(function(a, e){ return a + e.c / e.n; }, 0) / h.length * 100);

  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="backBtn" aria-label="Назад">←</button>' +
      '<div class="htitle">История и прогресс</div></div>' +
    '<section class="card">' +
      '<div class="stats">' +
        '<div class="stat"><div class="sl">Попыток</div><div class="sv">' + h.length + '</div></div>' +
        '<div class="stat"><div class="sl">Средний результат</div><div class="sv">' + avg + '%</div></div>' +
      '</div>' +
      '<div class="sectitle">Результаты последних попыток</div>' + chart +
      '<div class="sectitle">Освоение разделов (за всё время)</div>' + barChart(aggItems) +
      '<button class="btn soft wide" id="clearHist">Очистить историю</button>' +
    '</section>';

  document.getElementById("backBtn").onclick = startScreen;
  document.getElementById("clearHist").onclick = function(){
    if (confirm("Удалить всю историю прохождений на этом устройстве?")){
      lsSet(HIST_KEY, []);
      startScreen();
    }
  };
}

/* ================= РАЗБОР ================= */
function review(log, onlyErrors){
  var list = onlyErrors ? log.filter(function(l){ return !l.ok; }) : log;
  if (!list.length) list = log;

  var cards = list.map(function(l, i){
    var q = taskOf(l), s = setOf(l.si);
    var tagBadge = q.tag ? '<span class="tagbadge">' + esc(q.tag) + '</span>' : '';

    // ── правило-напоминание
    var ruleBox = "";
    if (q.rule){
      ruleBox = '<details class="rulebox"' + (l.ok ? '' : ' open') + '>' +
        '<summary>Правило: ' + esc(q.rule.title) + '</summary>' +
        '<div class="ruletext">' + q.rule.text + '</div>' +
      '</details>';
    }

    // ── шаги с пояснениями
    var steps = (q.solRich && q.solRich.length ? q.solRich : (q.sol || []).map(function(x){ return {s:x, w:""}; }));
    var stepsHtml = steps.map(function(x, si){
      var why = x.w ? '<div class="why">' + x.w + '</div>' : '';
      return '<li><div class="ss">' + x.s + '</div>' + why + '</li>';
    }).join("");

    var answerLine = l.ok
      ? '<div class="revans good">Ваш ответ: <b>' + esc(l.raw) + '</b> — верно ✓</div>'
      : '<div class="revans bad2">Ваш ответ: <b>' + esc(l.raw || "—") + '</b> · правильный: <b>' + fmtAns(q.a) + '</b></div>';

    return '<div class="revcard ' + (l.ok ? "ok" : "bad") + '">' +
      '<div class="revhead">' + (l.ok ? "✅ " : "❌ ") + esc(s.title) +
        ' <span class="fipibadge">' + esc(s.fipi) + '</span>' + tagBadge + '</div>' +
      (q.fig && F[q.fig] ? '<div class="fig small">' + F[q.fig] + '</div>' : '') +
      '<div class="revq">' + (i + 1) + '. ' + q.t + '</div>' +
      answerLine +
      (q.hint ? '<div class="revhint"><b>Ключ к задаче:</b> ' + q.hint + '</div>' : '') +
      ruleBox +
      '<div class="expTitle">Решение по шагам</div>' +
      '<ol class="steps">' + stepsHtml + '</ol>' +
    '</div>';
  }).join("");

  var errCount = log.filter(function(l){ return !l.ok; }).length;
  var tabs = '<div class="revtabs">' +
    '<button class="chip' + (onlyErrors ? "" : " on") + '" data-rev="all">Все решения (' + log.length + ')</button>' +
    '<button class="chip' + (onlyErrors ? " on" : "") + '" data-rev="err">Только ошибки (' + errCount + ')</button>' +
  '</div>';

  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="backBtn" aria-label="Назад">←</button>' +
      '<div class="htitle">Разбор решений</div></div>' +
    '<section class="card">' +
      tabs +
      '<div class="revintro">Каждый разбор разбит на шаги. Под шагом — <b>пояснение</b>, почему делаем именно так. ' +
      'Разверните <b>правило</b>, чтобы вспомнить теорию по этой теме.</div>' +
      cards +
      '<button class="btn primary wide" id="backBtn2">← Вернуться к результату</button>' +
    '</section>';

  var back = function(){ endAgain(); };
  document.getElementById("backBtn").onclick = back;
  document.getElementById("backBtn2").onclick = back;
  Array.prototype.forEach.call(document.querySelectorAll("[data-rev]"), function(b){
    b.onclick = function(){ review(S.log, b.getAttribute("data-rev") === "err"); window.scrollTo(0, 0); };
  });
}

  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="backBtn" aria-label="Назад">←</button>' +

      '<div id="imgSlot" class="imgslot"><div class="loadnote">Собираю картинку…</div></div>' +

        '<button class="btn send" id="shareBtn">📨 Отправить отчёт</button>' +

        '<button class="btn dark wide" id="txtBtn">📋 Скопировать текстом</button>' +
        '<button class="btn soft wide" id="backBtn2">← Назад к результату</button>' +

    document.getElementById("dlBtn").onclick = function(){ downloadReport(res); };
    document.getElementById("txtBtn").onclick = function(){
      copyText(reportText()).then(function(ok){
        document.getElementById("note").textContent = ok ? "Текст скопирован 👍" : "Выделите текст вручную.";
      });

    if (slot) slot.innerHTML = '<div class="loadnote">Не получилось нарисовать картинку. Используйте текстовый отчёт.</div>';

/* «Отправить отчёт» — универсально: файл → файл, иначе картинка+текст, иначе скачивание */
function shareReport(res){
  var note = document.getElementById("note");
  var who = (S && S.name ? S.name + " — " : "") + "математический блиц, " +
            (S ? S.correct + " из " + S.items.length : "");

  if (navigator.canShare && res.file && navigator.canShare({ files: [res.file] })){
    navigator.share({
      files: [res.file],
      title: "Отчёт: математический блиц",
      text: who
    }).catch(function(err){
      if (err && err.name === "AbortError") return;   // ученик сам отменил
      note.textContent = "Не получилось открыть «Поделиться». Нажмите «Скачать картинку» и отправьте её вручную.";
    });
    return;
  }

  // запасной путь: поделиться картинкой и текстом по отдельности
  if (navigator.share){
    navigator.share({
      title: "Отчёт: математический блиц",
      text: reportText()
    }).then(function(){
      note.textContent = "Текст отправлен. Картинку можно отправить кнопкой «Скачать картинку».";
    }).catch(function(){ downloadReport(res); });
    return;
  }

  downloadReport(res);
  note.textContent = "Картинка сохранена — отправьте её преподавателю вручную.";
}

function downloadReport(res){
  try {
    var a = document.createElement("a");
    a.href = res.dataUrl;
    a.download = "blitz-report.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e){}
}

function reportText(){
  var R = reportData();
  var lines = [];
  lines.push("Математический блиц · ЕГЭ-2027 (профиль)");
  lines.push("Дата: " + new Date().toLocaleDateString("ru-RU"));
  lines.push("Ученик: " + (S.name || "—") + (S.group ? " · " + S.group : ""));
  lines.push("Набор: " + S.label + (S.ctrl ? " (контрольная, без подсказок)" : ""));
  lines.push("Результат: " + S.correct + " из " + S.items.length + " (" + S.acc + "%)");
  var perTask = Math.round(S.dur / S.items.length);
  lines.push("Время: " + fmtTime(S.dur) + " · в среднем " + (perTask >= 1 ? perTask + " с" : "меньше секунды") + " на задачу");
  lines.push("");
  if (R.mode === "chart"){
    lines.push("КАРТА ТЕМ:");
    R.topics.forEach(function(t){
      var pct = Math.round(t.ok / t.n * 100);
      var mark = pct >= 80 ? "[+]" : (pct >= 50 ? "[~]" : "[-]");
      lines.push("  " + mark + " " + tagName(t.tag) + ": " + t.ok + "/" + t.n + " (" + pct + "%)");
    });
  } else if (R.topics.length === 1){
    lines.push("ТЕМА: " + tagName(R.topics[0].tag) + " — " + R.topics[0].ok + " из " + R.topics[0].n);
  }
  lines.push("");
  lines.push("ВЫВОДЫ:");
  R.conclusions.forEach(function(t, i){ lines.push((i + 1) + ". " + t); });
  lines.push("");
  lines.push(R.verdict.t + " " + R.verdict.d);
  lines.push("Разбор всех решений — в приложении, кнопка «Разбор решений».");
  return lines.join("\n");
}

function copyText(txt){
  return new Promise(function(res){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ res(true); }).catch(function(){ res(false); });
    } else res(false);
  });
}

/* ---- рисование картинки ---- */
function wrapText(ctx, text, maxW){
  var words = String(text).split(/\s+/), lines = [], cur = "";
  for (var i = 0; i < words.length; i++){
    var test = cur ? cur + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur){
      lines.push(cur); cur = words[i];
    } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function renderReport(){
  return new Promise(function(resolve, reject){
    try {
      var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function(){ resolve(drawReport()); }).catch(function(){ resolve(drawReport()); });
    } catch(e){ reject(e); }
  });
}

/* ================= ЛОГИКА ОТЧЁТА: КАРТА ТЕМ И ВЫВОДЫ =================
   Строит из лога попытки:
   - topics: разбивка по узким темам (tag) с результатом
   - verdict: короткий вердикт
   - conclusions: 3 вывода, зависящие от результата
   - сильная / слабая тема (если есть)
   - mode: "chart" (карта тем) | "plain" (только выводы)

   Тон: подбадривающий. Никаких приказов («чини», «начни»), никакого
   упоминания времени и скорости — ученик не должен чувствовать себя
   на ковре у тренера.
*/

// как тема называется в отчёте (короткие теги в базе — расшифровываем)
var TAG_PRETTY = {
  "классическая": "классическая вероятность",
  "сложные события": "сложные события",
  "показательные": "показательные уравнения",
  "логарифмические": "логарифмические уравнения",
  "квадратные": "квадратные уравнения",
  "тригонометрические": "тригонометрические уравнения",
  "среднее": "среднее арифметическое",
  "максимум и минимум": "максимум и минимум функции",
  "наибольшее значение": "наибольшее значение функции",
  "смеси": "задачи на смеси",
  "корни уравнения": "корни уравнений",
  "чтение графика": "чтение графика",
  "свойства функции": "свойства функции",
  "противоположные события": "противоположные события"
};

function tagName(t){
  t = String(t || "").trim();
  if (!t) return t;
  var full = TAG_PRETTY[t.toLowerCase()] || t;
  return full.charAt(0).toUpperCase() + full.slice(1);
}

function reportData(){
  var log = S.log || [];
  var total = log.length;
  var okCount = S.correct;
  var acc = S.acc;

  // ── разбивка по узким темам
  var byTag = {};
  log.forEach(function(l){
    var q = taskOf(l);
    var tag = q.tag || setOf(l.si).title;
    if (!byTag[tag]) byTag[tag] = { tag: tag, ok: 0, n: 0 };
    byTag[tag].n++;
    if (l.ok) byTag[tag].ok++;
  });
  var topics = Object.keys(byTag).map(function(k){ return byTag[k]; });
  topics.sort(function(a, b){
    var pa = a.ok / a.n, pb = b.ok / b.n;
    if (pa !== pb) return pa - pb;      // слабые первыми
    return b.n - a.n;                   // потом более «весомые»
  });

  // называем тему в отчёте только если в ней 3+ задач — иначе это шум
  var strong = null, weak = null;
  topics.forEach(function(t){
    if (t.ok === t.n && t.n >= 3 && !strong) strong = t;
  });
  weak = topics.filter(function(t){ return t.ok < t.n && t.n >= 3; })[0] ||
         topics.filter(function(t){ return t.ok < t.n; })[0] || null;
  var weakNamed = topics.filter(function(t){ return t.ok < t.n && t.n >= 3; })[0] || null;

  // насколько темы ровные: максимальная разница в долях
  var spread = 0;
  if (topics.length > 1){
    var ps = topics.map(function(t){ return t.ok / t.n; });
    spread = Math.max.apply(null, ps) - Math.min.apply(null, ps);
  }

  // ── прошлый результат: только по этой же теме (иначе сравнение бессмысленно)
  var h = history();
  var prev = null;
  for (var i = h.length - 2; i >= 0; i--){
    if (h[i].mode === S.label && h[i].n > 0){ prev = h[i]; break; }
  }
  var delta = prev ? (acc - Math.round(prev.c / prev.n * 100)) : null;

  // ── режим карты: полоски осмысленны, если на тему в среднем ≥2 задач
  // и самих тем не больше шести. Микс «по одной задаче из раздела» и узкая
  // подтема дают одну полоску — там карта не нужна, только выводы.
  var chartTopics = topics.slice(0, 6);
  var mode = (topics.length > 1 && topics.length <= 6 && total / topics.length >= 2)
             ? "chart" : "plain";

  // ── вердикт (короткая плашка внизу отчёта)
  var verdict;
  if (acc === 100)      verdict = { t: "Тема закрыта", d: "Ни одной ошибки — можно спокойно двигаться дальше." };
  else if (acc >= 80)   verdict = { t: "Почти отлично", d: "Основное уже получается — осталось разобрать пару мест." };
  else if (acc >= 60)   verdict = { t: "Хороший прогресс", d: "База есть, а остальное — дело практики: формулировки меняются, узнавание приходит." };
  else if (acc >= 40)   verdict = { t: "Половина пути", d: "Правила знакомы — осталось научиться узнавать их в новых задачах." };
  else                  verdict = { t: "Начало положено", d: "Дальше будет легче: сначала правило, потом задачи." };

  // ── три вывода
  var C = [];
  var narrow = topics.length === 1;

  // ---- 1) про результат: что уже получилось
  if (acc === 100){
    C.push("Отличная работа: все " + total + " задач решены верно. Тема держится уверенно.");
  } else if (delta !== null && delta >= 10){
    C.push("Заметный рост: +" + delta + " пунктов с прошлой попытки — усилия уже дают результат.");
  } else if (delta !== null && delta <= -10 && acc >= 60){
    C.push("Сегодня чуть скромнее, чем в прошлый раз, — и это нормальная часть пути: материал укладывается как раз через такие попытки.");
  } else if (acc >= 80){
    C.push("Крепкий результат: " + okCount + " из " + total + ". Основное получается, остались небольшие шероховатости.");
  } else if (okCount * 2 > total){
    C.push("Больше половины задач верны (" + okCount + " из " + total + ") — это хорошая основа, на неё можно опираться.");
  } else if (okCount * 2 === total){
    C.push("Ровно половина задач верна (" + okCount + " из " + total + ") — фундамент уже есть, и он крепнет с каждой разобранной задачей.");
  } else if (acc >= 40){
    C.push("Верно " + okCount + " из " + total + " — половина пути позади, база понемногу складывается.");
  } else if (okCount === 0){
    C.push("Пока ни одной верной задачи из " + total + " — так бывает, когда тема совсем новая. Первые разобранные задачи обычно дают самый большой сдвиг.");
  } else {
    C.push("Верно " + okCount + " из " + total + " — начало положено, и дальше будет заметно легче: сейчас просто не хватает узнавания.");
  }

  // ---- 2) про темы: что идёт хорошо и где разбор особенно поможет
  if (narrow && weak){
    var errN = weak.n - weak.ok;
    if (errN === 0){
      C.push("В этой теме ни одной ошибки — очень аккуратная работа.");
    } else if (errN === 1){
      C.push("Одна ошибка на всю тему — мелочь: спокойно разобрать её, и картина сложится.");
    } else if (errN <= 3){
      C.push("Почти всё в теме получается — разобрать стоит всего пару мест.");
    } else {
      C.push("Тема только начинает складываться, и это нормально: " + weak.ok + " из " + weak.n + " уже получается, остальное догонит практика.");
    }
  } else if (acc < 40 && !narrow){
    var zeroAll = topics.every(function(t){ return t.ok === 0; });
    if (zeroAll){
      C.push("Ни одна тема раздела пока не даётся — и это нормальная стартовая точка. Именно такие разделы быстрее всего растут после разбора.");
    } else {
      C.push("Ошибки разошлись по разным темам — значит проседает не одна тема, а общая база. Это как раз то, что быстро набирается практикой.");
    }
  } else if (weakNamed && strong && spread >= 0.34){
    C.push("Отлично идёт «" + tagName(strong.tag) + "»: " + strong.n + " из " + strong.n + ". А тема «" + tagName(weakNamed.tag) + "» даётся сложнее (" + weakNamed.ok + " из " + weakNamed.n + ") — там разбор поможет больше всего.");
  } else if (weakNamed && spread < 0.34){
    C.push("Темы идут ровно, без резких провалов: в самой осторожной " + weakNamed.ok + " из " + weakNamed.n + ". Хороший знак — можно двигаться по любой.");
  } else if (weakNamed){
    var soft = (weakNamed.ok * 2 >= weakNamed.n);
    C.push("Тема «" + tagName(weakNamed.tag) + "» " + (soft ? "даётся чуть сложнее" : "пока даётся сложнее") +
           ": " + weakNamed.ok + " из " + weakNamed.n + " — там разбор будет особенно полезен.");
  } else if (strong){
    C.push("Отлично идёт «" + tagName(strong.tag) + "»: " + strong.n + " из " + strong.n + " без единой ошибки.");
  } else if (acc === 100){
    C.push("Ошибок нет ни в одной теме — можно спокойно переходить к более сложному разделу.");
  } else {
    C.push("Задачи были из разных тем по одной — так бывает, когда материал новый. С разбором такие места быстро выравниваются.");
  }

  // ---- 3) про следующий шаг (без времени и без давления)
  if (acc >= 80){
    C.push("Хороший следующий шаг — контрольная по разделу: спокойно проверить себя без подсказок.");
  } else if (acc < 40){
    C.push("Спокойный первый шаг — разбор решений: там каждый шаг объяснён, и после него эти же задачи выглядят знакомыми.");
  } else if (weakNamed && weakNamed.n >= 3){
    C.push("Мягкий следующий шаг — 10 задач по теме «" + tagName(weakNamed.tag) + "»: узнавать такие задачи будет всё проще.");
  } else {
    C.push("Полезно вернуться к этой теме через день — спокойно, без спешки. Повторение заметно облегчает.");
  }

  return {
    topics: chartTopics, allTopics: topics, mode: mode,
    verdict: verdict, conclusions: C,
    strong: strong, weak: weak,
    delta: delta, prev: prev ? Math.round(prev.c / prev.n * 100) : null
  };
}

function drawReport(){
  var W = 1080;
  var secCount = Object.keys(S.agg).length;
  // считаем ровно по той же геометрии, что ниже: шапка 330 + отступ 60 + плитки 118
  // + заголовок разделов 34 + разделы по 50 + заголовок ошибок 52
  // + блок ошибок + подвал 150
  var H = 1400;   // стартовая оценка, ниже вырежем лишнее по фактической высоте

  var c = document.createElement("canvas");
  c.width = W; c.height = 2600;   // запас, в конце обрежем по факту
  var x = c.getContext("2d");
  var FONT = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

  x.fillStyle = "#f4f5fb"; x.fillRect(0, 0, W, c.height);
  var bg = x.createLinearGradient(0, 0, W, 330);
  bg.addColorStop(0, "#4f46e5"); bg.addColorStop(0.55, "#6d28d9"); bg.addColorStop(1, "#db2777");
  x.fillStyle = bg; x.fillRect(0, 0, W, 330);

  // ---- шапка
  x.fillStyle = "rgba(255,255,255,.85)";
  x.font = "700 26px " + FONT;
  x.fillText("МАТЕМАТИЧЕСКИЙ БЛИЦ", 64, 92);
  x.fillStyle = "#ffffff";
  x.font = "800 60px " + FONT;
  x.fillText(S.name ? S.name : "Отчёт", 64, 176);
  x.font = "500 32px " + FONT;
  x.fillStyle = "rgba(255,255,255,.92)";
  var subline = S.label + (S.group ? " · " + S.group : "") + (S.ctrl ? " · контрольная" : "") +
                " · " + new Date().toLocaleDateString("ru-RU");
  x.fillText(subline, 64, 228, W - 64 - 300);
  x.font = "500 26px " + FONT;
  x.fillStyle = "rgba(255,255,255,.72)";
  x.fillText("Задачи №1–12 ЕГЭ · банк ФИПИ", 64, 276, W - 64 - 300);

  // ---- круг с процентом
  var cx = W - 168, cy = 168, R = 86;
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2);
  x.fillStyle = "rgba(255,255,255,.18)"; x.fill();
  x.beginPath(); x.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (S.acc / 100));
  x.strokeStyle = "#ffffff"; x.lineWidth = 18; x.lineCap = "round"; x.stroke();
  x.fillStyle = "#ffffff"; x.textAlign = "center";
  x.font = "800 40px " + FONT;
  x.fillText(S.acc + "%", cx, cy + 6);
  x.font = "700 20px " + FONT;
  x.fillStyle = "rgba(255,255,255,.85)";
  x.fillText("верных", cx, cy + 42);
  x.textAlign = "left";

  // ---- карточки статистики
  var y = 380;
  var stats = [
    ["ВЕРНО", S.correct + " / " + S.items.length],
    ["ОЧКИ", String(S.score)],
    ["ВРЕМЯ", fmtTime(S.dur)],
    ["СЕРИЯ", String(S.best)]
  ];
  var cw = (W - 128 - 3 * 22) / 4;
  stats.forEach(function(st, i){
    var px = 64 + i * (cw + 22);
    roundRect(x, px, y, cw, 118, 20, "#ffffff");
    x.fillStyle = "#8b8fb0"; x.font = "700 19px " + FONT;
    x.fillText(st[0], px + 22, y + 42);
    x.fillStyle = "#161a2e"; x.font = "800 34px " + FONT;
    x.fillText(st[1], px + 22, y + 88);
  });

  // ---- карта тем / выводы
  var R = reportData();
  var yy = y + 178;

  if (R.mode === "chart"){
    x.fillStyle = "#4a4f72"; x.font = "800 24px " + FONT;
    x.fillText("КАРТА ТЕМ", 64, yy);
    yy += 40;

    R.topics.slice(0, 6).forEach(function(t){
      var pct = t.n ? t.ok / t.n : 0;
      var label = tagName(t.tag);
      // подбираем кегль так, чтобы подпись не наезжала на полоску
      var fs = 25;
      x.font = "700 " + fs + "px " + FONT;
      while (x.measureText(label).width > 380 && fs > 17){
        fs -= 1; x.font = "700 " + fs + "px " + FONT;
      }
      x.fillStyle = "#161a2e";
      x.fillText(label, 64, yy + 24);

      var bx = 470, bw2 = 400, bh = 18;
      roundRect(x, bx, yy + 8, bw2, bh, 9, "#e6e8f4");
      var col = pct >= 0.8 ? "#16a34a" : (pct >= 0.5 ? "#f0b429" : "#e5484d");
      if (pct > 0) roundRect(x, bx, yy + 8, Math.max(10, bw2 * pct), bh, 9, col);

      x.fillStyle = col; x.font = "800 23px " + FONT;
      x.textAlign = "right";
      x.fillText(t.ok + "/" + t.n, W - 64, yy + 25);
      x.textAlign = "left";
      yy += 52;
    });

    if (R.topics.length > 6){
      x.fillStyle = "#8b8fb0"; x.font = "600 21px " + FONT;
      x.fillText("и ещё тем: " + (R.topics.length - 6), 64, yy + 10);
      yy += 34;
    }
    yy += 20;
  } else if (R.topics.length === 1) {
    // узкая тема: вместо карты — одна крупная полоса результата
    x.fillStyle = "#4a4f72"; x.font = "800 24px " + FONT;
    x.fillText("РЕЗУЛЬТАТ", 64, yy);
    yy += 40;
    var tpct = R.topics.length ? R.topics[0].ok / R.topics[0].n : S.acc / 100;
    var topLabel = R.topics.length ? tagName(R.topics[0].tag) : S.label;
    x.fillStyle = "#161a2e"; x.font = "700 27px " + FONT;
    while (x.measureText(topLabel).width > 620){ x.font = "700 22px " + FONT; break; }
    x.fillText(topLabel, 64, yy + 26);
    roundRect(x, 64, yy + 54, W - 128, 26, 13, "#e6e8f4");
    var tcol = tpct >= 0.8 ? "#16a34a" : (tpct >= 0.5 ? "#f0b429" : "#e5484d");
    if (tpct > 0) roundRect(x, 64, yy + 54, Math.max(14, (W - 128) * tpct), 26, 13, tcol);
    x.fillStyle = tcol; x.font = "800 26px " + FONT;
    x.textAlign = "right";
    x.fillText(S.correct + " из " + S.items.length, W - 64, yy + 26);
    x.textAlign = "left";
    yy += 110;
  }

  // ---- выводы (всегда)
  if (R.mode !== "chart" && R.topics.length !== 1) yy += 34;
  x.fillStyle = "#4a4f72"; x.font = "800 24px " + FONT;
  x.fillText("ВЫВОДЫ", 64, yy);
  yy += 26;

  R.conclusions.forEach(function(txt, i){
    var lines = wrapText(x, txt, W - 64 - 140 - 28);
    var hgt = Math.max(64, 30 + lines.length * 34);
    roundRect(x, 64, yy, W - 128, hgt, 16, i === 0 ? "#f4f6ff" : "#ffffff");
    // номер
    roundRect(x, 88, yy + 20, 34, 34, 10, "#4f46e5");
    x.fillStyle = "#ffffff"; x.font = "800 19px " + FONT;
    x.textAlign = "center";
    x.fillText(String(i + 1), 105, yy + 44);
    x.textAlign = "left";
    // текст
    x.fillStyle = "#33385c"; x.font = "500 23px " + FONT;
    lines.forEach(function(ln, li){
      x.fillText(ln, 140, yy + 42 + li * 34);
    });
    yy += hgt + 12;
  });

  // ---- вердикт-плашка внизу
  yy += 10;
  var vlines = wrapText(x, R.verdict.d, W - 64 - 88 - 32);
  var vh = 54 + vlines.length * 32;
  roundRect(x, 64, yy, W - 128, vh, 18, "#eefaf2");
  x.fillStyle = "#0b7a43"; x.font = "800 25px " + FONT;
  x.fillText(R.verdict.t, 88, yy + 42);
  x.fillStyle = "#2f6b4a"; x.font = "500 22px " + FONT;
  vlines.forEach(function(ln, li){
    x.fillText(ln, 88, yy + 76 + li * 32);
  });
  yy += vh;

  // ---- подвал
  var fy = yy + 66;
  x.fillStyle = "#8b8fb0"; x.font = "600 22px " + FONT;
  x.fillText("Разбор всех решений — в приложении, кнопка «Разбор решений»", 64, fy);
  x.fillStyle = "#b6b9d0"; x.font = "600 20px " + FONT;
  x.fillText("Задачи — по структуре открытого банка ФИПИ", 64, fy + 30);

  // ---- обрезаем по фактической высоте
  var finalH = Math.min(c.height, Math.round(yy + 150));
  var c2 = document.createElement("canvas");
  c2.width = W; c2.height = finalH;
  c2.getContext("2d").drawImage(c, 0, 0);
  c = c2;

  var dataUrl = c.toDataURL("image/png");
  var file = null;
  try {
    var bin = atob(dataUrl.split(",")[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    file = new File([arr], "blitz-report.png", {type: "image/png"});
  } catch(e){ file = null; }
  return {dataUrl: dataUrl, file: file};
}

function roundRect(x, px, py, w, h, r, fill){
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
  x.fillStyle = fill; x.fill();
}

/* ================= ПАРАМЕТРЫ ССЫЛКИ ================= */
function fromUrl(){
  try {
    var p = new URLSearchParams(location.search);
    var n = p.get("name");
    if (n){ var el = document.getElementById("nameInput"); if (el) el.value = n.slice(0, 24); }
    var g = p.get("group");
    if (g){
      var gi = document.getElementById("groupInput");
      if (gi) gi.value = g.slice(0, 40);
    }
    var st = p.get("set");
    if (st){
      for (var i = 0; i < SETS.length; i++){
        if (SETS[i].id === st){ begin([i], SETS[i].title, "set"); return; }
      }
    }
  } catch(e){}
}

startScreen();
fromUrl();


})();

</script>
