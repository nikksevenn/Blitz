<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Математический блиц · ЕГЭ-2027, профиль</title>
<style>
:root{
  --bg:#f3f4fa; --card:#fff; --ink:#161a2e; --muted:#6b7190; --line:#e6e8f4;
  --accent:#4f46e5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 8% -10%,#e7e9ff 0%,transparent 60%),
    radial-gradient(800px 500px at 110% 0%,#ffe9f3 0%,transparent 55%),
    var(--bg);
  color:var(--ink); min-height:100vh;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
.app{max-width:560px;margin:0 auto;padding:18px 16px calc(48px + env(safe-area-inset-bottom))}

/* кнопки */
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:700;font-family:inherit;
  cursor:pointer;line-height:1.2;transition:transform .08s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;width:100%;
  box-shadow:0 10px 22px -10px rgba(79,70,229,.6)}
.btn.primary:disabled{opacity:.55}
.btn.soft{background:#eef0f7;color:#33385c;font-size:14.5px;padding:13px 10px;flex:1}
.btn.dark{background:#1f2233;color:#fff}
.btn.warn{background:#fff3e8;color:#9a3412;border:1px solid #fed7aa}
.btn.wide{width:100%;margin-top:10px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:16px;cursor:pointer;color:#565b7e;flex:0 0 auto}
.lnk{display:block;width:100%;margin-top:14px;background:none;border:0;color:#6d5ee8;
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:6px}

/* старт */
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#db2777 130%);
  border-radius:24px;padding:22px 20px 24px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 18px 40px -18px rgba(79,70,229,.6)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(220px 120px at 88% -10%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(200px 140px at -10% 120%,rgba(255,255,255,.18),transparent 60%)}
.hero-badge{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.045em;text-transform:uppercase;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 12px;border-radius:999px;margin-bottom:14px}
.hero h1{margin:0 0 8px;font-size:26px;line-height:1.15;letter-spacing:-.01em}
.hero p{margin:0;font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.9)}

.card{background:var(--card);border-radius:22px;padding:18px;border:1px solid rgba(230,232,244,.9);
  box-shadow:0 16px 40px -26px rgba(23,26,46,.35);margin-top:14px}
.namelabel{display:block;font-size:13px;font-weight:700;color:#41466a;margin-bottom:7px}
.namelabel span{color:#9a9db8;font-weight:600}
#nameInput{width:100%;font-size:16px;font-family:inherit;padding:13px 14px;border-radius:12px;
  border:1.5px solid #dfe1f0;background:#fbfbfe;outline:none;color:var(--ink)}
#nameInput:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.14);background:#fff}
.histline{margin-top:10px;font-size:13px;color:#5b6081;background:#f7f7fd;border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;line-height:1.4}
.mixwrap{margin-top:16px}
.mixbtn{font-size:16.5px;padding:15px}

/* переключатель */
.switchrow{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 13px;border:1px solid var(--line);
  border-radius:14px;background:#fbfbfe;cursor:pointer}
.sw{position:relative;flex:0 0 auto;margin-top:2px}
.sw input{position:absolute;opacity:0;width:44px;height:26px;margin:0;cursor:pointer}
.track{display:block;width:44px;height:26px;border-radius:999px;background:#d9dcec;transition:background .2s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked + .track{background:#4f46e5}
.sw input:checked + .track::after{transform:translateX(18px)}
.swtx{font-size:13.5px;color:#4b5074;line-height:1.35}
.swtx b{color:var(--ink)}
.swtx span{color:#8b8fb0;font-size:12.5px}

.orline{display:flex;align-items:center;gap:12px;margin:18px 0 12px;color:#9a9db8;
  font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--line)}

.topics{display:flex;flex-direction:column;gap:9px}
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;
  border:1px solid var(--line);border-radius:16px;padding:11px 12px;cursor:pointer;font-family:inherit;
  color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .08s}
.topic:hover{border-color:#c9c6f7;box-shadow:0 6px 18px -12px rgba(79,70,229,.45)}
.topic:active{transform:scale(.985)}
.topic .emoji{width:40px;height:40px;border-radius:12px;background:#f1f0ff;display:flex;
  align-items:center;justify-content:center;font-size:19px;flex:0 0 auto}
.topic .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.topic .tt{font-size:15px;font-weight:700}
.topic .tn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;font-weight:800;color:#5b4fd6;background:#f1f0ff;border-radius:8px;padding:4px 7px;white-space:nowrap}
.topic .count{font-size:12px;font-weight:700;color:#8b8fb0;background:#f5f6fb;padding:4px 8px;border-radius:999px}
.footnote{margin-top:16px;font-size:11.5px;line-height:1.6;color:#8b8fb0;text-align:center}

/* игра */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.htitle{font-size:16px;font-weight:800}
.barwrap{flex:1;height:9px;background:#e6e8f4;border-radius:999px;overflow:hidden}
.bar{height:100%;width:0;background:linear-gradient(90deg,#4f46e5,#a855f7);border-radius:999px;transition:width .35s}
.pcount{font-size:13px;font-weight:800;color:#6b7190;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:700;color:#3a3f63;font-variant-numeric:tabular-nums}
.chip.ctrl{background:#fff8e8;border-color:#fbe3b3;color:#8a5a05}
.qcard{background:#fff;border-radius:22px;padding:18px;border:1px solid rgba(230,232,244,.9);
  box-shadow:0 14px 34px -24px rgba(23,26,46,.4)}
.qtopic{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8b8fb0;
  margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fipibadge{font-size:10px;font-weight:800;letter-spacing:.02em;text-transform:none;color:#0a6ebd;
  background:#e8f3ff;border-radius:6px;padding:3px 6px}
.qtext{font-size:18px;line-height:1.45;font-weight:600}
.fig{background:#f8f8fe;border:1px solid #e9e8fb;border-radius:16px;padding:6px;margin-bottom:14px}
.fig.small{max-width:300px}
.fig svg{display:block;width:100%;height:auto}
.lbl{font:700 15px ui-sans-serif,system-ui,sans-serif;fill:#3a3f63}
.ansrow{display:flex;gap:8px;margin-top:18px}
.btn.sign{flex:0 0 auto;width:50px;padding:0;font-size:20px;font-weight:800;background:#eef0f7;color:#33385c;border-radius:14px}
.ansrow input{flex:1;min-width:0;font-size:18px;font-weight:700;font-family:inherit;padding:13px 16px;
  border-radius:14px;border:1.5px solid #dfe1f0;outline:none;background:#fbfbfe;color:var(--ink);font-variant-numeric:tabular-nums}
.ansrow input:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.15);background:#fff}
.ansrow input:disabled{opacity:.6}
.ansrow .btn.primary{width:auto;white-space:nowrap;padding:13px 18px;font-size:15.5px}
.inlineerr{color:#b42318;font-size:13px;font-weight:700;margin-top:8px;display:none}
.hintrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hintnote{font-size:12px;color:#9a9db8}
.btn.hint{background:#fff7e6;color:#a16207;border:1px solid #fde68a;font-size:14px;padding:10px 14px;border-radius:12px}
.btn.hint:disabled{opacity:.45;pointer-events:none}
.hintbox{margin-top:12px;background:#fffaf0;border:1px solid #fbe3b3;border-radius:14px;padding:13px 14px;
  font-size:14.5px;line-height:1.5;color:#7a4f05;display:flex;gap:9px}
.hintbox.small{font-size:13.5px;margin-top:10px}
.fb{margin-top:16px;border-radius:16px;padding:15px;border:1px solid}
.fb.ok{background:#effaf3;border-color:#bde8cd}
.fb.bad{background:#fef2f2;border-color:#f6c9cb}
.fb.neutral{background:#f7f7fd;border-color:#e2e4f2}
.fb h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb.ok h4{color:#0b7a43}
.fb.bad h4{color:#b42318}
.earned{margin-left:auto;font-size:14px;font-weight:800;color:#0b7a43}
.earned.bad{color:#b42318}
.ansline{font-size:14.5px;color:#454b6b;margin:2px 0 4px;line-height:1.5}
.ansline.muted{color:#8b8fb0;font-size:13px;margin-top:10px}
.fbans{font-weight:800;font-size:16px;color:var(--ink)}
.nextbtn{margin-top:16px}

/* финал */
.endcard{text-align:center;padding-top:22px}
.endtitle{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:16px}
.ring{width:134px;height:134px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center}
.ring .inner{width:106px;height:106px;border-radius:50%;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring .big{font-size:31px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ring .small{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.verdict{margin-top:14px;font-size:14.5px;color:#4b5074;line-height:1.5}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stat{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
.stat .sl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9a9db8}
.stat .sv{font-size:18px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.sectitle{margin:22px 0 10px;text-align:left;font-size:12px;font-weight:800;color:#33385c;
  text-transform:uppercase;letter-spacing:.06em}

/* столбчатая диаграмма */
.bchart{display:flex;flex-direction:column;gap:9px;text-align:left}
.brow{display:flex;align-items:center;gap:10px}
.blabel{flex:0 0 132px;font-size:12.5px;font-weight:700;color:#3f4468;line-height:1.2}
.btrack{flex:1;height:14px;background:#eef0f7;border-radius:999px;overflow:hidden}
.bfill{height:100%;border-radius:999px;transition:width .5s}
.bval{flex:0 0 42px;text-align:right;font-size:12.5px;font-weight:800;color:#4b5074;font-variant-numeric:tabular-nums}

.mistake{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-top:10px;text-align:left}
.mtag{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8b8fb0;margin-bottom:6px}
.mtext{font-size:13.5px;line-height:1.45;color:#33385c}
.mline{margin-top:8px;font-size:13px;color:#6b7190}
.mline b{color:var(--ink)}
.perfect{margin-top:14px;background:#effaf3;border:1px solid #bde8cd;color:#0b7a43;font-weight:700;
  border-radius:14px;padding:12px;font-size:14.5px;text-align:left}
.endbtns{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:10px}

/* разбор */
.revcard{background:#fbfbfe;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;text-align:left}
.revcard.ok{border-left:4px solid #34a853}
.revcard.bad{border-left:4px solid #e5484d}
.revhead{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#5b6081;margin-bottom:8px}
.revq{font-size:14.5px;line-height:1.45;color:#22263c;font-weight:600}
.revans{margin-top:6px;font-size:13px;color:#6b7190}
.expTitle{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#8b8fb0;margin:14px 0 2px}
.steps{margin:4px 0 0;padding:0;list-style:none;counter-reset:st}
.steps li{position:relative;padding-left:32px;margin:10px 0;font-size:14px;line-height:1.5;color:#33385c;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:7px;
  background:#eceafe;color:#5b4fd6;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center}

/* отчёт */
.imgslot{margin-top:4px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#f7f7fd}
.imgslot img{display:block;width:100%;height:auto}
.loadnote{padding:40px 16px;text-align:center;color:#8b8fb0;font-size:13.5px}
.modal-note{font-size:12px;line-height:1.45;color:#8b8fb0;margin-top:10px;min-height:16px;text-align:center}

.hidden{display:none!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s ease}

/* сетка разделов в два столбца */
.topics.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.topics.grid2 .topic{flex-direction:column;align-items:flex-start;gap:6px;padding:11px 11px 10px;position:relative}
.topics.grid2 .topic .emoji{width:32px;height:32px;border-radius:10px;font-size:16px}
.topics.grid2 .topic .tx{gap:1px}
.topics.grid2 .topic .tt{font-size:13.5px;line-height:1.2}
.topics.grid2 .topic .tn{font-size:10.5px;white-space:normal;line-height:1.25}
.topics.grid2 .badge{position:absolute;top:10px;right:9px;font-size:9.5px;padding:3px 5px}
.topics.grid2 .count{font-size:10px;padding:3px 7px;margin-top:2px}

/* поле группы */
.groupin{width:100%;font-size:14px;font-family:inherit;padding:11px 14px;border-radius:12px;
  border:1.5px solid #dfe1f0;background:#fbfbfe;outline:none;color:var(--ink);margin-top:8px}
.groupin:focus{border-color:#7c6cf6;box-shadow:0 0 0 4px rgba(124,108,246,.14);background:#fff}

/* статус отправки */
.syncbar{margin-top:14px;display:flex;align-items:center;gap:9px;border-radius:12px;padding:10px 12px;
  font-size:12.5px;font-weight:700;line-height:1.35}
.syncbar.ok{background:#effaf3;border:1px solid #bde8cd;color:#0b7a43}
.syncbar.fail{background:#fff7e6;border:1px solid #fbe3b3;color:#8a5a05}
.syncbar.wait{background:#eef4ff;border:1px solid #b9d4ff;color:#0a6eb9}
.syncbar .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}

/* отправка преподавателю */
.btn.send{background:linear-gradient(135deg,#0f766e,#059669);color:#fff;
  box-shadow:0 10px 22px -12px rgba(5,150,105,.7);width:100%}
.sendnote{font-size:13.5px;line-height:1.5;color:#4b5074;margin-bottom:12px}
.sendnote.small{font-size:11.5px;color:#9a9db8;margin:10px 0 14px;text-align:center}
.codebox{background:#0f172a;color:#a7f3d0;border-radius:14px;padding:14px 16px;margin-bottom:14px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;
  word-break:break-all;user-select:all;-webkit-user-select:all}

/* экран отчёта: главная кнопка и подсказка */
.sendhint{font-size:13.5px;line-height:1.5;color:#4b5074;margin-bottom:12px}
.endbtns .btn.send{width:100%}

</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* ===== ЧЕРТЕЖИ (inline SVG) ===== */
var INK = "#4f46e5", MUT = "#8b8fb0", DARK = "#161a2e", PINK = "#db2777";

function svg(inner){ return '<svg viewBox="0 0 340 200" role="img">' + inner + '</svg>'; }
function svgW(w, inner){ return '<svg viewBox="0 0 ' + w + ' 200" role="img">' + inner + '</svg>'; }
function dot(x, y, c){ return '<circle cx="' + x + '" cy="' + y + '" r="3.5" fill="' + (c || INK) + '"/>'; }
function lb(x, y, t, a){ return '<text x="' + x + '" y="' + y + '" text-anchor="' + (a || 'middle') + '" class="lbl">' + t + '</text>'; }
function seg(x1, y1, x2, y2){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + INK + '" stroke-width="2.4" stroke-linecap="round"/>';
}
function dashSeg(x1, y1, x2, y2, col){
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + (col || MUT) + '" stroke-width="1.7" stroke-dasharray="5 4"/>';
}
function circ(cx, cy, r){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffffff" stroke="' + INK + '" stroke-width="2.4"/>';
}
function poly(pts, close){
  return '<polygon points="' + pts + '" fill="#ffffff" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/>';
}
function arcAngle(cx, cy, r, a1, a2){
  var p1x = cx + r * Math.cos(a1 * Math.PI / 180), p1y = cy - r * Math.sin(a1 * Math.PI / 180);
  var p2x = cx + r * Math.cos(a2 * Math.PI / 180), p2y = cy - r * Math.sin(a2 * Math.PI / 180);
  var large = Math.abs(a2 - a1) > 180 ? 1 : 0;
  return '<path d="M' + p1x.toFixed(1) + ' ' + p1y.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 0 ' +
    p2x.toFixed(1) + ' ' + p2y.toFixed(1) + '" fill="none" stroke="' + PINK + '" stroke-width="2.6" stroke-linecap="round"/>';
}
function rightAngle(x, y, dx, dy){
  return '<path d="M' + (x + dx * 12) + ' ' + (y + dy * 12) + ' L' + (x + dx * 12 - dy * 12) + ' ' +
    (y + dy * 12 + dx * 12) + ' L' + (x - dy * 12) + ' ' + (y + dx * 12) + '" fill="none" stroke="' + MUT +
    '" stroke-width="1.6"/>';
}
function ell(cx, cy, rx, ry, fill){
  return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + (fill || '#ffffff') +
    '" stroke="' + INK + '" stroke-width="2.4"/>';
}
function arrow(x1, y1, x2, y2, col){
  var c = col || INK, ang = Math.atan2(y2 - y1, x2 - x1), L = 9, w = 0.42;
  var ax = x2 - L * Math.cos(ang - w), ay = y2 - L * Math.sin(ang - w);
  var bx = x2 - L * Math.cos(ang + w), by = y2 - L * Math.sin(ang + w);
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c +
    '" stroke-width="2.4" stroke-linecap="round"/>' +
    '<polygon points="' + x2 + ',' + y2 + ' ' + ax + ',' + ay + ' ' + bx + ',' + by + '" fill="' + c + '"/>';
}
/* график функции: pts = [[x,y],...] в координатах экрана */
function graph(pts, extra){
  var g = '<line x1="30" y1="170" x2="315" y2="170" stroke="#9aa0bb" stroke-width="1.6"/>' +
          '<line x1="44" y1="18" x2="44" y2="182" stroke="#9aa0bb" stroke-width="1.6"/>' +
          '<polygon points="315,170 306,166 306,174" fill="#9aa0bb"/>' +
          '<polygon points="44,18 40,27 48,27" fill="#9aa0bb"/>' +
          '<text x="322" y="174" class="lbl" font-size="12">x</text>' +
          '<text x="36" y="14" class="lbl" font-size="12">y</text>' +
          '<text x="34" y="184" class="lbl" font-size="12">0</text>';
  if (pts && pts.length){

var HIST_KEY = "blitz.hist.v3";

function lsGet(k, d){
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; }
}
function history(){ var h = lsGet(HIST_KEY, []); return Array.isArray(h) ? h : []; }
function pushHistory(entry){
  var h = history(); h.push(entry);
  if (h.length > 40) h = h.slice(h.length - 40);
  lsSet(HIST_KEY, h);
}

function fmtAns(s){ return String(s).replace("-", "−").replace(".", ","); }
function fmtTime(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function parseNum(raw){
  var s = String(raw).trim().replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(",", ".");
  if (/^-?\d+(\.\d+)?$/.test(s)) return parseFloat(s);
  var m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m){ var a = parseFloat(m[1]), b = parseFloat(m[2]); if (b !== 0) return a / b; }
  return NaN;
}
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function setOf(si){ return SETS[si]; }
function taskOf(it){ return SETS[it.si].qs[it.qi]; }

/* ================= ЗВУК И ВИБРАЦИЯ ================= */
var actx = null;
function tone(freq, dur, type, vol){
  try {
    if (!actx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.16, actx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  } catch(e){}
}
function soundOK(){
  tone(660, 0.1, "sine", 0.14);
  setTimeout(function(){ tone(990, 0.14, "sine", 0.13); }, 90);
}
function soundBad(){
  tone(200, 0.16, "triangle", 0.13);
  setTimeout(function(){ tone(150, 0.2, "triangle", 0.12); }, 110);
}
function vib(ms){
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

/* ================= РОЗЫГРЫШ ЗАДАЧ ================= */
function pickBalanced(setIds, n){
  var perSet = Math.max(1, Math.floor(n / setIds.length));
  var pools = setIds.map(function(si){
    var idx = [];
    for (var i = 0; i < SETS[si].qs.length; i++) idx.push(i);
    return {si: si, idx: shuffle(idx)};
  });
  pools = shuffle(pools);
  var out = [], guard = 0;
  while (out.length < n && guard++ < 400){
    var added = false;
    for (var i = 0; i < pools.length && out.length < n; i++){
      var p = pools[i];
      var take = 0;
      while (take < perSet && p.idx.length && out.length < n){
        out.push({si: p.si, qi: p.idx.pop()});
        take++; added = true;
      }
    }
    if (!added) break;
  }
  return shuffle(out);
}

    '</section>' +

    '<section class="card">' +
      '<label class="namelabel" for="nameInput">Имя ученика <span>(попадёт в отчёт)</span></label>' +
      '<input id="nameInput" type="text" placeholder="Например, Илья" autocomplete="off">' +
      '<input id="groupInput" class="groupin" type="text" placeholder="Группа или класс — необязательно" autocomplete="off">' +
      histLine +
      '<div class="mixwrap">' +
        '<button class="btn primary mixbtn" id="mixBtn">🎲 Микс: 10 задач из всех разделов</button>' +
      '</div>' +
      '<label class="switchrow" for="ctrlToggle">' +
        '<span class="sw"><input type="checkbox" id="ctrlToggle"><span class="track"></span></span>' +
        '<span class="swtx"><b>Режим контрольной</b><br><span>без подсказок и без ответов до конца</span></span>' +
      '</label>' +
      '<div class="orline"><span>или один раздел</span></div>' +
      '<div class="topics grid2">' + cards + '</div>' +
      '<div class="footnote">В каждом разделе 20–25 задач · выпадает 10 случайных<br>' +
        'Ответ: <b>0,5</b> или <b>0.5</b>, кнопка <b>±</b> меняет знак</div>' +
      (h.length ? '<button class="lnk" id="histBtn">📊 Моя история (' + h.length + ')</button>' : '') +
    '</section>';

  document.getElementById("mixBtn").onclick = function(){

    begin(all, "Микс", "mix");
  };

  for (var i = 0; i < tb.length; i++){

function currentName(){
  var el = document.getElementById("nameInput");
  return el ? el.value.trim() : "";
}
function urlGroupValue(){
  try {
    var mm = String(location.search || "").match(/[?&]group=([^&]*)/);
    if (mm) return decodeURIComponent(mm[1].replace(/\+/g, " ")).trim();
  } catch(e){}
  return "";
}
function controlOn(){
  var el = document.getElementById("ctrlToggle");
  return el ? el.checked : false;
}

/* ================= ИГРА ================= */
function begin(setIds, label, mode, keepName){
  var name = keepName || currentName();
  var gEl = document.getElementById("groupInput");
  var group = gEl ? gEl.value.trim() : "";
  if (!group) group = urlGroupValue() || STUDENT_GROUP_DEFAULT;
  var ctrl = controlOn();
  var n = Math.min(10, SETS.reduce(function(a, s, i){
    return a + (setIds.indexOf(i) >= 0 ? s.qs.length : 0);
  }, 0));

  var items = (mode === "errors") ? setIds : pickBalanced(setIds, n);

  S = {
    items: items, idx: 0, label: label, mode: mode, ctrl: ctrl, name: name, group: group,
    score: 0, streak: 0, best: 0, correct: 0, log: [],
    t0: performance.now(), qt0: 0, timerId: null, answered: false, hintUsed: false, hints: 0
  };
  renderQ();
}

function renderQ(){
  var it = S.items[S.idx], st = setOf(it.si), q = taskOf(it);
  var total = S.items.length;
  S.answered = false; S.hintUsed = false;

  app.innerHTML =
    '<div class="topbar">' +
      '<button class="iconbtn" id="quitBtn" aria-label="Выйти">✕</button>' +
      '<div class="barwrap"><div class="bar" id="progressBar" style="width:' + (S.idx / total * 100) + '%"></div></div>' +
      '<div class="pcount">' + (S.idx + 1) + '/' + total + '</div>' +
    '</div>' +
    '<div class="chips">' +
      '<span class="chip" id="timerChip">⏱ 0 с</span>' +
      '<span class="chip" id="scoreChip">⭐ ' + S.score + '</span>' +
      '<span class="chip" id="streakChip">🔥 ' + S.streak + '</span>' +
      (S.ctrl ? '<span class="chip ctrl">🎓 контрольная</span>' : '') +
    '</div>' +
    '<section class="qcard">' +
      '<div class="qtopic">' + st.emoji + ' ' + st.title +
        ' <span class="fipibadge">ФИПИ ' + st.fipi + '</span></div>' +
      (q.fig && F[q.fig] ? '<div class="fig">' + F[q.fig] + '</div>' : '') +
      '<div class="qtext">' + q.t + '</div>' +
      '<div class="ansrow">' +
        '<button class="btn sign" id="signBtn" aria-label="Сменить знак">±</button>' +
        '<input id="ansInput" type="text" inputmode="decimal" autocomplete="off" placeholder="Ответ" aria-label="Ответ">' +
        '<button class="btn primary" id="submitBtn">Ответить</button>' +
      '</div>' +
      '<div class="inlineerr" id="inlineErr"></div>' +
      (S.ctrl ? '' :
        '<div class="hintrow">' +
          '<button class="btn hint" id="hintBtn">💡 Подсказка (−4 очка)</button>' +
          '<span class="hintnote">одна на задачу</span>' +
        '</div>' +
        '<div id="hintSlot"></div>') +
      '<div id="fbSlot"></div>' +
    '</section>';

  document.getElementById("quitBtn").onclick = function(){
    if (confirm("Выйти в меню? Прогресс этой попытки не сохранится.")) startScreen();
  };

  var inp = document.getElementById("ansInput");
  inp.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ e.preventDefault(); submit(); }
  });
  inp.addEventListener("input", function(){
    var n = document.getElementById("inlineErr");
    if (n) n.style.display = "none";
  });

  document.getElementById("submitBtn").onclick = submit;
  var sb = document.getElementById("signBtn");
  sb.onclick = function(){
    var v = inp.value.trim();
    inp.value = (v.charAt(0) === "-" || v.charAt(0) === "−") ? v.slice(1) : "-" + v;
    inp.dispatchEvent(new Event("input"));
    inp.focus();
  };
  var hb = document.getElementById("hintBtn");
  if (hb) hb.onclick = revealHint;

  S.qt0 = performance.now();
  clearInterval(S.timerId);
  S.timerId = setInterval(function(){
    var t = document.getElementById("timerChip");
    if (t) t.textContent = "⏱ " + Math.floor((performance.now() - S.qt0) / 1000) + " с";
  }, 250);
}

function chips(){
  var a = document.getElementById("scoreChip"), b = document.getElementById("streakChip");
  if (a) a.textContent = "⭐ " + S.score;
  if (b) b.textContent = "🔥 " + S.streak;
}

function revealHint(){
  if (!S || S.answered || S.hintUsed) return;
  S.hintUsed = true; S.hints++;
  S.score = Math.max(0, S.score - 4);
  chips();
  var hb = document.getElementById("hintBtn");
  if (hb) hb.disabled = true;
  var q = taskOf(S.items[S.idx]);
  document.getElementById("hintSlot").innerHTML =
    '<div class="hintbox"><span>💡</span><span>' + q.hint + '</span></div>';
}

function submit(){
  if (!S || S.answered) return;
  var it = S.items[S.idx], q = taskOf(it);
  var inp = document.getElementById("ansInput");
  var raw = inp.value;

  if (String(raw).trim() === ""){
    inp.classList.add("shake");
    setTimeout(function(){ inp.classList.remove("shake"); }, 400);
    err("Введите ответ — число.");
    return;
  }
  var val = parseNum(raw);
  if (isNaN(val)){
    err("Не могу распознать ответ. Введите число, например 28 или 0,5");
    inp.focus();
    return;
  }

  var secs = (performance.now() - S.qt0) / 1000;
  clearInterval(S.timerId);
  S.answered = true;

  var ok = Math.abs(val - parseFloat(q.a)) < 1e-6;
  var earned = 0, mult = 1;
  if (ok){
    var bonus = Math.max(0, 5 - Math.floor(secs / 12));
    mult = S.streak >= 5 ? 2 : (S.streak >= 3 ? 1.5 : 1);
    earned = Math.round((10 + bonus) * mult);
    S.score += earned; S.correct++; S.streak++;
    if (S.streak > S.best) S.best = S.streak;
  } else {
    S.streak = 0;
  }
  S.log.push({si: it.si, qi: it.qi, ok: ok, raw: String(raw).trim(), secs: secs, earned: earned});
  chips();

  inp.disabled = true;
  var sb = document.getElementById("submitBtn");
  sb.disabled = true; sb.textContent = S.ctrl ? "Принято" : "Отвечено";
  var hb = document.getElementById("hintBtn");
  if (hb) hb.disabled = true;
  var pb = document.getElementById("progressBar");
  if (pb) pb.style.width = ((S.idx + 1) / S.items.length * 100) + "%";

  if (!S.ctrl){
    if (ok){ soundOK(); vib(35); } else { soundBad(); vib([25, 60, 25]); }
  } else {
    vib(15);
  }
  feedback(ok, earned, mult, raw, secs);
}

function err(msg){
  var n = document.getElementById("inlineErr");
  if (!n) return;
  n.textContent = msg; n.style.display = "block";
}

function feedback(ok, earned, mult, raw, secs){
  var last = S.idx === S.items.length - 1;
  var nextLabel = last ? (S.ctrl ? "🏁 Завершить и увидеть результат" : "🏁 Показать результат") : "Следующая задача →";
  var q = taskOf(S.items[S.idx]);
  var hintBlock = (S.hintUsed && q) ? '<div class="hintbox small"><span>💡</span><span>' + q.hint + '</span></div>' : "";
  var head;

  if (S.ctrl){
    head = '<h4><span>📥</span> Ответ принят</h4>' +
      '<div class="ansline">Результат и разбор — в конце. В контрольной ответы не показываются, чтобы не подсказывать.</div>';
  } else if (ok){
    head = '<h4><span>✅</span> Верно! <span class="earned">+' + earned + ' очков</span></h4>' +
      '<div class="ansline">Ответ: <span class="fbans">' + fmtAns(q.a) + '</span>' +
      ' · ' + Math.round(secs) + ' с' + (mult > 1 ? ' · серия ×' + mult : '') + '</div>';
  } else {
    head = '<h4><span>❌</span> Неверно <span class="earned bad">+0</span></h4>' +
      '<div class="ansline">Ваш ответ: <b>' + esc(String(raw).trim()) + '</b> · правильный ответ: <span class="fbans">' + fmtAns(q.a) + '</span></div>';
  }

  document.getElementById("fbSlot").innerHTML =
    '<div class="fb ' + (S.ctrl ? "neutral" : (ok ? "ok" : "bad")) + '">' + head + hintBlock +
      (!S.ctrl ? '<div class="ansline muted">Подробный разбор будет в конце — не подглядывайте в следующую задачу 😉</div>' : '') +
      '<button class="btn primary nextbtn" id="nextBtn">' + nextLabel + '</button>' +
    '</div>';

  var nb = document.getElementById("nextBtn");
  nb.onclick = next;
  nb.scrollIntoView({behavior: "smooth", block: "nearest"});
}

function next(){
  S.idx++;
  if (S.idx >= S.items.length){
    finish();
  } else {
    renderQ();
    window.scrollTo({top: 0, behavior: "smooth"});
  }
}

/* ================= ФИНАЛ ================= */
function finish(){
  clearInterval(S.timerId);
  var total = S.items.length;
  var acc = Math.round(S.correct / total * 100);
  var dur = (performance.now() - S.t0) / 1000;

  var agg = {};
  S.log.forEach(function(l){
    var s = setOf(l.si);
    if (!agg[l.si]) agg[l.si] = {title: s.title, emoji: s.emoji, ok: 0, n: 0};
    agg[l.si].n++;
    if (l.ok) agg[l.si].ok++;
  });

  S.acc = acc; S.dur = dur; S.agg = agg;
  S.mistakes = S.log.filter(function(l){ return !l.ok; });

  pushHistory({
    d: new Date().toLocaleDateString("ru-RU"),
    mode: S.label, name: S.name, c: S.correct, n: total,
    sc: S.score, sec: Math.round(dur), ctrl: S.ctrl,
    sets: Object.keys(agg).reduce(function(o, k){
      o[SETS[k].title] = [agg[k].ok, agg[k].n]; return o;
    }, {})
  });

  var color = acc >= 80 ? "#16a34a" : (acc >= 50 ? "#4f46e5" : "#e5484d");
  var verdict =
    acc === 100 ? "Идеально! Ни одной ошибки 🏆" :
    acc >= 80 ? "Отличный результат — почти всё верно 💪" :
    acc >= 60 ? "Хорошо, но есть над чем поработать 👍" :
    acc >= 40 ? "Половина пути пройдена — разберите разбор 📚" :
                "Тема пока хромает — обязательно посмотрите разбор 📚";

  var barItems = Object.keys(agg).map(function(k){
    var a = agg[k];
    return {label: a.emoji + " " + a.title, ok: a.ok, n: a.n};
  });

  var mistakesHtml = "";
  if (S.mistakes.length){
    mistakesHtml = '<div class="sectitle">Ошибки в этой попытке</div>' + S.mistakes.map(function(l, i){
      var q = taskOf(l), s = setOf(l.si);
      return '<div class="mistake">' +
        '<div class="mtag">' + s.emoji + ' ' + s.title + ' · ' + s.fipi + '</div>' +
        '<div class="mtext">' + (i + 1) + '. ' + q.t + '</div>' +
        '<div class="mline">Ваш ответ: <b>' + esc(l.raw) + '</b> → верно: <b>' + fmtAns(q.a) + '</b></div>' +
      '</div>';
    }).join("");
  } else {
    mistakesHtml = '<div class="perfect">Ошибок нет — можно ставить «отлично» 🎉</div>';
  }

  app.innerHTML =
    '<section class="card endcard">' +
      '<div class="endtitle">' + (S.name ? esc(S.name) + ', блиц' : "Блиц") + ' завершён!</div>' +
      '<div class="ring" style="background:conic-gradient(' + color + ' ' + Math.round(acc / 100 * 360) + 'deg, #e8e9f4 0)">' +
        '<div class="inner"><div class="big">' + acc + '%</div><div class="small">верных</div></div>' +
      '</div>' +
      '<div class="verdict">' + verdict + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="sl">Верно</div><div class="sv">' + S.correct + ' / ' + total + '</div></div>' +
        '<div class="stat"><div class="sl">Очки</div><div class="sv">⭐ ' + S.score + '</div></div>' +
        '<div class="stat"><div class="sl">Время</div><div class="sv">' + fmtTime(dur) + '</div></div>' +
        '<div class="stat"><div class="sl">Лучшая серия</div><div class="sv">🔥 ' + S.best + '</div></div>' +
      '</div>' +
      '<div class="sectitle">По разделам</div>' +
      barChart(barItems) +
      mistakesHtml +
      '<div class="endbtns">' +
        '<button class="btn send" id="reportBtn">📨 Отправить отчёт преподавателю</button>' +
        '<button class="btn dark" id="reviewBtn">📖 Разбор решений (' + total + ')</button>' +
        (S.mistakes.length ? '<button class="btn warn" id="againErrBtn">🎯 Повторить ошибки (' + S.mistakes.length + ')</button>' : '') +
        '<div class="row2">' +
          '<button class="btn soft" id="againBtn">🔁 Ещё раз</button>' +
          '<button class="btn soft" id="menuBtn">📚 Другая тема</button>' +
        '</div>' +
        '<button class="lnk" id="histBtn2">📊 История и прогресс</button>' +
      '</div>' +
    '</section>';

  document.getElementById("reportBtn").onclick = reportModal;
  document.getElementById("reviewBtn").onclick = function(){ review(S.log); };
  var ae = document.getElementById("againErrBtn");
  if (ae) ae.onclick = function(){
    var items = S.mistakes.map(function(l){ return {si: l.si, qi: l.qi}; });
    var lab = "Ошибки · " + S.label;
    S = {items: items, idx: 0, label: lab, mode: "errors", ctrl: false, name: S.name, group: S.group,
         score: 0, streak: 0, best: 0, correct: 0, log: [], t0: performance.now(), qt0: 0,
         timerId: null, answered: false, hintUsed: false, hints: 0};
    renderQ();
  };
  document.getElementById("againBtn").onclick = function(){
    var ids = Object.keys(S.agg).map(function(k){ return parseInt(k, 10); });
    begin(ids, S.label.replace("Ошибки · ", ""), S.mode === "errors" ? "set" : S.mode, S.name);
  };
  document.getElementById("menuBtn").onclick = startScreen;
  document.getElementById("histBtn2").onclick = historyScreen;
  window.scrollTo({top: 0, behavior: "smooth"});
}

/* ================= ДИАГРАММЫ ================= */
function barChart(items){
  var rows = items.map(function(it){
    var pct = it.n ? Math.round(it.ok / it.n * 100) : 0;
    var col = pct >= 80 ? "#16a34a" : (pct >= 50 ? "#4f46e5" : "#e5484d");
    return '<div class="brow">' +
      '<div class="blabel">' + it.label + '</div>' +
      '<div class="btrack"><div class="bfill" style="width:' + pct + '%;background:' + col + '"></div></div>' +
      '<div class="bval">' + it.ok + '/' + it.n + '</div>' +
    '</div>';
  }).join("");
  return '<div class="bchart">' + rows + '</div>';
}

function historyScreen(){
  var h = history();
  if (!h.length){ startScreen(); return; }

  var last = h.slice(-10);
  var W = 320, H = 150, pad = 26, bw = Math.min(64, (W - pad * 2) / last.length);
  var chartW = bw * last.length, x0 = (W - chartW) / 2;
  var bars = last.map(function(e, i){
    var pc = Math.round(e.c / e.n * 100);
    var hh = Math.max(3, (H - 46) * pc / 100);
    var x = x0 + i * bw + bw * 0.15, w = bw * 0.7;
    var col = pc >= 80 ? "#16a34a" : (pc >= 50 ? "#4f46e5" : "#e5484d");
    return '<rect x="' + x.toFixed(1) + '" y="' + (H - 24 - hh).toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="' + hh.toFixed(1) + '" rx="4" fill="' + col + '"/>' +
           '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 28 - hh).toFixed(1) +
           '" text-anchor="middle" class="lbl" font-size="10">' + pc + '</text>' +
           '<text x="' + (x + w / 2).toFixed(1) + '" y="' + (H - 8) +
           '" text-anchor="middle" class="lbl" font-size="9">' + esc(e.d.slice(0, 5)) + '</text>';
  }).join("");
  var chart = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
    '<line x1="' + pad + '" y1="' + (H - 24) + '" x2="' + (W - pad) + '" y2="' + (H - 24) +
    '" stroke="#d8dbec" stroke-width="1.4"/>' + bars + '</svg>';

  var agg = {};
  h.forEach(function(e){
    Object.keys(e.sets || {}).forEach(function(k){
      if (!agg[k]) agg[k] = {ok: 0, n: 0};
      agg[k].ok += e.sets[k][0]; agg[k].n += e.sets[k][1];
    });
  });
  var aggItems = Object.keys(agg).map(function(k){
    return {label: k, ok: agg[k].ok, n: agg[k].n};
  }).sort(function(a, b){ return (b.ok / b.n) - (a.ok / a.n); });

  var avg = Math.round(h.reduce(function(a, e){ return a + e.c / e.n; }, 0) / h.length * 100);

  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="backBtn" aria-label="Назад">←</button>' +
      '<div class="htitle">История и прогресс</div></div>' +
    '<section class="card">' +
      '<div class="stats">' +
        '<div class="stat"><div class="sl">Попыток</div><div class="sv">' + h.length + '</div></div>' +
        '<div class="stat"><div class="sl">Средний результат</div><div class="sv">' + avg + '%</div></div>' +
      '</div>' +
      '<div class="sectitle">Результаты последних попыток</div>' + chart +
      '<div class="sectitle">Освоение разделов (за всё время)</div>' + barChart(aggItems) +
      '<button class="btn soft wide" id="clearHist">Очистить историю</button>' +
    '</section>';

  document.getElementById("backBtn").onclick = startScreen;
  document.getElementById("clearHist").onclick = function(){
    if (confirm("Удалить всю историю прохождений на этом устройстве?")){
      lsSet(HIST_KEY, []);
      startScreen();
    }
  };
}

/* ================= РАЗБОР ================= */
function review(log){
  var rows = log.map(function(l, i){
    var q = taskOf(l), s = setOf(l.si);
    return '<div class="revcard ' + (l.ok ? "ok" : "bad") + '">' +
      '<div class="revhead">' + (l.ok ? "✅" : "❌") + ' ' + s.emoji + ' ' + s.title +
        ' <span class="fipibadge">ФИПИ ' + s.fipi + '</span></div>' +
      (q.fig && F[q.fig] ? '<div class="fig small">' + F[q.fig] + '</div>' : '') +
      '<div class="revq">' + (i + 1) + '. ' + q.t + '</div>' +
      '<div class="revans">Ваш ответ: <b>' + esc(l.raw) + '</b> · верно: <b>' + fmtAns(q.a) + '</b></div>' +
      '<div class="expTitle">Решение</div>' +
      '<ol class="steps">' + q.sol.map(function(x){ return "<li>" + x + "</li>"; }).join("") + '</ol>' +
    '</div>';
  }).join("");

  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="backBtn" aria-label="Назад">←</button>' +
      '<div class="htitle">Разбор решений</div></div>' +
    '<section class="card">' + rows +
      '<button class="btn primary wide" id="backBtn2">← Вернуться к результату</button>' +
    '</section>';

  var back = function(){ endAgain(); };
  document.getElementById("backBtn").onclick = back;
  document.getElementById("backBtn2").onclick = back;
}

/* вернуться на экран результата (без пересчёта) */
function endAgain(){
  var tmp = S; finish2(tmp);
}
function finish2(saved){
  S = saved;
  var total = S.items.length;
  var acc = S.acc;
  var color = acc >= 80 ? "#16a34a" : (acc >= 50 ? "#4f46e5" : "#e5484d");
  var verdict =
    acc === 100 ? "Идеально! Ни одной ошибки 🏆" :
    acc >= 80 ? "Отличный результат — почти всё верно 💪" :
    acc >= 60 ? "Хорошо, но есть над чем поработать 👍" :
    acc >= 40 ? "Половина пути пройдена — разберите разбор 📚" :
                "Тема пока хромает — обязательно посмотрите разбор 📚";
  var barItems = Object.keys(S.agg).map(function(k){
    var a = S.agg[k]; return {label: a.emoji + " " + a.title, ok: a.ok, n: a.n};
  });
  var mistakesHtml = S.mistakes.length
    ? '<div class="sectitle">Ошибки в этой попытке</div>' + S.mistakes.map(function(l, i){
        var q = taskOf(l), s = setOf(l.si);
        return '<div class="mistake"><div class="mtag">' + s.emoji + ' ' + s.title + ' · ' + s.fipi + '</div>' +
          '<div class="mtext">' + (i + 1) + '. ' + q.t + '</div>' +
          '<div class="mline">Ваш ответ: <b>' + esc(l.raw) + '</b> → верно: <b>' + fmtAns(q.a) + '</b></div></div>';
      }).join("")
    : '<div class="perfect">Ошибок нет — можно ставить «отлично» 🎉</div>';

  app.innerHTML =
    '<section class="card endcard">' +
      '<div class="endtitle">' + (S.name ? esc(S.name) + ', блиц' : "Блиц") + ' завершён!</div>' +
      '<div class="ring" style="background:conic-gradient(' + color + ' ' + Math.round(acc / 100 * 360) + 'deg, #e8e9f4 0)">' +
        '<div class="inner"><div class="big">' + acc + '%</div><div class="small">верных</div></div></div>' +
      '<div class="verdict">' + verdict + '</div>' +
      '<div class="stats">' +
        '<div class="stat"><div class="sl">Верно</div><div class="sv">' + S.correct + ' / ' + total + '</div></div>' +
        '<div class="stat"><div class="sl">Очки</div><div class="sv">⭐ ' + S.score + '</div></div>' +
        '<div class="stat"><div class="sl">Время</div><div class="sv">' + fmtTime(S.dur) + '</div></div>' +
        '<div class="stat"><div class="sl">Лучшая серия</div><div class="sv">🔥 ' + S.best + '</div></div>' +
      '</div>' +
      '<div class="sectitle">По разделам</div>' + barChart(barItems) + mistakesHtml +
      '<div class="endbtns">' +
        '<button class="btn send" id="reportBtn">📨 Отправить отчёт преподавателю</button>' +
        '<button class="btn dark" id="reviewBtn">📖 Разбор решений (' + total + ')</button>' +
        (S.mistakes.length ? '<button class="btn warn" id="againErrBtn">🎯 Повторить ошибки (' + S.mistakes.length + ')</button>' : '') +
        '<div class="row2">' +
          '<button class="btn soft" id="menuBtn">📚 Другая тема</button>' +
          '<button class="btn soft" id="histBtn2">📊 История</button>' +
        '</div>' +
      '</div>' +
    '</section>';

  document.getElementById("reportBtn").onclick = reportModal;
  document.getElementById("reviewBtn").onclick = function(){ review(S.log); };
  var ae = document.getElementById("againErrBtn");
  if (ae) ae.onclick = function(){
    var items = S.mistakes.map(function(l){ return {si: l.si, qi: l.qi}; });
    S = {items: items, idx: 0, label: "Ошибки · " + S.label, mode: "errors", ctrl: false, name: S.name, group: S.group,
         score: 0, streak: 0, best: 0, correct: 0, log: [], t0: performance.now(), qt0: 0,
         timerId: null, answered: false, hintUsed: false, hints: 0};
    renderQ();
  };
  document.getElementById("menuBtn").onclick = startScreen;
  document.getElementById("histBtn2").onclick = historyScreen;
  window.scrollTo({top: 0, behavior: "smooth"});
}


/* ================= ОТЧЁТ КАРТИНКОЙ ================= */
function reportModal(){
  app.innerHTML =
    '<div class="topbar"><button class="iconbtn" id="backBtn" aria-label="Назад">←</button>' +
      '<div class="htitle">Отчёт</div></div>' +
    '<section class="card">' +
      '<div class="sendhint">Отправьте отчёт преподавателю — в Telegram, ВК или любой мессенджер. Так он увидит ваш результат и ошибки.</div>' +
      '<div id="imgSlot" class="imgslot"><div class="loadnote">Собираю картинку…</div></div>' +
      '<div class="endbtns">' +
        '<button class="btn send" id="shareBtn">📨 Отправить отчёт</button>' +
        '<button class="btn primary wide" id="dlBtn">⬇️ Скачать картинку</button>' +
        '<button class="btn dark wide" id="txtBtn">📋 Скопировать текстом</button>' +
        '<button class="btn soft wide" id="backBtn2">← Назад к результату</button>' +
      '</div>' +
      '<div class="modal-note" id="note"></div>' +
    '</section>';
  document.getElementById("backBtn").onclick = function(){ finish2(S); };
  document.getElementById("backBtn2").onclick = function(){ finish2(S); };

  renderReport().then(function(res){
    var slot = document.getElementById("imgSlot");
    if (!slot) return;
    slot.innerHTML = '<img alt="Отчёт" src="' + res.dataUrl + '">';
    var dl = document.getElementById("dlBtn");
    document.getElementById("shareBtn").onclick = function(){ shareReport(res); };
    document.getElementById("dlBtn").onclick = function(){ downloadReport(res); };
    document.getElementById("txtBtn").onclick = function(){
      copyText(reportText()).then(function(ok){
        document.getElementById("note").textContent = ok ? "Текст скопирован 👍" : "Выделите текст вручную.";
      });
    };
  }).catch(function(){
    var slot = document.getElementById("imgSlot");
    if (slot) slot.innerHTML = '<div class="loadnote">Не получилось нарисовать картинку. Используйте текстовый отчёт.</div>';
    document.getElementById("txtBtn").onclick = function(){
      copyText(reportText()).then(function(ok){
        document.getElementById("note").textContent = ok ? "Текст скопирован 👍" : "";
      });
    };
  });
}


/* «Отправить отчёт» — универсально: файл → файл, иначе картинка+текст, иначе скачивание */
function shareReport(res){
  var note = document.getElementById("note");
  var who = (S && S.name ? S.name + " — " : "") + "математический блиц, " +
            (S ? S.correct + " из " + S.items.length : "");

  if (navigator.canShare && res.file && navigator.canShare({ files: [res.file] })){
    navigator.share({
      files: [res.file],
      title: "Отчёт: математический блиц",
      text: who
    }).catch(function(err){
      if (err && err.name === "AbortError") return;   // ученик сам отменил
      note.textContent = "Не получилось открыть «Поделиться». Нажмите «Скачать картинку» и отправьте её вручную.";
    });
    return;
  }

  // запасной путь: поделиться картинкой и текстом по отдельности
  if (navigator.share){
    navigator.share({
      title: "Отчёт: математический блиц",
      text: reportText()
    }).then(function(){
      note.textContent = "Текст отправлен. Картинку можно отправить кнопкой «Скачать картинку».";
    }).catch(function(){ downloadReport(res); });
    return;
  }

  downloadReport(res);
  note.textContent = "Картинка сохранена — отправьте её преподавателю вручную.";
}

function downloadReport(res){
  try {
    var a = document.createElement("a");
    a.href = res.dataUrl;
    a.download = "blitz-report.png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch(e){}
}

function reportText(){
  var lines = [];
  lines.push("📊 Математический блиц · ЕГЭ-2027 (профиль)");
  lines.push("Дата: " + new Date().toLocaleDateString("ru-RU"));
  lines.push("Ученик: " + (S.name || "—"));
  lines.push("Набор: " + S.label + (S.ctrl ? " (контрольная)" : ""));
  lines.push("Результат: " + S.correct + " из " + S.items.length + " (" + S.acc + "%)");
  lines.push("Очки: " + S.score + " · лучшая серия: " + S.best);
  lines.push("Время: " + fmtTime(S.dur) + " · в среднем " + Math.round(S.dur / S.items.length) + " с на задачу");
  var ks = Object.keys(S.agg);
  if (ks.length){
    lines.push("По разделам: " + ks.map(function(k){
      return S.agg[k].title + " " + S.agg[k].ok + "/" + S.agg[k].n;
    }).join(", "));
  }
  if (S.mistakes.length){
    lines.push("Ошибки:");
    S.mistakes.forEach(function(l, i){
      var q = taskOf(l), s = setOf(l.si);
      var t = q.t.replace(/\s+/g, " ");
      if (t.length > 140) t = t.slice(0, 137) + "…";
      lines.push((i + 1) + ") [" + s.title + "] " + t + " — ответ: " + l.raw + ", верно: " + fmtAns(q.a));
    });
  } else {
    lines.push("Ошибок нет 🎉");
  }
  return lines.join("\n");
}

function copyText(txt){
  return new Promise(function(res){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ res(true); }).catch(function(){ res(false); });
    } else res(false);
  });
}

/* ---- рисование картинки ---- */
function wrapText(ctx, text, maxW){
  var words = String(text).split(/\s+/), lines = [], cur = "";
  for (var i = 0; i < words.length; i++){
    var test = cur ? cur + " " + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur){
      lines.push(cur); cur = words[i];
    } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

function renderReport(){
  return new Promise(function(resolve, reject){
    try {
      var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function(){ resolve(drawReport()); }).catch(function(){ resolve(drawReport()); });
    } catch(e){ reject(e); }
  });
}

function drawReport(){
  var W = 1080;
  var secCount = Object.keys(S.agg).length;
  // считаем ровно по той же геометрии, что ниже: шапка 330 + отступ 60 + плитки 118
  // + заголовок разделов 34 + разделы по 50 + заголовок ошибок 52
  // + блок ошибок + подвал 150
  var errBlock = S.mistakes.length
    ? (Math.min(S.mistakes.length, 5) * 118 + (S.mistakes.length > 5 ? 34 : 0))
    : 84;
  var H = 330 + 60 + 118 + 60 + secCount * 50 + 52 + errBlock + 160;

  var c = document.createElement("canvas");
  c.width = W; c.height = Math.max(900, Math.round(H));
  var x = c.getContext("2d");
  var FONT = 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

  x.fillStyle = "#f4f5fb"; x.fillRect(0, 0, W, c.height);
  var bg = x.createLinearGradient(0, 0, W, 330);
  bg.addColorStop(0, "#4f46e5"); bg.addColorStop(0.55, "#6d28d9"); bg.addColorStop(1, "#db2777");
  x.fillStyle = bg; x.fillRect(0, 0, W, 330);

  // ---- шапка
  x.fillStyle = "rgba(255,255,255,.85)";
  x.font = "700 26px " + FONT;
  x.fillText("МАТЕМАТИЧЕСКИЙ БЛИЦ", 64, 92);
  x.fillStyle = "#ffffff";
  x.font = "800 60px " + FONT;
  x.fillText(S.name ? S.name : "Отчёт", 64, 176);
  x.font = "500 32px " + FONT;
  x.fillStyle = "rgba(255,255,255,.92)";
  var subline = S.label + (S.group ? " · " + S.group : "") + (S.ctrl ? " · контрольная" : "") +
                " · " + new Date().toLocaleDateString("ru-RU");
  x.fillText(subline, 64, 228, W - 64 - 300);
  x.font = "500 26px " + FONT;
  x.fillStyle = "rgba(255,255,255,.72)";
  x.fillText("Задачи №1–12 ЕГЭ · банк ФИПИ", 64, 276, W - 64 - 300);

  // ---- круг с процентом
  var cx = W - 168, cy = 168, R = 86;
  x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2);
  x.fillStyle = "rgba(255,255,255,.18)"; x.fill();
  x.beginPath(); x.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (S.acc / 100));
  x.strokeStyle = "#ffffff"; x.lineWidth = 18; x.lineCap = "round"; x.stroke();
  x.fillStyle = "#ffffff"; x.textAlign = "center";
  x.font = "800 40px " + FONT;
  x.fillText(S.acc + "%", cx, cy + 6);
  x.font = "700 20px " + FONT;
  x.fillStyle = "rgba(255,255,255,.85)";
  x.fillText("верных", cx, cy + 42);
  x.textAlign = "left";

  // ---- карточки статистики
  var y = 380;
  var stats = [
    ["ВЕРНО", S.correct + " / " + S.items.length],
    ["ОЧКИ", String(S.score)],
    ["ВРЕМЯ", fmtTime(S.dur)],
    ["СЕРИЯ", String(S.best)]
  ];
  var cw = (W - 128 - 3 * 22) / 4;
  stats.forEach(function(st, i){
    var px = 64 + i * (cw + 22);
    roundRect(x, px, y, cw, 118, 20, "#ffffff");
    x.fillStyle = "#8b8fb0"; x.font = "700 19px " + FONT;
    x.fillText(st[0], px + 22, y + 42);
    x.fillStyle = "#161a2e"; x.font = "800 34px " + FONT;
    x.fillText(st[1], px + 22, y + 88);
  });

  // ---- разделы
  var yy = y + 178;
  x.fillStyle = "#4a4f72"; x.font = "800 24px " + FONT;
  x.fillText("ПО РАЗДЕЛАМ", 64, yy);
  yy += 34;
  Object.keys(S.agg).forEach(function(k){
    var a = S.agg[k], pct = a.n ? a.ok / a.n : 0;
    x.fillStyle = "#161a2e"; x.font = "700 25px " + FONT;
    x.fillText(a.title, 64, yy + 24);
    var bx = 470, bw2 = 400, bh = 18;
    roundRect(x, bx, yy + 8, bw2, bh, 9, "#e6e8f4");
    var col = pct >= 0.8 ? "#16a34a" : (pct >= 0.5 ? "#4f46e5" : "#e5484d");
    if (pct > 0) roundRect(x, bx, yy + 8, Math.max(10, bw2 * pct), bh, 9, col);
    x.fillStyle = "#4a4f72"; x.font = "800 23px " + FONT;
    x.textAlign = "right";
    x.fillText(a.ok + "/" + a.n, W - 64, yy + 25);
    x.textAlign = "left";
    yy += 50;
  });

  // ---- ошибки
  yy += 34;
  x.fillStyle = "#4a4f72"; x.font = "800 24px " + FONT;
  x.fillText("НАД ЧЕМ РАБОТАТЬ", 64, yy);
  yy += 18;
  if (!S.mistakes.length){
    roundRect(x, 64, yy, W - 128, 84, 18, "#ecfdf3");
    x.fillStyle = "#0b7a43"; x.font = "700 28px " + FONT;
    x.fillText("Ошибок нет — отличная работа!", 92, yy + 52);
    yy += 84;
  } else {
    S.mistakes.slice(0, 5).forEach(function(l){
      var q = taskOf(l), s = setOf(l.si);
      roundRect(x, 64, yy, W - 128, 104, 18, "#ffffff");
      x.fillStyle = "#b42318"; x.font = "800 19px " + FONT;
      x.fillText(s.title.toUpperCase() + " · " + s.fipi, 92, yy + 32);
      x.fillStyle = "#33385c"; x.font = "500 23px " + FONT;
      var t = q.t.replace(/\s+/g, " ");
      var line = wrapText(x, t, W - 300)[0] || "";
      if (x.measureText(t).width > W - 300) line += "…";
      x.fillText(line, 92, yy + 62);
      x.fillStyle = "#8b8fb0"; x.font = "700 21px " + FONT;
      x.fillText("верно: " + fmtAns(q.a), 92, yy + 90);
      yy += 118;
    });
    if (S.mistakes.length > 5){
      x.fillStyle = "#8b8fb0"; x.font = "700 21px " + FONT;
      x.fillText("и ещё ошибок: " + (S.mistakes.length - 5), 92, yy + 6);
      yy += 34;
    }
  }

  // ---- подвал
  var fy = yy + 76;
  x.fillStyle = "#8b8fb0"; x.font = "600 23px " + FONT;
  x.fillText("Разбор всех решений — в приложении, кнопка «Разбор решений»", 64, fy);
  x.fillStyle = "#b6b9d0"; x.font = "600 21px " + FONT;
  x.fillText("Задачи — по структуре открытого банка ФИПИ", 64, fy + 32);

  var dataUrl = c.toDataURL("image/png");
  var file = null;
  try {
    var bin = atob(dataUrl.split(",")[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    file = new File([arr], "blitz-report.png", {type: "image/png"});
  } catch(e){ file = null; }
  return {dataUrl: dataUrl, file: file};
}

function roundRect(x, px, py, w, h, r, fill){
  x.beginPath();
  x.moveTo(px + r, py);
  x.arcTo(px + w, py, px + w, py + h, r);
  x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r);
  x.arcTo(px, py, px + w, py, r);
  x.closePath();
  x.fillStyle = fill; x.fill();
}

/* ================= ПАРАМЕТРЫ ССЫЛКИ ================= */
function fromUrl(){
  try {
    var p = new URLSearchParams(location.search);
    var n = p.get("name");
